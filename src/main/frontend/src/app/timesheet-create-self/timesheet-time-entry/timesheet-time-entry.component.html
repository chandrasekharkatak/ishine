<!-- Time Entry Section - Extracted Component -->
<div class="row">
    <div class="col-md-3 mb-0">

        <div class="info-wrapper">
            <div class="form-group input-wrapper">
                <label class="info-label">
                    <span class="text-danger">*</span> In Time
                </label>
                <mat-form-field appearance="outline" class="full-width">
                    <input matInput placeholder="Select In Time" readonly [ngModel]="officeInTime"
                        (ngModelChange)="onInTimeChange($event)" [matTimepicker]="officeInTimePicker" />
                    <mat-timepicker-toggle matSuffix [for]="officeInTimePicker"></mat-timepicker-toggle>
                    <mat-timepicker #officeInTimePicker></mat-timepicker>
                </mat-form-field>
                <p *ngIf="officeInTime">
                    <strong style="color:#193d8a;">In Time:</strong>
                    {{ officeInTime | date: 'hh:mm a' }}
                </p>
            </div>
        </div>
    </div>
    <div class="col-md-3 mb-0">
        
        <div class="info-wrapper">
            <div class="form-group input-wrapper">
                <label class="info-label">
                    <span class="text-danger">*</span> Out Time
                </label>
                <mat-form-field appearance="outline" class="full-width">
                    <input matInput placeholder="Select Out Time" autocomplete="off" readonly class="form-control static-input"
                        [ngModel]="officeOutTime" [disabled]="!officeInTime"
                        [matTimepicker]="officeOutTimePicker" (ngModelChange)="onOutTimeChange($event)" />
                    <mat-timepicker-toggle matSuffix [for]="officeOutTimePicker"></mat-timepicker-toggle>
                    <mat-timepicker #officeOutTimePicker></mat-timepicker>
                </mat-form-field>
                <p *ngIf="officeOutTime">
                    <strong style="color:#193d8a;">Out Time:</strong>
                    {{ officeOutTime | date:'hh:mm a' }}
                </p>
            </div>
            </div>
    </div>
    <div class="col-md-2 mb-0">
        <div class="info-wrapper">
            <div class="form-group">
                <label class="info-label">Total Working Hours</label>
                <input type="text" [ngModel]="totalWorkingOfficeHours" step="any"
                    class="form-control" autocomplete="none" value="0" disabled>
            </div>
        </div>
    </div>
    <div class="col-md-2 mb-0">
        <div class="info-wrapper">
            <div class="form-group">
                <label class="info-label">Night Shift</label>
                <input class="form-control cell-checkbox" 
                    [ngModel]="isNightShift"
                    (ngModelChange)="onNightShiftChange($event)"
                    (click)="onNightShiftClick($event)" 
                    type="checkbox" />
            </div>
        </div>
    </div>
</div>
