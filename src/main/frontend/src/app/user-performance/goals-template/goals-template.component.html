<div class="modal-header">
  <h5 class="modal-title">Select Goals</h5>
  <button type="button" class="close" (click)="modalRef.hide()">&times;</button>
</div>

<div class="modal-body">
  <table class="table table-striped">
    
    <thead>
      <tr>
        <th>Goal Name</th>
        <th>Assigned Date</th>
        <th>Completion Date</th>
        <th>Description</th>
        <th>Select Goal</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let goal of goals">
        <td>{{ goal.name }}</td>
        <td>{{ goal.assignedDate }}</td>
        <td><input type="date" [(ngModel)]="goal.completionDate" class="form-control"></td>
        <td>{{ goal.description }}</td>
        <td><input type="checkbox" [(ngModel)]="goal.selected"></td>
      </tr>
    </tbody>
  </table>

  
  <button class="btn btn-secondary btn-sm mb-2" (click)="toggleNewGoalForm()">
    {{ showNewGoalForm ? 'Cancel' : 'Add New Goal' }}
  </button>
  
  <div *ngIf="showNewGoalForm">
  <div class="row">
    <div class="col-md-3">
      <input type="text" [(ngModel)]="newGoal.name" class="form-control" placeholder="Goal Name">
    </div>
    <div class="col-md-3">
      <input type="date" [(ngModel)]="newGoal.assignedDate" class="form-control">
    </div>
    <div class="col-md-3">
      <input type="date" [(ngModel)]="newGoal.completionDate" class="form-control">
    </div>
    <div class="col-md-3">
      <input type="text" [(ngModel)]="newGoal.description" class="form-control" placeholder="Description">
    </div>
    <div class="col-md-12 mt-2">
      <button class="btn btn-success btn-sm" (click)="addGoal()">Add Goal</button>
    </div>
  </div>
  </div>
</div>

<div class="modal-footer">
  <button class="btn btn-primary" (click)="assignGoals()">Assign Goals</button>
</div>
