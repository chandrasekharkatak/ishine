<div class="modal-header">
    <h5 class="modal-title text-center"> Assign Goals to Group</h5>
    <button type="button" class="close" aria-label="Close" (click)="modalRef.hide()"><span aria-hidden="true">&times;</span></button>
  </div>
  <div class="modal-body">
    <div class="form-group">
      <label for="team">Team Name:</label>
      <select class="form-control w-25" id="team" [(ngModel)]="selectedTeam">
        <option *ngFor="let team of teams" [value]="team.id">{{ team.name }}</option>
      </select>
    </div>
    
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Employee Name</th>
          <th>No. of Goals</th>
          <th>Add to Group</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let employee of employees">
          <td>{{ employee.name }}</td>
          <td>{{ employee.goalsCount }}</td>
          <td>
            <button *ngIf="!employee.assigned" class="btn btn-success" (click)="assignToGroup(employee)">Add</button>
            <span *ngIf="employee.assigned">Added</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="modal-footer">
    <button class="btn btn-primary" (click)="proceedToGoalsTemplate()">Proceed to Goals Template</button>
  </div>
