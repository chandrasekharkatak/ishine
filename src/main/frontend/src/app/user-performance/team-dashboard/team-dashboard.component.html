<div class="container mt-0">
  <div class="row px-2" >
    <div class="col-md-12 table-header">
      <h1 class="table-header-title">Team Dashboard</h1>
    </div>
  </div>
    <div class="d-flex justify-content-between mb-3 ">
     
      <select class="form-control w-25">
        <option value="">Filter by Team</option>
        <option value="Team A">Team A</option>
        <option value="Team B">Team B</option>
        <option value="Team C">Team C</option>
      </select>
      <button class="btn btn-primary" (click)="openAssignGoalsGroupModal()">Assign to Group</button>
    </div>
    
 
    <div class="row">
        <div class="col-md-12">
          <div class="selector-toggle" (click)="toggleSearch()">
            <a href="javascript:void(0)">
                <i *ngIf="!isSearchEnabled" class="fa fa-search"></i>
                <i *ngIf="isSearchEnabled" class="fa-solid fa-xmark"></i>
            </a>
          </div>
          <div class="overflow-auto" bassHorizontalScroll [tableId]="'teamMemberInfo'" [tableTHeadId]="'teamMemberInfoTHead'"
          [tableTHeadTrId]="'teamMemberInfoTHeadTr'">
            <table class="table team-table" id="team-table" matSort (matSortChange)="sortData($event)">	
              <thead class="thead-light">	
                <tr>	
                  <th scope="col" class="info-label">Sr No.</th>	
                  
                  <th scope="col" class="info-label" mat-sort-header="name|string">Employee Name</th>	
                  <th scope="col" class="info-label" mat-sort-header="department|string">Department</th>	
                  <th scope="col" class="info-label" mat-sort-header="totalGoals|number">Total Goals</th>	
                  <th scope="col" class="info-label" mat-sort-header="goalsCompleted|number">Goals Completed</th>
                  <th >Action</th>
                  </tr>
                  <tr app-column-filter-bar *ngIf="isSearchEnabled" [columnList]="teamMemberColumns" (onSearch)="onSearch($event);page=1" ></tr>
                </thead>
                <tbody>
                  <tr *ngIf="viewTeamMemberList.length == 0 || (viewTeamMemberList| colFilter:filters:false).length == 0">
                    <th colspan="8" class="text-center info-label">No details to display...</th>
                  </tr>
                  <tr *ngFor="let viewTeamMember of viewTeamMemberList| colFilter:filters:false | sort : [sortColumn, sortColumnType, sortDirection] | paginate: { itemsPerPage: 10, currentPage: page }; let i = index">
                    <td>{{10*(page-1)+i+1}}</td>
                    
                    <td>{{viewTeamMember.name}}</td>
                    <td>{{viewTeamMember.department}}</td>
                    <td>{{viewTeamMember.totalGoals}}</td>
                    <td>{{viewTeamMember.goalsCompleted}}</td>
                    <td>
                      <button class="btn btn-sm btn-outline-primary mb-1" type="submit"
                       (click)=" getEmployeePerformance(viewTeamMember)"
                      ><span>View Performance </span></button>&nbsp;
                    </td>
                  </tr>
                </tbody>
              </table>
          </div>
          <pagination-controls class="my-pagination" [hidden]="viewTeamMemberList.length == 0" (pageChange)="handlePageChange($event)"></pagination-controls> 
        </div>
      </div>
  </div>
