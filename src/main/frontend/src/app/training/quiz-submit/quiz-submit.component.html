<div class="row" >
    <div class="card col-md-12 px-0">
        <div class="card-body px-5" id="surveyContainer">
            <div class="row mt-3">
                <div class="col-md-12">
                    <button *ngIf="!formSubmitted" type="submit" class="btn btn-primary btn-sm mx-1"
                        (click)="onSubmit(alert_message)">Submit</button>
                </div>
            </div>
        </div>
        <button type="button" 
                        class="btn btn-secondary btn-lg px-5 ml-2"
                        *ngIf="formSubmitted || isAlreadySubmitted"
                        (click)="isAlreadySubmitted ? closeQuizView() : closeQuizSubmitView()">
                    <i class="fas fa-times mr-2"></i>
                    Close
                </button>
    </div>
</div>

<!-- Alert Message -->
<ng-template #alert_message let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Alert</h5>
        <button type="button" class="btn-close" (click)="closeAlertMessage()"></button>
    </div>
    <div class="modal-body">
        <p>{{ alertMessage }}</p>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeAlertMessage()">Close</button>
    </div>
</ng-template>

<!-- Success Message -->
<ng-template #alert_message let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Alert</h5>
        <button type="button" class="btn-close" (click)="closeAlertMessage()"></button>
    </div>
    <div class="modal-body">
        <p>Response Submitted Successfully</p>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeSuccessMessage()">Close</button>
    </div>
</ng-template>
