<div class="row card">
    <ul class="nav nav-tabs timesheet__tabs" id="timesheetTab" role="tablist">
        <li class="nav-item timesheet__tab-item" *ngIf="userMapping.my_timesheets">
            <a class="nav-link timesheet__tab-item__link" id="my-timesheet-tab" data-toggle="tab" role="tab"
                aria-controls="my-timesheet" aria-selected="true" routerLink="my-timesheet">My Timesheets</a>
        </li>
        <li class="nav-item timesheet__tab-item" *ngIf="userMapping.team_timesheets">
            <a class="nav-link timesheet__tab-item__link" id="team-timesheet-tab" data-toggle="tab" role="tab"
                aria-controls="team-timesheet" aria-selected="false" routerLink="team-timesheet">Team Timesheets</a>
        </li>
    </ul>

    <!-- tab Containers -->
    <div class="tab-content" id="timesheetTabContent">
        <div class="timesheet__tab-container">
            <router-outlet class="tab-pane fade" role="tabpanel"></router-outlet>
        </div>
    </div>
</div>
