<div class="row mb-3">
  <div class="col-md-12 px-0">
    <button
      type="button"
      class="btn btn-outline-primary btn-sm mx-1"
      *ngIf="userMapping.add_timesheet"
      [ngClass]="{ 'active': isTimesheetForm }"
      (click)="onCreateClick()"
    >
      Create New Timesheet
    </button>

    <button
      type="button"
      class="btn btn-outline-primary btn-sm mx-1"
      *ngIf="userMapping.add_timesheet && clientIdNeeded"
      [ngClass]="{ 'active': isTimesheetBulkForm }"
      (click)="onBulkUploadClick()"
    >
      Bulk Final Document Upload
    </button>

    <button
      type="button"
      class="btn btn-outline-primary btn-sm mx-1"
      *ngIf="userMapping.view_my_timesheets || userMapping.update_timesheet"
      [ngClass]="{ 'active': isTimesheetTable }"
      (click)="onViewMyTimesheetsClick()"
    >
      View My Timesheets
    </button>
  </div>
</div>
