<div *ngFor="let calendarItem of calendar; let i = index">
    <div class="flex-container flex-center">
      <div
        class="calendar-days hover-section"
        
        [ngClass]="{'bg-white': day.status === 'Not Filled', 'bg-red': day.status === 'Rejected', 'bg-yellow' : day.status === 'Pending', 'bg-green' : day.status === 'Approved'}"
        
        [ngClass]="day.className"
        *ngFor="let day of calendarItem"
        
        (mouseenter)="onHoverStart($event, day.description,day.activity)"
        (mouseleave)="onHoverEnd()"
        (click)="day.displayDate <= todayDate && onDayClick(day)"


        
      >


       <div *ngIf="day.status === 'Not Filled'  && day.displayDate <= todayDate" class="hover-hint">
        Create Timesheet
      </div>
      
        <div *ngIf="i === 0"><b>{{day.dayName}}</b></div>
        {{day.day}} <small *ngIf="i === 0 && day.workingHours >= 0" class="float-right"><b>{{day.workingHours}} Hrs </b></small>
        <div *ngIf="i != 0 && day.workingHours >= 0" class="hours"><small><b>{{day.workingHours}} Hrs </b></small></div>
      </div>
      
    </div>
</div>

<div class="row justify-content-between px-3">
    <small class="mr-3"><b>{{date.format('MMMM ')}}{{date.format('YYYY ')}}</b></small>

    <div class="legends row">
        <div class="mx-2">
            <div class="legends-color bg-white m-0 mr-2"></div>
            <small class="legends-name">Not Filled</small>
        </div>
        <div class="mx-2">
            <div class="legends-color bg-red m-0 mr-2"></div>
            <small class="legends-name">Rejected</small>
        </div>
        <div class="mx-2">
            <div class="legends-color bg-yellow m-0 mr-2"></div>
            <small class="legends-name">Pending</small>
        </div>
        <div class="mx-2">
            <div class="legends-color bg-green m-0 mr-2"></div>
            <small class="legends-name">Approved</small>
        </div>
    </div>
</div>


<!-- modal -->
<ng-template #timesheet_details>
    <div class="modal-header">
        <h5 class="modal-title">Timesheet Details</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cancelRequest();">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body px-5">
        <div class="row">
            <div class="info-wrapper">
                <div class="form-group">
                    <label class="info-label">Date</label>
                    <input type="text" class="form-control" autocomplete="none" [(ngModel)]="dayDetails.displayDate" disabled>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="info-wrapper">
                <div class="form-group">
                    <label class="info-label">Day Type</label>
                    <input type="text" class="form-control" autocomplete="none" [(ngModel)]="dayDetails.dayType"
                        disabled>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="info-wrapper">
                <div class="form-group">
                    <label class="info-label">Working Hours</label>
                    <input type="text" class="form-control" autocomplete="none" [(ngModel)]="dayDetails.workingHours"
                        disabled>
                </div>
            </div>
        </div>
    </div>
</ng-template>

<div
  class="popup"
  *ngIf="isPopupVisible && popupDescription != null && popupDescription.length != 0"
  [ngStyle]="{ top: pointerY + 'px', left: pointerX + 'px' }"
>
<p *ngIf="popupActivity != null && popupActivity.length != 0"> Activity: {{popupActivity}}</p>
<p *ngIf="popupDescription != null && popupDescription.length != 0">  Description: {{ popupDescription }} </p>
</div>

  
<ng-template #alert_message>
  <div class="modal-body text-center">
    <p>{{ alertMessage }}</p>
    <button type="button" class="btn btn-primary" (click)="cancelRequest_approve_pending()">OK</button>
  </div>
</ng-template>
