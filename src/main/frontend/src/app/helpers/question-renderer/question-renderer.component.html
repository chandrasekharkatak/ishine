<div class="mt-2">
    <div *ngIf="renderType == 'edit'" class="d-flex justify-content-between align-items-center">
        <span>{{ entityType }} Questions</span>
        <button class="btn btn-sm btn-outline-primary" (click)="addQuestion(entity)">
            <i class="fa fa-plus"></i> Add Question
        </button>
    </div>

    <!-- Question Breadcrumb -->
    <div *ngIf="entity?.questionList?.length > 0" class="question-breadcrumb mb-3">
        <nav aria-label="Question navigation">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                    <button class="btn btn-sm btn-outline-secondary" (click)="showQuestionOverview(entity)"
                        [class.active]="currentQuestionIndex === null && currentQuestionList === entity.questionList">
                        <i class="fa fa-list"></i> Overview
                    </button>
                </li>
                <li *ngFor="let question of entity.questionList; let i = index" class="breadcrumb-item">
                    <button class="btn btn-sm btn-outline-secondary"
                        (click)="navigateToQuestion(entity.questionList, i)"
                        [class.active]="currentQuestionIndex === i && currentQuestionList === entity.questionList">
                        Q{{ i + 1 }}
                    </button>
                </li>
            </ol>
        </nav>
    </div>

    <!-- Question Overview (when no specific question is selected) -->
    <div *ngIf="entity?.questionList?.length > 0 && (currentQuestionIndex === null || currentQuestionList !== entity.questionList)"
        class="question-overview">
        <div class="card">
            <div class="card-body">
                <div class="row">
                    <div *ngFor="let question of entity.questionList; let i = index" class="col-md-6 mb-3">
                        <div class="question-preview-card p-3 border rounded">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h6 class="mb-0">Q{{ i + 1 }}</h6>
                                <div class="btn-group btn-group-sm">
                                    <button class="btn btn-outline-primary btn-sm"
                                        (click)="navigateToQuestion(entity.questionList, i)">
                                        <i class="fa fa-edit"></i>
                                    </button>
                                    <button *ngIf="renderType == 'edit'" class="btn btn-outline-danger btn-sm"
                                        (click)="deleteQuestion(entity.questionList, i)">
                                        <i class="fa fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                            <p class="mb-1 text-muted small">{{ question.text || 'No question text' }}</p>
                            <span class="badge badge-info">{{ question.optionType || 'text' }}</span>
                            <span *ngIf="question.optionsList?.length" class="badge badge-secondary ml-1">
                                {{ question.optionsList.length }} options
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Single Question View -->
    <div
        *ngIf="entity?.questionList?.length > 0 && currentQuestionIndex !== null && currentQuestionList === entity.questionList; else noQuestions">
        <ng-container *ngIf="entity.questionList[currentQuestionIndex] as question">
            <!-- Option managment -->
            <div class="d-flex align-items-center">
                <input [disabled]="renderType != 'edit'" [(ngModel)]="question.text" class="form-control mr-2" placeholder="Enter question text" />
                <button *ngIf="renderType == 'edit'" class="btn btn-sm btn-danger"
                    (click)="deleteQuestion(entity.questionList, currentQuestionIndex)">
                    <i class="fa fa-trash"></i>
                </button>
            </div>

            <div class="col-md-12 mt-2">
                <div class="option-config-section">
                    <div class="row">
                        <div class="col-md-12">
                            <div class="info-wrapper">
                                <div class="form-group">
                                    <label class="info-label">Description</label>
                                    <input [(ngModel)]="question.description" [disabled]="renderType != 'edit'" class="form-control mr-2"
                                        placeholder="Enter Question Description" />
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6" *ngIf="renderType == 'edit'">
                            <div class="info-wrapper">
                                <div class="form-group">
                                    <label class="info-label"><span class="text-danger">*</span>Options Type</label>
                                    <select class="form-control" aria-hidden="true" [(ngModel)]="question.optionType"
                                        (change)="setOption(question)">
                                        <option value="checkbox">Checkbox</option>
                                        <option value="radio">Radio</option>
                                        <option value="text">Text</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 mb-0" *ngIf="renderType == 'edit'">
                            <div class="info-wrapper">
                                <div class="form-group">
                                    <label class="info-label"><span class="text-danger">*</span>Assign To</label>
                                    <app-my-select #employeeSelect class="form-control" placeholder="Select Assignee"
                                        [(ngModel)]="question.toAssignEmployeeList" [options]="allEmployeeList" displayKey="name"
                                        valueKey="empId" [multiple]="true" (ngModelChange)="onAssignToChange(question)">
                                    </app-my-select>
                                    <!-- <mat-select ngxMatSelect class="form-control" #employeeSelect="ngxMatSelect"
                                        [displayMember]="'name'" [valueMember]="'empId'" [source]="allEmployeeList"
                                        [useInfiniteScroll]="true" [multiple]="true"
                                        [(ngModel)]="question.toAssignEmployeeList"
                                        (ngModelChange)="onAssignToChange(question)">
                                        <mat-option [value]="emp.empId"
                                            *ngFor="let emp of employeeSelect.filteredSource">
                                            {{emp.name}}
                                        </mat-option>
                                    </mat-select> -->
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row" *ngIf="(question.optionType == 'checkbox' || question.optionType == 'radio')">
                        <div class="col-md-12" *ngFor="let option of question.optionsList; let i = index">
                            <div class="row" *ngIf="renderType == 'edit'">
                                <div class="col-md-4 mb-0">
                                    <div class="info-wrapper">
                                        <div class="form-group">
                                            <label class="info-label">Option - {{i+1}}</label>
                                            <input type="text" class="form-control" autocomplete="none"
                                                [(ngModel)]="option.optionValue">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3 pt-4 mt-2">
                                    <button type="button" class="btn btn-outline-primary mx-1"
                                        (click)="addOption(i, question)"><i class="fa fa-plus"
                                            aria-hidden="true"></i></button>
                                    <button *ngIf="question.optionsList.length>1" type="button"
                                        class="btn btn-outline-primary mx-1" (click)="removeOption(i, question)"><i
                                            class="fa fa-trash" aria-hidden="true"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row" *ngIf="question.optionType == 'text'">
                        <div class="col-md-12" *ngIf="renderType == 'edit'">
                            <div class="info-wrapper">
                                <div class="form-group">
                                    <input type="text" class="form-control" autocomplete="none" readonly
                                        value="Text Answer here...">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="responses-section" *ngIf="renderType != 'edit'">
                    <div *ngFor="let response of getVisibleResponses(question); let responseIndex = index">
                        <div class="response-container p-2 mt-2">
                            <!-- Review Section -->
                            <!-- <div class="user-info d-flex align-items-center flex-wrap gap-3">
                                <div class="d-flex align-items-center mr-3">
                                    <svg class="user-icon" viewBox="0 0 24 24" fill="currentColor">
                                        <path
                                            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                                    </svg>
                                    <span class="small font-weight-bold">Response By:
                                        {{response.responseByEmpName || ''}}</span>
                                    <span class="small font-weight-bold">Response By: {{''}}</span>
                                </div>

                                <div class="form-check mr-3">
                                    <label class="custom-checkbox mb-0"
                                        [for]="'recommended-response-checkbox-' + responseIndex">
                                        <input type="checkbox"
                                            [id]="'recommended-response-checkbox-' + responseIndex"
                                            [(ngModel)]="response.isRecommendedChecked"
                                            (change)="onRecommendedResponseChange($event, response, question)">
                                        <span class="checkmark"></span>&nbsp;&nbsp;{{
                                        !isCurrentEmployeeRoleGreaterThanManager ? 'Recommend '
                                        : 'Recommended '}} Response
                                    </label>
                                </div>

                                <div *ngIf="isCurrentEmployeeRoleGreaterThanManager" class="form-check mr-3">
                                    <label class="custom-checkbox mb-0"
                                        [for]="'checkbox-response-' + responseIndex">
                                        <input type="checkbox" [id]="'checkbox-response-' + responseIndex"
                                            [(ngModel)]="response.approvedForKnowledgeHub">
                                        <span class="checkmark"></span>
                                        Approve For Knowledge Hub
                                    </label>
                                </div>
                            </div>

                            <div class="marks-section mt-2">
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <span class="small font-weight-bold">Points (out of 10): </span>
                                    <div class="d-flex flex-wrap gap-3">
                                        <div *ngFor="let responsePoint of response.projectInsightResponsePointList; let responsePointIndex = index"
                                            class="d-flex flex-column align-items-center my-2 pr-2">
                                            <input class="form-control response-marking text-center mb-1" type="number" min="0" max="10"
                                                oninput="this.value = this.value.replace(/\D/g, '')"
                                                onkeydown="if(event.key==='-' || event.key==='+' || event.key==='e' || event.key==='E')return false;"
                                                disabled [(ngModel)]="responsePoint.points" placeholder="0 - 10" />
                                            <span class="small text-center">{{responsePoint.pointsByName || ''}}</span>
                                        </div>
                                    </div>
                                </div>
                            </div> -->

                            <!-- TEXT -->
                            <div class="mt-2" *ngIf="question.optionType == 'text'">
                                <div class="form-group mb-3">
                                    <label>Tags</label>
                                    <div class="tags-container">
                                        <div class="d-flex flex-wrap gap-2 mb-2">
                                            <span *ngFor="let tag of response.tags; let i = index" class="badge active mr-1">
                                                {{tag}}&nbsp;&nbsp;
                                                <span class="btn-close btn-close-white ms-2"
                                                    *ngIf="canEditResponse(response) && projectInsightObj.isFinalSubmitted == 'N'"
                                                    style="cursor: pointer;" aria-label="Close" (click)="removeTag(response,i)">
                                                    <i class="fa-solid fa-xmark"></i>
                                                </span>
                                            </span>
                                        </div>
                                        <input type="text" class="form-control" [(ngModel)]="response.newTag"
                                            [disabled]="!canEditResponse(response) || projectInsightObj.isFinalSubmitted == 'Y'"
                                            placeholder="Type and press Enter to add tag" (keyup.enter)="addManualTag(response)" />
                                    </div>
                                </div>
                                <div class="form-group mb-3">
                                    <label><span class="text-danger">*</span>Enter Response Here</label>
                                    <div (contextmenu)="handleContextMenu($event)">
                                        <angular-editor
                                            id="myEditor" [(ngModel)]="response.response"
                                            [config]="editorConfig" (blur)="onResponseChange(response)">
                                        </angular-editor>
                                    </div>
                                    <div *ngIf="showContextMenu" class="context-menu" [style.left.px]="contextMenuX" [style.top.px]="contextMenuY">
                                        <div class="list-group">
                                            <button class="list-group-item" (click)="addTag(response)">Add tag</button>
                                        </div>
                                    </div>
                                    <div *ngIf="showContextMenu" class="context-menu-backdrop" (click)="closeContextMenu()">
                                    </div>
                                </div>
                            </div>



                            <!-- CHECKBOX -->
                            <div *ngIf="question.optionType == 'checkbox' && renderType == 'answer'" class="mt-2">
                                <div *ngFor="let option of question.optionsList; let optionIndex = index"
                                    class="custom-control custom-checkbox">
                                    <input type="checkbox" class="custom-control-input"
                                        [id]="'checkbox' + optionIndex + '-response-' + responseIndex"
                                        [(ngModel)]="option.isChecked"
                                        (change)="onCheckboxChangeForQuestionSection($event, option.optionValue, question, option, response)"
                                        [disabled]="this.projectInsightObj.isFinalSubmitted == 'Y'">
                                    <label class="custom-control-label"
                                        [for]="'checkbox' + optionIndex + '-response-' + responseIndex">
                                        {{option.optionValue}}
                                    </label>
                                </div>
                            </div>
                            <div *ngIf="question.optionType == 'checkbox' && (renderType == 'view' || renderType == 'approval')" class="mt-2">
                                <div *ngFor="let option of question.optionsList; let optionIndex = index"
                                    class="custom-control custom-checkbox">
                                    <input type="checkbox" class="custom-control-input"
                                        [id]="'checkbox' + optionIndex + '-response-' + responseIndex"
                                        (change)="onCheckboxChangeForQuestionSection($event, option.optionValue, question, option, response)"
                                        disabled>
                                    <label class="custom-control-label"
                                        [for]="'checkbox' + optionIndex + '-response-' + responseIndex">
                                        {{option.optionValue}}
                                    </label>
                                </div>
                            </div>

                            <!-- RADIO -->
                            <div *ngIf="question.optionType == 'radio' && renderType == 'answer'" class="mt-2">
                                <div *ngFor="let option of question.optionsList; let optIndex = index"
                                    class="custom-control custom-radio">
                                    <input type="radio" class="custom-control-input"
                                        [id]="'radio' + optIndex + '-response-' + responseIndex"
                                        name="radio{{optIndex}}-response-{{responseIndex}}"
                                        [disabled]="this.projectInsightObj.isFinalSubmitted == 'Y'"
                                        [value]="option.optionValue" [(ngModel)]="response.response">
                                    <label class="custom-control-label"
                                        [for]="'radio' + optIndex + '-response-' + responseIndex">
                                        {{option.optionValue}}
                                    </label>
                                </div>
                            </div>
                            <div *ngIf="question.optionType == 'radio' && (renderType == 'view' || renderType == 'approval')" class="mt-2">
                                <div *ngFor="let option of question.optionsList; let optIndex = index"
                                    class="custom-control custom-radio">
                                    <input type="radio" class="custom-control-input"
                                        [id]="'radio' + optIndex + '-response-' + responseIndex"
                                        name="radio{{optIndex}}-response-{{responseIndex}}" disabled
                                        [value]="option.optionValue">
                                    <label class="custom-control-label"
                                        [for]="'radio' + optIndex + '-response-' + responseIndex">
                                        {{option.optionValue}}
                                    </label>
                                </div>
                            </div>

                            <!-- FILE UPLOAD -->
                            <div *ngIf="response.showDocDiv && renderType == 'answer'" class="mt-3">
                                <div class="d-flex align-items-center">
                                  <label *ngIf="!response.documentFileName" class="btn btn-sm btn-outline-secondary mr-2 mb-0"
                                    for="file-{{entity.questionId}}">
                                    <span>Upload File</span>
                                    <input id="file-{{entity.questionId}}" name="file-{{entity.questionId}}" type="file" class="d-none"
                                      (change)="onQuestionFileChange($event, entity, alert_message, 'document-preview-container', document_preview_template, response)"
                                      [disabled]="this.projectInsightObj.isFinalSubmitted == 'Y'">
                                  </label>
                  
                                  <span *ngIf="response.documentFileName" class="small mr-2">
                                    {{response.documentFileName}}
                                  </span>
                  
                                  <button *ngIf="response.documentFileName && this.projectInsightObj.isFinalSubmitted == 'N'"
                                    type="button" class="btn btn-sm btn-outline-danger mr-2" title="Remove File"
                                    (click)="removeUploadedFile(response)">
                                    <i class="fa-solid fa-xmark"></i>
                                  </button>
                  
                                  <button *ngIf="response.documentFileName" type="button" class="btn btn-sm btn-outline-primary"
                                    title="Preview File"
                                    (click)="previewUploadedFile(response, response.document, response.documentFileName, 'document-preview-container', document_preview_template, alert_message, true, response)">
                                    <i class="fa-solid fa-eye"></i>
                                  </button>
                                </div>
                            </div>
                            <div *ngIf="!response.showDocDiv && (renderType == 'view' || renderType == 'approval')" class="mt-3">
                                <div class="d-flex align-items-center">
                                  <label *ngIf="!response.documentFileName" class="btn btn-sm btn-outline-secondary mr-2 mb-0"
                                    for="file-{{entity.questionId}}">
                                    <span>Upload File</span>
                                    <input id="file-{{entity.questionId}}" name="file-{{entity.questionId}}" type="file" class="d-none"
                                      (change)="onQuestionFileChange($event, entity, alert_message, 'document-preview-container', document_preview_template, response)"
                                      disabled>
                                  </label>
                                  <button type="button" class="btn btn-sm btn-outline-danger mr-2" title="Remove File"
                                    (click)="removeUploadedFile(response)">
                                    <i class="fa-solid fa-xmark"></i>
                                  </button>
                                  <button type="button" class="btn btn-sm btn-outline-primary" title="Preview File"
                                    (click)="previewUploadedFile(response, response.document, response.documentFileName, 'document-preview-container', document_preview_template, alert_message, true, response)">
                                    <i class="fa-solid fa-eye"></i>
                                  </button>
                                </div>
                              </div>

                        </div>
                    </div>
                </div>
            </div>
        </ng-container>
    </div>
    <ng-template #noQuestions>
        <div *ngIf="entity?.questionList?.length == 0" class="text-muted">No questions added yet.</div>
    </ng-template>
</div>


<ng-template #document_preview_template>
    <div class="modal-header">
      <b class="modal-title">
        <h3>Document Preview</h3>
      </b>
      <button type="button" class="close" data-dismiss="modal" aria-label="Close"
        (click)="closeDocumentPreviewTemplate()">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="modal-body">
      <div class="d-flex justify-content-center align-items-center text-danger" id="document-preview-container"
        style="border: 1px solid black; padding: 10px; margin-bottom: 15px;"></div>
    </div>
  </ng-template>

<ng-template #alert_message>
    <div class="modal-body text-center">
      <p>{{alertMessage}}</p>
      <button type="button" class="btn btn-primary" (click)="cancelRequest()">OK</button>&nbsp;
    </div>
  </ng-template>
