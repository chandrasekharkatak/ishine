<ng-container *ngFor="let column of displayColumns">
    <td>
        <div *ngIf="!column.isBlank" class="form-group">
            <input type="text" class="form-control" placeholder='Search' [(ngModel)]="column.value" 
                   (keyup)="!searchOnEnter && search()" 
                   (keyup.enter)="searchOnEnter && search()">
        </div>
    </td>
</ng-container>
