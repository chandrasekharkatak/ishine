<div class="dt-wrapper form-group">

  <label class="dt-label" style="font-family: 'Roboto', sans-serif;
  font-weight: 500;
  font-size: 0.85rem;margin-bottom: 4px;" *ngIf="label">
    <span *ngIf="required" class="text-danger">*</span>
    {{ label }}
  </label>

  <div class="row d-flex align-items-center">
  <div class="col-md-11 pr-0">
  <!-- Angular Material Datepicker for date mode -->
  <mat-form-field *ngIf="mode === 'date'" style="display: contents; width: 100%;">
    <input 
      matInput 
      [matDatepicker]="picker"
      [matDatepickerFilter]="dateFilter"
      [min]="minDateForMaterial"
      [max]="maxDateForMaterial"
      [(ngModel)]="materialDateValue"
      (dateChange)="onMaterialDateChange($event)"
      [disabled]="disabled"
      [required]="required"
      readonly
      style="width: 100%;"
    />
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <input
    *ngIf="mode === 'time'"
    type="time"
    class="form-control"
    [(ngModel)]="modelValue"
    (ngModelChange)="onModelChange($event)"
    [disabled]="disabled"
  />

  <input
    *ngIf="mode === 'datetime'"
    type="datetime-local"
    class="form-control"
    [(ngModel)]="modelValue"
    (ngModelChange)="onModelChange($event)"
    [disabled]="disabled"
  />
</div>
<div class="col-md-1 pl-0">
  <button
    *ngIf="(mode === 'date' ? materialDateValue : modelValue) && !disabled"
    type="button"
    class="btn btn-sm btn-link text-danger dt-clear-btn"
    (click)="clearValue()">
      ✖
    </button>
  </div>
</div>
</div>
