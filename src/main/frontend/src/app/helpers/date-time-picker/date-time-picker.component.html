<div class="dt-wrapper form-group">

  <label class="dt-label" style="font-family: 'Roboto', sans-serif;
  font-weight: 500;
  font-size: 0.85rem;margin-bottom: 4px;" *ngIf="label">
    <span *ngIf="required" class="text-danger">*</span>
    {{ label }}
  </label>

  <div class="row d-flex align-items-center">
  <div class="col-md-11 pr-0">
  <input
    *ngIf="mode === 'date'"
    type="date"
    class="form-control"
    [(ngModel)]="modelValue"
    (ngModelChange)="onModelChange($event)"
    [disabled]="disabled"
    [required]="required"
  />

  <input
    *ngIf="mode === 'time'"
    type="time"
    class="form-control"
    [(ngModel)]="modelValue"
    (ngModelChange)="onModelChange($event)"
    [disabled]="disabled"
  />

  <input
    *ngIf="mode === 'datetime'"
    type="datetime-local"
    class="form-control"
    [(ngModel)]="modelValue"
    (ngModelChange)="onModelChange($event)"
    [disabled]="disabled"
  />
</div>
<div class="col-md-1 pl-0">
  <button
    *ngIf="modelValue && !disabled"
    type="button"
    class="btn btn-sm btn-link text-danger dt-clear-btn"
    (click)="clearValue()">
      ✖
    </button>
  </div>
</div>
</div>
