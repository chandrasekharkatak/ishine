<div class="form-group">
  <label class="dt-label" style="font-family: 'Roboto', sans-serif;
    font-weight: 500;
    font-size: 0.85rem;
    margin-bottom: 4px;" *ngIf="label">
    <span *ngIf="required" class="text-danger">*</span>
    {{ label }}
  </label>

  <input
    *ngIf="mode === 'date'"
    type="date"
    [(ngModel)]="modelValue"
    (ngModelChange)="onModelChange($event)"
    [disabled]="disabled"
    [required]="required"
  />

  <input
    *ngIf="mode === 'time'"
    type="time"
    [(ngModel)]="modelValue"
    (ngModelChange)="onModelChange($event)"
    [disabled]="disabled"
  />

  <input
    *ngIf="mode === 'datetime'"
    type="datetime-local"
    [(ngModel)]="modelValue"
    (ngModelChange)="onModelChange($event)"
    [disabled]="disabled"
  />

  <button type="button" (click)="clearValue()">Clear</button>
</div>
