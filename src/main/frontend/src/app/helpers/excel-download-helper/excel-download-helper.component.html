<div class="modal-header">
    <h5 class="modal-title">
      <i class="fas fa-file-excel text-success me-2"></i>
      Excel File
    </h5>
    <button type="button" class="close" (click)="activeModal.dismiss()">
      <span>&times;</span>
    </button>
  </div>
  
  <div class="modal-body text-center">
    <i class="fas fa-file-excel fa-3x text-success mb-3"></i>
    <p>Excel files cannot be previewed in the browser.</p>
    <p class="text-muted">Would you like to download it to view?</p>
  </div>
  
  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="activeModal.dismiss()">
      Cancel
    </button>
    <button class="btn btn-success" (click)="onDownload()">
      <i class="fas fa-download me-1"></i>
      Download
    </button>
  </div>
