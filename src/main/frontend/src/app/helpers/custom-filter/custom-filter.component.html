<div class="cf-container">

  <!-- Filter Rows -->
  <div class="cf-row" *ngFor="let query of queryList; let i = index">

    <!-- Row number badge -->
    <div class="cf-row-num">{{ i + 1 }}</div>

    <!-- Field -->
    <div class="cf-field">
      <label class="cf-label">Field</label>
      <app-my-select [(ngModel)]="query.column" [options]="columnList" placeholder="Select field" [multiple]="false"
        (ngModelChange)="getValueOptionData(query)">
      </app-my-select>
      <span class="cf-error" *ngIf="invalidForm && !query.column">Required</span>
    </div>

    <!-- Operator -->
    <div class="cf-field cf-field--sm">
      <label class="cf-label">Operator</label>
      <app-my-select [(ngModel)]="query.operator" [options]="operatorList" displayKey="name" valueKey="symbol"
        placeholder="Select" [multiple]="false">
      </app-my-select>
      <span class="cf-error" *ngIf="invalidForm && !query.operator">Required</span>
    </div>

    <!-- Value -->
    <div class="cf-field">
      <app-my-autocomplete [(ngModel)]="query.value" [options]="query.valueOptionList" displayKey="name" label="Value"
        [placeholder]="getPlaceholder(query.column)">
      </app-my-autocomplete>
      <span class="cf-error" *ngIf="invalidForm && !query.value">Required</span>
    </div>

<!-- Conjunction -->
<div class="cf-field cf-field--sm">
  <label class="cf-label">Conjunction</label>
  <app-my-select [(ngModel)]="query.conjunction" [options]="conjunctionList" displayKey="name" valueKey="symbol"
    placeholder="" [multiple]="false" [disabled]="i == queryList.length - 1">
  </app-my-select>
  <span class="cf-error" *ngIf="invalidForm && !query.conjunction && i < queryList.length - 1">Required</span>
</div>

    <!-- Actions -->
    <div class="cf-field cf-field--actions">
      <label class="cf-label">&nbsp;</label>
      <div class="cf-action-btns">
        <button type="button" class="cf-btn cf-btn--add" (click)="addFilter(i)" title="Add row">
          <i class="fa fa-plus"></i>
        </button>
        <button type="button" class="cf-btn cf-btn--remove" *ngIf="queryList.length > 1" (click)="removeFilter(i)"
          title="Remove">
          <i class="fa fa-trash"></i>
        </button>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="cf-footer">
    <button type="button" class="cf-submit-btn" (click)="submit()">
      <i class="fas fa-check"></i>
      <span>Apply Filters</span>
    </button>
    <button type="button" class="cf-clear-btn" (click)="clear()">
      <i class="fas fa-rotate-left"></i>
      <span>Clear</span>
    </button>
  </div>

</div>
