<div class="container-fluid">
    <div class="row" *ngFor="let query of queryList;let i=index">
        <div class="col-md-3">
            <div class="form-group">
                <label class="info-label">Field</label>
                <select class="form-control" aria-hidden="true" [(ngModel)]="query.column" name="column"
                (change)="getValueOptionData(query.column)">
                    <option selected="selected" value="" disabled>Select</option>
                    <option *ngFor="let c of columnList" [value]="c">{{c}}</option>
                </select>
                <span class="text-danger" *ngIf="invalidForm && !query.column">Required</span>
            </div>
        </div>
        <div class="col-md-2">
            <div class="form-group">
                <label class="info-label">Operator</label>
                <select class="form-control" aria-hidden="true" [(ngModel)]="query.operator" name="operator">
                    <option selected="selected" value="" disabled>Select</option>
                    <option *ngFor="let o of operatorList" [value]="o.symbol">{{o.name}}</option>
                </select>
                <span class="text-danger" *ngIf="invalidForm && !query.operator">Required</span>
            </div>
        </div>
        <!-- <div class="col-md-2">
            <div class="form-group">
                <label class="info-label">Value</label>
                <input type="text" class="form-control" autocomplete="none" [(ngModel)]="query.value" placeholder="Value" name="value">
                <span class="text-danger" *ngIf="invalidForm && !query.value">Required</span>
            </div>
        </div> -->
        <div class="col-md-2">
            <div class="form-group">
                <label class="info-label">Value</label>
                <ng-autocomplete
                [data]="valueOptionList"
                [searchKeyword]="keyword"
                (selected)='selectEvent($event)'
                (inputChanged)='onChangeSearch($event)'
                [itemTemplate]="itemTemplate"
                [(ngModel)]="query.value">
              </ng-autocomplete>
            
              <ng-template #itemTemplate let-item>
                <a [innerHTML]="item.name"></a>
              </ng-template>
                <span class="text-danger" *ngIf="invalidForm && !query.value">Required</span>
            </div>
        </div>
        <div class="col-md-2">
            <div class="form-group">
                <label class="info-label">Conjunction</label>
                <select class="form-control" aria-hidden="true" [(ngModel)]="query.conjunction" name="conjunction">
                    <option selected="selected" value="" ></option>
                    <option *ngFor="let con of conjunctionList" [value]="con.symbol">{{con.name}}</option>
                </select>
                <span class="text-danger" *ngIf="invalidForm && !query.conjunction && i<queryList.length-1">Required</span>
            </div>
        </div>
        <div class="col-md-3 pt-4 mt-2">
            <button type="button" class="btn btn-outline-primary mx-1" (click)="addFilter(i)"><i class="fa fa-plus" aria-hidden="true"></i></button>
            <button *ngIf="queryList.length>1" type="button" class="btn btn-outline-primary mx-1" (click)="removeFilter(i)"><i class="fa fa-trash" aria-hidden="true"></i></button>
        </div>
    </div>
    <div class="row">
        <button type="submit" class="btn btn-primary btn-sm mx-1" (click)="submit()" >Submit</button>
        <button type="submit" class="btn btn-outline-primary btn-sm mx-1" (click)="clear()">Clear</button>
    </div>
</div>
