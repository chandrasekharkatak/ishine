<div class="mt-5">
    <app-breadcrumb></app-breadcrumb>
</div>

<div class="row px-0">
    <div class="col-md-12">
        <div class="card">
            <ul class="nav nav-tabs timesheet__tabs" id="timesheetTab" role="tablist">
                <li *ngIf="userMapping.my_reimbursement" class="nav-item timesheet__tab-item" >
                    <a class="nav-link timesheet__tab-item__link" id="my-timesheet-tab" data-toggle="tab" role="tab"
                        aria-controls="my-timesheet" aria-selected="true" routerLink="my-reimbursement">Apply Reimbursement</a>
                </li>
                <li *ngIf="userMapping.view_reimbursement" class="nav-item timesheet__tab-item" >
                    <a class="nav-link timesheet__tab-item__link" id="team-timesheet-tab" data-toggle="tab" role="tab"
                        aria-controls="team-timesheet" aria-selected="false" routerLink="view-reimbursement">View Reimbursements</a>
                </li>
                <!--for managers-->
                <li *ngIf="userMapping.approve_reimbursement" class="nav-item timesheet__tab-item" >
                    <a class="nav-link timesheet__tab-item__link" id="team-timesheet-tab" data-toggle="tab" role="tab"
                        aria-controls="team-timesheet" aria-selected="false" routerLink="approve-reimbursement">Approve Reimbursements</a>
                </li>
                <!-- *ngIf="userMapping.total_reimbursementrequest" -->
                <!--for managers-->
                <li *ngIf="userMapping.total_reimbursementrequest" class="nav-item timesheet__tab-item" >
                    <a class="nav-link timesheet__tab-item__link" id="team-timesheet-tab" data-toggle="tab" role="tab"
                        aria-controls="team-timesheet" aria-selected="false" routerLink="total-reimbursement">Total Reimbursement Request</a>
                </li>
            </ul>
        
            <!-- tab Containers -->
            <div class="tab-content" id="timesheetTabContent">
                <div class="timesheet__tab-container">
                    <router-outlet class="tab-pane fade" role="tabpanel"></router-outlet>
                </div>
            </div>
        </div>
    </div>
</div>
