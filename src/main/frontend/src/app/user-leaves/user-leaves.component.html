<div class="row px-0">
    <div class="col-md-12">
        <div class="card">
            <ul class="nav nav-tabs leave__tabs" id="leaveTab" role="tablist">
                <li class="nav-item leave__tab-item" (click)="removeActiveTab()">
                    <a class="nav-link leave__tab-item__link" id="leave-tab" data-toggle="tab" role="tab"
                        aria-controls="leave" aria-selected="true" routerLink="leave">Leave</a>
                </li>
                <li class="nav-item leave__tab-item" (click)="removeActiveTab()">
                    <a class="nav-link leave__tab-item__link" id="holidays-tab" data-toggle="tab" role="tab"
                        aria-controls="holidays" aria-selected="false" routerLink="holiday">Holidays</a>
                </li>
                <li class="nav-item leave__tab-item" (click)="removeActiveTab()">
                    <a class="nav-link leave__tab-item__link" id="compOff-tab" data-toggle="tab" role="tab"
                        aria-controls="compOff" aria-selected="false" routerLink="compOff">Compensatory Off</a>
                </li>
            </ul>
        
            <!-- tab Containers -->
            <div class="tab-content" id="leaveTabContent">
                <div class="leave__tab-container">
                    <router-outlet class="tab-pane fade" role="tabpanel"></router-outlet>
                </div>
            </div>
        </div>
    </div>
</div>
