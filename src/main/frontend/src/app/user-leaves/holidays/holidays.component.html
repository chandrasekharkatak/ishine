<!-- start :: holidays Table -->
<div class="row d-flex ">
    <div class="table-header">
      <h1 class="table-header-title">Holidays</h1>
    </div>
    <div class="form-group d-flex flex-row ml-auto col-md-3">
      <input type="text" class="form-control" placeholder="Search" [(ngModel)]="data" (keyup)="page=1">	
      </div>
    <table class="table table-responsive scrollable-table " matSort (matSortChange)="sortHoliday($event)">	
      <thead class="thead-light">	
        <tr>	
          <th scope="col" class="info-label">Sr. No</th>	
          <th scope="col" class="info-label" mat-sort-header="occasion">Occasion</th>	
          <th scope="col" class="info-label" mat-sort-header="dayOfTheWeek">Day</th>	
          <th scope="col" class="info-label" mat-sort-header="dateOfHoliday">Date</th>	
          <th scope="col" class="info-label" mat-sort-header="state">State</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="holidayList.length == 0">
            <th colspan="8" class="text-center info-label">No details to display...</th>
          </tr>
            <tr *ngFor="let holiday of holidayList|filter:data | paginate: { itemsPerPage: 20, currentPage: page }; let i = index">
                <td>{{20*(page-1)+i+1}}</td>
                <td>{{holiday.occasion}}&nbsp;&nbsp;<small class="text-highlight"><strong>{{(holiday.optionalHoliday == 'true')? 'optional' : ''}}</strong></small></td>
                <td>{{holiday.dayOfTheWeek}}</td>
                <td>{{holiday.dateOfHoliday | date:'dd-MM-yyyy'}}</td>
                <td>{{holiday.state}}</td>
            </tr>
        </tbody>
      </table>  
      <pagination-controls class="my-pagination" [hidden]="holidayList.length == 0" (pageChange)="handlePageChange($event)"></pagination-controls> 
</div>
<!-- end :: holidays table -->
