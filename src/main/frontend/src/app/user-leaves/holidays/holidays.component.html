<!-- start :: holidays Table -->
<!-- Holidays Section -->
<div class="row">
  <div class="col-md-12">

    <!-- Header Card -->
    <div class="row text-center mb-3">
      <div class="card col-md-12 px-0 shadow-sm">
        <div class="card-header leave-section-header">
          <span><i class="fa fa-calendar me-2"></i> Holidays</span>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-12">
        <div class="ts-table-wrapper">

          <!-- Toolbar -->
          <div class="ts-toolbar">

            <!-- Search Toggle -->
            <a class="ts-search-toggle"
               href="javascript:void(0)"
               (click)="toggleSearch()"
               [title]="isSearchEnabled ? 'Close search' : 'Search'">
              <i *ngIf="!isSearchEnabled" class="fa fa-search"></i>
              <i *ngIf="isSearchEnabled" class="fa-solid fa-xmark"></i>
            </a>

            <!-- Year Filter -->
            <div class="ms-auto d-flex align-items-center gap-2">
              <label class="mb-0"><strong>Year</strong></label>
              <select class="form-control form-control-sm"
                      #changedata
                      (change)="getFilterHolidayList(changedata.value)">
                <option *ngFor="let year of years" [value]="year">{{year}}</option>
              </select>
            </div>

          </div>

          <!-- Table -->
          <div class="ts-table-scroll">
            <table class="ts-table" id="holidayInfo"
                   matSort (matSortChange)="sortData($event)">

              <thead>
                <tr>
                  <th>Sr No.</th>
                  <th mat-sort-header="occasion|string">Occasion</th>
                  <th mat-sort-header="dayOfTheWeek|string">Day</th>
                  <th mat-sort-header="dateOfHoliday|date">Date</th>
                  <th mat-sort-header="state|string">State</th>
                </tr>

                <!-- Filter Row -->
                <tr app-column-filter-bar
                    *ngIf="isSearchEnabled"
                    [columnList]="holidayColumns"
                    (onSearch)="onSearch($event); page=1">
                </tr>
              </thead>

              <tbody>

                <!-- Empty State -->
                <tr *ngIf="holidayList.length == 0 || 
                          (holidayList | colFilter:filters:false).length == 0">
                  <td colspan="5" class="ts-empty">
                    <i class="fa fa-inbox"></i>
                    <span>No details to display</span>
                  </td>
                </tr>

                <!-- Data Rows -->
                <tr class="ts-row"
                    *ngFor="let holiday of holidayList
                    | colFilter:filters:false
                    | sort:[sortColumn, sortColumnType, sortDirection]
                    | paginate: { itemsPerPage: 20, currentPage: page };
                    let i = index">

                  <td>{{20*(page-1)+i+1}}</td>

                  <td>
                    {{holiday.occasion}}
                    <small class="text-highlight ms-1">
                      <strong>
                        {{ holiday.optionalHoliday == 'true' ? 'optional' : '' }}
                      </strong>
                    </small>
                  </td>

                  <td>{{holiday.dayOfTheWeek}}</td>
                  <td>{{holiday.dateOfHoliday}}</td>
                  <td>{{holiday.state}}</td>

                </tr>

              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <pagination-controls
            *ngIf="holidayList.length > 0"
            class="ts-pagination my-pagination"
            [maxSize]="5"
            (pageChange)="handlePageChange($event)">
          </pagination-controls>

        </div>
      </div>
    </div>
  </div>
</div>
<!-- end :: holidays table -->
