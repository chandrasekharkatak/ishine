<!-- start :: holidays Table -->
<div class="row col-md-12">
    <div class="table-header">
      <h1 class="table-header-title">Holidays</h1>
    </div>
    <table class="table holidays-table">
        <thead class="thead-light">
          <tr>
            <th scope="col" class="info-label">Sr. No</th>
            <th scope="col" class="info-label">Occasion</th>
            <th scope="col" class="info-label">Day</th>
            <th scope="col" class="info-label">Date</th>
            <th scope="col" class="info-label">State</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="holidayList.length == 0">
            <th colspan="8" class="text-center info-label">No details to display...</th>
          </tr>
            <tr *ngFor="let holiday of holidayList | paginate: { itemsPerPage: 10, currentPage: page }; let i = index">
                <td>{{10*(page-1)+i+1}}</td>
                <td>{{holiday.occasion}}&nbsp;&nbsp;<small class="text-highlight "><strong>{{(holiday.optionalHoliday == 'true')? 'optional' : ''}}</strong></small></td>
                <td>{{holiday.dayOfTheWeek}}</td>
                <td>{{holiday.dateOfHoliday}}</td>
                <td>{{holiday.state}}</td>
            </tr>
        </tbody>
      </table>  
      <pagination-controls class="my-pagination" [hidden]="holidayList.length == 0" (pageChange)="handlePageChange($event)"></pagination-controls> 
</div>
<!-- end :: holidays table -->
