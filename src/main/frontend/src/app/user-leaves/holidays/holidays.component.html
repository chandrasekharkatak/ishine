<!-- start :: holidays Table -->
<div class="row">
  <div class="col-md-12">
    <div class="row">
      <div class="table-header">
        <h1 class="table-header-title">Holidays</h1>
      </div>
    </div>

    <div class="row">

      <div class="col-md-2 ml-auto mb-2">	
        <div class="form-inline input-group">	
          <label class="d-inline-block mr-2 mt-2"><strong>Year</strong></label>	
          <select class="form-control" aria-hidden="true" #changedata (change)="getFilterHolidayList(changedata.value)">	
            <!-- <option selected="selected" [ngValue]="{{currentYear}" disabled>Select</option>	 -->
            <option *ngFor="let year of years" value="{{year}}">{{year}}</option>	
          </select>	
        </div>	
      </div>
      
      <!-- <div class="form-group d-flex flex-row  col-md-3">
        <input type="text" class="form-control" placeholder="Search" [(ngModel)]="data" (keyup)="page=1">	
      </div>   -->
    </div>

    <div class="row">
      <div class="col-md-12">
        <div class="selector-toggle" >
          <a href="javascript:void(0)" (click)="toggleSearch()">
              <i *ngIf="!isSearchEnabled" class="fa fa-search"></i>
              <i *ngIf="isSearchEnabled" class="fa-solid fa-xmark"></i>
          </a>
        </div>
        <div class="overflow-auto" bassHorizontalScroll [tableId]="'holidayInfo'" [tableTHeadId]="'holidayInfoTHead'"
        [tableTHeadTrId]="'holidayInfoTHeadTr'">
        <table class="table" id="holidayInfo" matSort (matSortChange)="sortData($event)">	
          <thead class="thead-light" id="holidayInfoTHead">	
            <tr id="holidayInfoTHeadTr">	
              <th scope="col" class="info-label">Sr. No</th>	
              <th scope="col" class="info-label" mat-sort-header="occasion|string">Occasion</th>	
              <th scope="col" class="info-label" mat-sort-header="dayOfTheWeek|string">Day</th>	
              <th scope="col" class="info-label" mat-sort-header="dateOfHoliday|date">Date</th>	
              <th scope="col" class="info-label" mat-sort-header="state|string">State</th>
              </tr>
              <tr app-column-filter-bar *ngIf="isSearchEnabled" [columnList]="holidayColumns" (onSearch)="onSearch($event);page=1" ></tr>
            </thead>
            <tbody>
              <tr *ngIf="holidayList.length == 0 || (holidayList| colFilter:filters:false).length == 0">
                <th colspan="8" class="text-center info-label">No details to display...</th>
              </tr>
                <tr *ngFor="let holiday of holidayList| colFilter:filters:false | sort : [sortColumn, sortColumnType, sortDirection] | paginate: { itemsPerPage: 20, currentPage: page }; let i = index">
                    <td>{{20*(page-1)+i+1}}</td>
                    <td>{{holiday.occasion}}&nbsp;&nbsp;<small class="text-highlight"><strong>{{(holiday.optionalHoliday == 'true')? 'optional' : ''}}</strong></small></td>
                    <td>{{holiday.dayOfTheWeek}}</td>
                    <td>{{holiday.dateOfHoliday}}</td>
                    <td>{{holiday.state}}</td>
                </tr>
            </tbody>
          </table>
        </div>
        <pagination-controls class="my-pagination" [hidden]="holidayList.length == 0" (pageChange)="handlePageChange($event)"></pagination-controls> 
      </div>
    </div>
  </div>
</div>
<!-- end :: holidays table -->
