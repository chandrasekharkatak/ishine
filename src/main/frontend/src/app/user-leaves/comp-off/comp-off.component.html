<div class="row mb-3">
    <div class="col-md-12 px-0">
        <button type="button" class="btn btn-outline-primary btn-sm mx-1" (click)="showCreateForm()">Apply Compensatory Off</button>
        <button type="button" class="btn btn-outline-primary btn-sm mx-1" (click)="showTable()">View All Pending Compensatory Off</button>
    </div>
</div>

<!-- start :: Create & Update Form -->
<div class="row">
    <div class="card col-md-12 px-0" *ngIf="isForm">
        <div class="card-header text-center text-uppercase">
            <strong *ngIf="isCreation">Apply Compensatory Off</strong>
            <strong *ngIf="isUpdation">Update Compensatory Off Status</strong>
        </div>
        <div class="card-body">
            <div class="row">
                
            </div>
            <div class="row mt-3">
                <div class="col-md-12">
                    <button *ngIf="isCreation" type="submit" class="btn btn-primary btn-sm mx-1">Apply</button>
                    <button *ngIf="isUpdation" type="submit" class="btn btn-primary btn-sm mx-1">Update Status</button>
                </div>
            </div>
        </div>
    </div>
<!-- end :: create & update form -->
<!-- start :: See all Table -->
<div class="row col-md-12" *ngIf="isTable">
    <table class="table department-table">
        <thead class="thead-light">
          <tr>
            <th scope="col" class="info-label">Sr No.</th>
            <th scope="col" class="info-label">Leave Type</th>
            <th scope="col" class="info-label">From Date</th>
            <th scope="col" class="info-label">To Date</th>
            <th scope="col" class="info-label">Duration</th>
            <th scope="col" class="info-label">Status</th>
            <th scope="col" class="info-label">Description</th>
            <th scope="col" class="info-label">Actions</th>
         </tr>
        </thead>
        <tbody>

        </tbody>
      </table>      
</div>
<!-- end :: see all table -->

<!-- Modals Template -->
<ng-template #alert_message>
    <div class="modal-body text-center">
        <p>{{alertMessage}}</p>
        <button type="button" class="btn btn-primary" (click)="cancelRequest()">OK</button>&nbsp;
    </div>
</ng-template>
