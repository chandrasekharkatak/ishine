<mat-toolbar class="modal-title-bar c-move"
             cdkDrag
             cdkDragRootElement=".cdk-overlay-pane"
             cdkDragHandle
             cdkDragBoundary=".cdk-overlay-container">
  <span>Milestone Preview - {{ data.fileName }}</span>
  <span class="align-toolbar"></span>
  <button mat-icon-button (click)="closeModal()" aria-label="Close dialog">
    <mat-icon color="primary">clear</mat-icon>
    </button>
</mat-toolbar>

<mat-dialog-content>
  <img *ngIf="data.imageUrl?.includes('image/')" [src]="data.imageUrl" style="width: 100%; height: auto;" />
  
  <object *ngIf="data.imageUrl?.includes('application/pdf')"
          [data]="data.imageUrl"
          type="application/pdf"
          width="100%"
          height="600px">
    <p>PDF cannot be displayed.
      <a [href]="data.imageUrl" target="_blank">Download</a>
    </p>
  </object>
</mat-dialog-content>
