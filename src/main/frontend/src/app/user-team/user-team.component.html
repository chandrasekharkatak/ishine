<div class="mt-5">
    <app-breadcrumb></app-breadcrumb>
</div> 
 
 <div class="row px-0">
      <div class="col-md-12">
          <div class="card">
            <ul class="nav nav-tabs team__tabs" id="teamTab" role="tablist">
                <li *ngIf="userMapping.my_team" class="nav-item team__tab-item" (click)="removeActiveTab()">
                    <a class="nav-link team__tab-item__link" id="team-tab" data-toggle="tab" role="tab"
                        aria-controls="employee" aria-selected="true" routerLink="my-team" [queryParams]="{tab: 'my-team'}">My Team</a>
                </li>
                <li *ngIf="userMapping.team_members" class="nav-item team__tab-item" (click)="removeActiveTab()">
                    <a class="nav-link team__tab-item__link" id="team-tab" data-toggle="tab" role="tab"
                        aria-controls="employee" aria-selected="true" routerLink="team-member">Team Member</a>
                </li>
                <li *ngIf="userMapping.team_config" class="nav-item team__tab-item" (click)="removeActiveTab()">
                    <a class="nav-link team__tab-item__link" id="team-tab" data-toggle="tab" role="tab"
                        aria-controls="employee" aria-selected="true" routerLink="team-config">Team Config</a>
                </li>
                <li *ngIf="userMapping.resource_management" class="nav-item team__tab-item" (click)="removeActiveTab()">
                    <a class="nav-link team__tab-item__link" id="team-tab" data-toggle="tab" role="tab"
                        aria-controls="employee" aria-selected="true" routerLink="resource-management">Resource Management</a>
                </li>
                <li class="nav-item team__tab-item" (click)="removeActiveTab()">
                    <a class="nav-link team__tab-item__link" id="team-tab" data-toggle="tab" role="tab"
                        aria-controls="employee" aria-selected="true" routerLink="form-builder">Form Builder</a>
                </li>
                <li class="nav-item team__tab-item" (click)="removeActiveTab()">
                    <a class="nav-link team__tab-item__link" id="team-tab" data-toggle="tab" role="tab"
                        aria-controls="employee" aria-selected="true" routerLink="project-insight-config">Project Initiation</a>
                </li>
                <li class="nav-item team__tab-item" (click)="removeActiveTab()">
                    <a class="nav-link team__tab-item__link" id="team-tab" data-toggle="tab" role="tab"
                        aria-controls="employee" aria-selected="true" routerLink="knowledge-hub">Knowledge Hub</a>
                </li>
                <li class="nav-item team__tab-item" (click)="removeActiveTab()">
                    <a class="nav-link team__tab-item__link" id="team-tab" data-toggle="tab" role="tab"
                        aria-controls="employee" aria-selected="true" routerLink="domains">Domains</a>
                </li>
            </ul>
        
            <!-- tab Containers -->
            <div class="tab-content" id="userTabContent">
                <div class="team__tab-container">
                    <router-outlet class="tab-pane fade" role="tabpanel"></router-outlet>
                </div>
            </div>
          </div>
      </div>
</div>
