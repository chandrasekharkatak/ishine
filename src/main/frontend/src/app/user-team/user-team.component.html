

  <div class="row card">
    <ul class="nav nav-tabs team__tabs" id="teamTab" role="tablist">
        <li *ngIf="userMapping.my_team" class="nav-item team__tab-item" (click)="removeActiveTab()">
            <a class="nav-link team__tab-item__link" id="team-tab" data-toggle="tab" role="tab"
                aria-controls="employee" aria-selected="true" routerLink="my-team">My Team</a>
        </li>
        <li *ngIf="userMapping.team_members" class="nav-item team__tab-item" (click)="removeActiveTab()">
            <a class="nav-link team__tab-item__link" id="team-tab" data-toggle="tab" role="tab"
                aria-controls="employee" aria-selected="true" routerLink="team-member">Team Member</a>
        </li>
    </ul>

    <!-- tab Containers -->
    <div class="tab-content" id="userTabContent">
        <div class="team__tab-container">
            <router-outlet class="tab-pane fade" role="tabpanel"></router-outlet>
        </div>
    </div>
