<div class="modal-overlay" *ngIf="isVisible" (click)="close()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ title }}</h3>
      <button class="close-btn" (click)="close()">&times;</button>
    </div>

    <div class="modal-body">
        <div class="input-container">
        <div *ngIf="parentType=='subDomain' || parentType=='domain'" class="select-container">
          <select class="form-select" (change)="changeChild($event)">
            <option value="subDomain">Sub Domain</option>
            <option value="service">Service</option>
          </select>
          <div class="select-arrow"></div>
        </div>
        <input type="text" [(ngModel)]="itemName" class="form-control" [placeholder]="placeholder">
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-sm btn-outline-secondary" (click)="close()">Cancel</button>
      <button class="btn btn-primary" (click)="save()" [disabled]="!itemName.trim()">Save</button>
    </div>
  </div>
</div>
