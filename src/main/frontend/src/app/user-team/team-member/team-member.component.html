<div class="row">
  <div class="col-md-12">
      <div class="row">
        <div class="col-md-12 table-header">
          <h1 class="table-header-title">My Team Member</h1>
        </div>
      </div>

      <!-- <div class="row">
        <div class="form-group ml-auto col-md-3">
          <input type="text" class="form-control" placeholder="Search" [(ngModel)]="data" (keyup)="page=1">	
        </div>
      </div> -->

      <div class="row">
        <div class="col-md-12">
          <div class="selector-toggle" (click)="toggleSearch()">
            <a href="javascript:void(0)">
                <i *ngIf="!isSearchEnabled" class="fa fa-search"></i>
                <i *ngIf="isSearchEnabled" class="fa-solid fa-xmark"></i>
            </a>
          </div>
          <div class="overflow-auto" bassHorizontalScroll [tableId]="'teamMemberInfo'" [tableTHeadId]="'teamMemberInfoTHead'"
          [tableTHeadTrId]="'teamMemberInfoTHeadTr'">
            <table class="table team-table" id="team-table" matSort (matSortChange)="sortData($event)">	
              <thead class="thead-light">	
                <tr>	
                  <th scope="col" class="info-label">Sr No.</th>	
                  <th scope="col" class="info-label" mat-sort-header="employeementId|empId">Employee Id</th>	
                  <th scope="col" class="info-label" mat-sort-header="name|string">Name</th>	
                  <th scope="col" class="info-label" mat-sort-header="email|string">Email</th>	
                  <th scope="col" class="info-label" mat-sort-header="jobRoleName|string">Designation</th>	
                  <th scope="col" class="info-label" mat-sort-header="mobileNo|number">Mobile No.</th>
                  </tr>
                  <tr app-column-filter-bar *ngIf="isSearchEnabled" [columnList]="teamMemberColumns" (onSearch)="onSearch($event);page=1" ></tr>
                </thead>
                <tbody>
                  <tr *ngIf="viewTeamMemberList.length == 0 || (viewTeamMemberList| colFilter:filters:false).length == 0">
                    <th colspan="8" class="text-center info-label">No details to display...</th>
                  </tr>
                  <tr *ngFor="let viewTeamMember of viewTeamMemberList| colFilter:filters:false | sort : [sortColumn, sortColumnType, sortDirection] | paginate: { itemsPerPage: 10, currentPage: page }; let i = index">
                    <td>{{10*(page-1)+i+1}}</td>
                    <td>{{viewTeamMember.employeementId}}</td>
                    <td>{{viewTeamMember.name}}</td>
                    <td>{{viewTeamMember.email}}</td>
                    <td>{{viewTeamMember.jobRoleName}}</td>
                    <td>{{viewTeamMember.mobileNo}}</td>
                  </tr>
                </tbody>
              </table>
          </div>
          <pagination-controls class="my-pagination" [hidden]="viewTeamMemberList.length == 0" (pageChange)="handlePageChange($event)"></pagination-controls> 
        <button type="button" class="btn btn-sm btn-outline-primary ml-auto mr-5 mt-2 mb-2" [hidden]="viewTeamMemberList.length == 0" (click)="exportToExcel()"><em class="fa fa-file-arrow-down fa-2x"></em></button>
        </div>
      </div>
  </div>
</div>
