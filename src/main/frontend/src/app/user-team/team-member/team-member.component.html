<div class="table-header">
  <h1 class="table-header-title">My Team Member</h1>
</div>
<div class="row col-md-12">
    <table class="table team-table">
      <thead class="thead-light">
        <tr>
          <th scope="col" class="info-label">Sr No.</th>
          <th scope="col" class="info-label">Employee Id</th>
          <th scope="col" class="info-label">Name</th>
          <th scope="col" class="info-label">Email</th>
          <th scope="col" class="info-label">Designation</th>
          <th scope="col" class="info-label">Mobile No.</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let viewTeamMember of viewTeamMemberList | paginate: { itemsPerPage: 2, currentPage: page }; let i = index">
          <td>{{i+1}}</td>
          <td>A-{{viewTeamMember.empId}}</td>
          <td>{{viewTeamMember.name}}</td>
          <td>{{viewTeamMember.email}}</td>
          <td>{{viewTeamMember.jobRoleName}}</td>
          <td>{{viewTeamMember.mobileNo}}</td>
        </tr>
      </tbody>
    </table>
    <pagination-controls class="my-pagination" (pageChange)="handlePageChange($event)"></pagination-controls> 
    <!-- <button type="button" class="btn btn-sm btn-outline-primary ml-auto mr-5" (click)="exportToExcel()"><em class="fa fa-file-arrow-down fa-2x"></em></button> -->
  </div>
