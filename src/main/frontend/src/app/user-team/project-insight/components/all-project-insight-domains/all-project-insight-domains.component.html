<div class="all-domains-container">
  <p class="page-title">All Domains</p>

  <!-- Search Section -->
  <div class="search-section">
    <div class="search-input-group">
      <input type="text" class="search-input"
      (focus)="showRecommendations = true" placeholder="Search domains..." [value]="searchQuery" (input)="searchDomains($event)">
    </div>
    <!-- Recommendation Dropdown -->
    <div class="recommendations" *ngIf="showRecommendations && (recommendedDomains.length > 0 || isLoadingRecommendations)">
    <div *ngIf="isLoadingRecommendations" class="loading">
      <span class="spinner"></span> Loading...
    </div>
    <ul *ngIf="!isLoadingRecommendations">
      <li 
      *ngFor="let rec of recommendedDomains; let i = index" 
      (click)="searchWholeDomain(rec)"
      tabindex="-1">
        {{ rec }}
      </li>
    </ul>
  </div>

  </div>

  <!-- Domains List -->
  <div class="domains-list">
    <ng-container *ngIf="filteredDomains.length > 0; else noResults">
      <ng-container *ngFor="let domain of filteredDomains">
        <ng-container *ngTemplateOutlet="renderDomain; context: { $implicit: domain }"></ng-container>
      </ng-container>
    </ng-container>

    <ng-template #noResults>
      <div class="no-results">
        <div class="search-icon">🔍</div>
        <p>No domains found</p>
        <p *ngIf="searchQuery" class="small">Try adjusting your search</p>
      </div>
    </ng-template>

    <ng-template #renderDomain let-domain>
  <div class="domain-item">
    <div class="domain-row"
      [ngClass]="{ 'active': (selectedDomainName?.has(domain.name) || childrenSelectedDomainId?.has(domain.id)) }"
      (click)="filterProjectWithDomains(domain)">  <!-- make whole row clickable -->
      
      <div class="domain-left" [title]="domain.name + ' ('+domain.type+')'">
        <button 
          *ngIf="domain.isChildAvailable" 
          class="toggle-btn arrow" 
          (click)="onToggle(domain); $event.stopPropagation()"> <!-- stop bubbling -->
          {{ domain.isOpen ? '▼' : '▶' }}
        </button>
        
        <span class="domain-name">
          <span [innerHTML]="domain.name | highlight : searchQuery"></span>
        </span>
      </div>
      
      <span class="domain-type" [class]="'type-' + getColour(domain.type)">
        {{ getType(domain.type) }}
      </span>
    </div>

    <!-- Recursive Children -->
    <div *ngIf="domain.isOpen && domain.children?.length" class="domain-children">
      <ng-container *ngFor="let child of domain.children">
        <ng-container *ngTemplateOutlet="renderDomain; context: { $implicit: child }"></ng-container>
      </ng-container>
    </div>
  </div>
</ng-template>

  </div>
</div>
