<div class="main-content">
    <!-- Table Section -->
    <div class="table-section">
        <div class="row align-items-center mb-3">
            <div class="col-md-6 input-group">
                <input type="text" class="form-control table-search" placeholder="Search" [(ngModel)]="searchKeyword" />
                <button class="btn btn-primary ml-1" type="button" (click)="onGlobalSearch()">
                    Search
                </button>&nbsp;
                <button class="btn btn-outline-primary btn-sm mr-1" (click)="openFilterModal()">
                    <i class="fa fa-filter"></i>
                </button>
            </div>
            <div class="col-md-6">
                <div class="d-flex justify-content-end">
                    <button class="btn btn-outline-primary btn-sm" (click)="onOpenCreateProject()">
                        <i class="fa fa-plus"></i> Create Project Insight
                    </button>&nbsp;&nbsp;
                    <div class="input-group file-upload-group" style="max-width: 200px; height: 3rem;">
                        <input type="file" class="form-control mr-1" id="projectInsightDetailsImport" #fileInput  style="height: 3rem;"
                            accept=".xlsx, .xls" (change)="handleFileInput($event)" [disabled]="files">
                        <button type="button" title="Remove File" class="btn btn-outline-secondary btn-sm"
                            (click)="clearFileInput()" [disabled]="files == null">
                            <i class="fa fa-window-close"></i>
                        </button>
                    </div>&nbsp;&nbsp;
                    <button type="button" class="btn btn-primary btn-sm"
                        (click)="saveProjectInsightDetailsFromExcel()" title="Upload Excel" [disabled]="files == null">
                        <i class="fa fa-upload" aria-hidden="true"></i>
                    </button>&nbsp;&nbsp;
                    <button class="btn btn-outline-primary btn-sm" title="Export Template"
                        (click)="exportTemplate()">
                        <i class="fa-solid fa-arrow-down"></i>
                        Export Template
                    </button>
                </div>
            </div>
        </div>

        <div class="overflow-auto" bassHorizontalScroll [tableId]="'projectInfo'" [tableTHeadId]="'projectInfoTHead'"
            [tableTHeadTrId]="'projectInfoTHeadTr'">
            <table class="table" id="projectInfo" matSort (matSortChange)="sortData($event)">
                <thead class="thead-light" id="projectInfoTHead">
                    <tr id="projectInfoTHeadTr">
                        <th scope="col" class="info-label">Sr No.</th>
                        <th scope="col" class="info-label" mat-sort-header="name|string">Project Name</th>
                        <th scope="col" class="info-label" mat-sort-header="hodName|string">Project Manager</th>
                        <th scope="col" class="info-label" mat-sort-header="createdByName|string">Client</th>
                        <th scope="col" class="info-label" mat-sort-header="createdOn|datetime">Created By</th>
                        <th scope="col" class="info-label">Action</th>
                    </tr>
                    <tr app-column-filter-bar *ngIf="isSearchEnabled" [columnList]="projectColumns"
                        (onSearch)="onSearch($event);page=1"></tr>
                </thead>
                <tbody>
                    <tr
                        *ngIf="allProjectInsightProjectList.length == 0 || (allProjectInsightProjectList | colFilter:filters:false).length == 0">
                        <th colspan="6" class="text-center info-label">No details to display...</th>
                    </tr>
                    <tr
                        *ngFor="let proj of allProjectInsightProjectList | colFilter:filters:false | sort : [sortColumn, sortColumnType, sortDirection] |paginate: { itemsPerPage: 10, currentPage: page }, let i = index">
                        <th class="info-label">{{10*(page-1)+i+1}}</th>
                        <td>{{proj.projectName}}</td>
                        <td>{{proj.projectManagerName}}</td>
                        <td>{{proj.client}}</td>
                        <td>{{proj.createdByName}}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" type="submit"
                                (click)="onViewProject(proj.projectInsightDetailsId)">
                                <em class="fa-solid fa-eye"></em>
                            </button>&nbsp;
                            <button class="btn btn-sm btn-outline-primary" type="submit"
                                (click)="onEditProject(proj.projectInsightDetailsId)">
                                <em class="fa fa-edit"></em>
                            </button>&nbsp;
                            <button class="btn btn-sm btn-outline-danger" type="submit"
                                (click)="onDeleteProject(proj.projectInsightDetailsId)">
                                <em class="fa fa-trash"></em>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <pagination-controls class="pagination" [hidden]="allProjectInsightProjectList.length == 0"
            (pageChange)="handlePageChange($event)"></pagination-controls>
    </div>
</div>

<!-- Filter Project Insight Modal -->
<div *ngIf="filterModal">
    <app-filter-project-insight [isVisible]="filterModal" (onClose)="closeFilterModal()"
        (onApplyFilter)="applyFilterModal($event)" [existingFilters]="existingFilter"></app-filter-project-insight>
</div>
