<div class="table-container" bassHorizontalScroll [tableId]="'projectInfo'"
                    [tableTHeadId]="'projectInfoTHead'" [tableTHeadTrId]="'projectInfoTHeadTr'">
                    <table class="table" id="project-info" matSort (matSortChange)="sortData($event)">
                        <thead class="thead-light">
                            <tr id="projectInfoTHeadTr">
                                <th></th>
                                <!-- <th scope="col" class="info-label">Actions</th> style="max-width: fit-content;min-width: 120px;"-->
                                <th scope="col" class="info-label" >Sr No.</th>
                                <th scope="col" class="info-label" mat-sort-header="clientState|string">State</th>
                            </tr>
                            <tr app-column-filter-bar *ngIf="allProjectTable && isSearchEnabled"
                                [columnList]="tableColumns" (onSearch)="onSearch($event);page=1"></tr>
                        </thead>
                        <tbody>
                            <ng-container *ngIf="allEmployeeData.length == 0">
                                <tr>
                                    <th colspan="2" style="max-width: fit-content;" class="text-center info-label">No details to display...</th>
                                </tr>
                                
                            </ng-container>
                            <ng-container>
                                
                            </ng-container>
                        </tbody>
                    </table>
                     <div class="row col-md-12">
                        <pagination-controls class="my-pagination" [hidden]="allEmployeeData.length == 0"
                            (pageChange)="handlePageChange($event)"></pagination-controls>

                    </div>
                </div>
