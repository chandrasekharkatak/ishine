<div class="overflow-auto" bassHorizontalScroll [tableId]="'auditInfo'"
                            [tableTHeadId]="'auditInfoTHead'" [tableTHeadTrId]="'auditInfoTHeadTr'">
                            <table class="table table-responsive" id="auditInfo" >
                                <!-- matSort
                                (matSortChange)="sortData($event)" -->
                                <thead class="thead-light" id="auditInfoTHead">
                                    <tr id="auditInfoTHeadTr">
                                        <!-- <th scope="col">Sr No.</th> -->
                                        <th scope="col" class="info-label" colspan="2">Expired On</th>
                                        <th scope="col" class="info-label" colspan="4">Client Name</th>
                                        <th scope="col" class="info-label" colspan="2">Project Id</th>
                                        <th scope="col" class="info-label" colspan="4">Project Name</th>
                                        <th scope="col" class="info-label" colspan="2">PO No.</th>
                                        <th scope="col" class="info-label" colspan="2">Project Type</th>
                                        <th scope="col" class="info-label" colspan="5">Send E-Mail</th>
                                        <th scope="col" class="info-label" colspan="2">Modify</th>
                                        <!-- <th scope="col" class="info-label" >
                                            Updated By</th> -->
                                    </tr>

                                    <!-- mat-sort-header="date|datetime"
                                    mat-sort-header="field|string"
                                    mat-sort-header="value|string"
                                    mat-sort-header="bucketName|string"
                                    mat-sort-header="updatedByName|string" -->
                                    <!-- <tr app-column-filter-bar *ngIf="isTable && isAuditSearchEnabled"
                                        [columnList]="employeeAuditColumns" (onSearch)="onAuditSearch($event);page=1">
                                    </tr> -->
                                </thead>
                                <tbody>
                                    <tr *ngIf="employee.length === 0">
                                        <th colspan="11" class="text-center info-label">No details to display...</th>
                                    </tr>
                                    <tr *ngFor="let expData of employee">
                                        <!-- <td>{{i}}</td> -->
                                        <td colspan="2">{{expData.poEndDate}}</td>
                                        <td colspan="4">{{expData.clientName}}</td>
                                        <td colspan="2">{{expData.projectId}}</td>
                                        <td colspan="4">{{expData.projectName}}</td>
                                        <td colspan="2">{{expData.poNo}}</td>
                                        <td colspan="2">{{expData.poProjectType}}</td>
                                        <td colspan="5">
                                            <button type="button" class="btn btn-primary">
                                             Send Email
                                            </button>
                                        </td>
                                        <td colspan="2">
                                          <button type="button" class="btn btn-warning">
                                            Edit
                                          </button>
                                        </td>
                                    </tr>
                                        
                                
                                </tbody>
                            </table>
                        </div>

                            <pagination-controls id="kycUpdate" class="my-pagination"
                                [hidden]="kycUpdateList.length == 0"
                                (pageChange)="handleAuditPageChanges($event)"></pagination-controls>
                        </div> -->
