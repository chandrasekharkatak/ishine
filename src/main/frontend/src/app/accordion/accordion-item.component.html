<div class="acc-header" (click)="toggle()"  
    [style.backgroundColor]="titleBg"
    [style.color]="titleColor"
>
    <div class="headerTitle">
        {{title}}
    </div>
    <div [@rotateState]="!showBody? 'default':'rotated'" class="arrow"><i class="fa-solid fa-angle-down"></i></div>
</div>
<div [@smoothCollapse]="!showBody? 'initial':'final'">
    <div class="acc-body" [style.backgroundColor]="contentBg" >
        <ng-content></ng-content>
    </div>
</div>
