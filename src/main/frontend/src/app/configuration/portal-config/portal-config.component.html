<div class="row mb-3">
    <div class="col-md-12 px-0">
        <button type="button" class="btn btn-outline-primary btn-sm mx-1" (click)="showPortalConfiguration()" [ngClass]="{'active' : isPortalConfiguration}">Portal Configuration</button>
        <button type="button" class="btn btn-outline-primary btn-sm mx-1" (click)="showAppreciationConfiguration()" [ngClass]="{'active' : isAppreciationConfiguration}">Appreciation Configuration</button>
    </div>
</div>

<!-- Portal Configuration : start -->

<div class="row">
    <div class="card col-md-12 px-0" *ngIf="isPortalConfiguration">
        <div class="card-header text-center text-uppercase">
            <strong>Portal Global Configuration</strong>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-4 mb-0">
                    <div class="info-wrapper">
                        <div class="form-group">
                            <label><span class="text-danger">*</span>Probation Period</label>
                            <input type="number" class="form-control" autocomplete="none" [(ngModel)]="portalObj.probationPeriod">
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-0">
                    <div class="info-wrapper">
                        <div class="form-group">
                            <label><span class="text-danger">*</span>Mail Trigger For Probation Period <small>(Days)</small></label>
                            <input type="number" class="form-control" autocomplete="none" [(ngModel)]="portalObj.probationMailTrigger">
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-0">
                    <div class="info-wrapper">
                        <div class="form-group">
                            <label><span class="text-danger">*</span>Notice Period</label>
                            <input type="number" class="form-control" autocomplete="none" [(ngModel)]="portalObj.noticePeriod">
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-0">
                    <div class="info-wrapper">
                        <div class="form-group">
                            <label><span class="text-danger">*</span>Mail Trigger For Notice Period <small>(Days)</small></label>
                            <input type="number" class="form-control" autocomplete="none" [(ngModel)]="portalObj.noticeMailTrigger">
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-0">
                    <div class="info-wrapper">
                        <div class="form-group">
                            <label><span class="text-danger">*</span>OTRS <small>(Recruitment Link)</small></label>
                            <input type="text" class="form-control" autocomplete="none" [(ngModel)]="portalObj.otrsLink">
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-0">
                    <div class="info-wrapper">
                        <div class="form-group">
                            <label><span class="text-danger">*</span>SNIPIT <small>(Asset Management Link)</small></label>
                            <input type="text" class="form-control" autocomplete="none" [(ngModel)]="portalObj.snipitLink">
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-0">
                    <div class="info-wrapper">
                        <div class="form-group">
                            <label><span class="text-danger">*</span>DSR <small>(Folder path)</small></label>
                            <input type="text" class="form-control" autocomplete="none" [(ngModel)]="portalObj.dsrDownloadPath">
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-0">
                    <div class="info-wrapper">
                        <div class="form-group">
                            <label><span class="text-danger">*</span>Generate DSR On Day <small>(Every month)</small></label>
                            <input type="text" class="form-control" autocomplete="none" [(ngModel)]="portalObj.dsrGenerateDay">
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-0">
                    <button type="button" class="btn btn-outline-primary btn-sm mx-1 dsr-button" (click)="generatePerviousMonthDSR(alert_message)">Generate Pervious Month DSR</button>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-12">
                    <button type="submit" class="btn btn-primary btn-sm mx-1" (click)="updatePortalGlobalConfiguration(portalObj,alert_message)">Update Portal Global Configuration</button>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- Appreciation Configuration : start -->

<div class="row">
    <div class="col-md-12 px-0" *ngIf="isAppreciationConfiguration">
        <h6>Appreciation Configuration</h6>
    </div>
</div>       

<ng-template #alert_message>
    <div class="modal-body text-center">
        <p>{{alertMessage}}</p>
        <button type="button" class="btn btn-primary" (click)="cancelRequest()">OK</button>&nbsp;
    </div>
</ng-template>
