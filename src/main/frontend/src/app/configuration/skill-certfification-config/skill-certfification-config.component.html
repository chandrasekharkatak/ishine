<div class="row mb-3">
    <div class="col-md-12 px-0">
        <button class="btn btn-outline-primary btn-sm mx-1" [ngClass]="{'active' : isSkillCertficateUpload}"
            (click)="showFileUploadForm()">Skill Certfications Import <small>(skills)</small></button>
    </div>
</div>


<div class="row" *ngIf="isSkillCertficateUpload">
    <div class="col-md-12">
        <div class="row">
            <div class="col-md-12 table-header">
                <h1 class="table-header-title">Skills & Certfications Import</h1>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-4">
                <div class="info-wrapper">
                    <div class="form-group">
                        <label class="info-label">
                            <span class="text-danger">*</span>What do you want to import?
                        </label>
                        <select class="form-control" [(ngModel)]="skillCertConfigObj.importType">
                            <option value="" disabled selected>Select</option>
                            <option value="Skill">Skill</option>
                            <option value="Certification">Certification</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4  mt-4">
                <div class="info-wrapper">
                    <div class="form-group">
                        <label class="info-label"><span class="text-danger">*</span>Download Sheet Format</label>
                        <button class="btn btn-outline-danger"><em class="fa fa-download" (click)="downloadTemplate()"></em></button>
                    </div>
                </div>
            </div>


            <div class="col-md-4 mb-0 mt-4">
                <div class="info-wrapper">
                    <div class="form-group">
                        <label class="info-label"><span class="text-danger">*</span>Bulk Upload</label>
                        <input type="file" class="form-control p-1" (change)="onSkillCertficateFileSelect($event,alert_message)">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #alert_message>
    <div class="modal-body text-center">
        <p>{{alertMessage}}</p>
        <button type="button" class="btn btn-primary" (click)="cancelRequest()">OK</button>&nbsp;
    </div>
</ng-template>
