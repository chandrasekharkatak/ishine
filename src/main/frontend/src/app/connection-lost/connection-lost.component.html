<div class="grid-bg"></div>

<div class="container">
  <!-- Broken Wire SVG -->
<div class="wire-container">
   <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg"> 
    <path class="wire-line" d="M 50 100 L 150 100 L 150 80 L 180 80" />
     <circle cx="200" cy="80" r="8" class="wire-break" /> 
     <circle cx="200" cy="80" r="5" fill="#ff0055" opacity="0.8" /> 
     <path class="wire-line" d="M 220 80 L 250 80 L 250 100 L 350 100" /> 
     <!-- Sparks --> 
      <circle class="spark" cx="200" cy="80" r="3" style="--tx: -20px; --ty: -30px; animation-delay: 0s;" /> 
      <circle class="spark" cx="200" cy="80" r="2" style="--tx: 25px; --ty: -25px; animation-delay: 0.2s;" /> 
      <circle class="spark" cx="200" cy="80" r="2.5" style="--tx: -15px; --ty: 35px; animation-delay: 0.4s;" /> 
      <circle class="spark" cx="200" cy="80" r="2" style="--tx: 30px; --ty: 20px; animation-delay: 0.6s;" /> 
    </svg> 
  </div>


  <!-- Error Code -->
  <div class="error-code">404</div>
  <div class="status-text">Oops! We can’t find that page.</div>
  <div class="description">
    The page you’re looking for isn’t available right now. Check the URL or return to the homepage to reconnect.  !!! </div>

  <!-- Terminal Info -->

<div class="terminal-info">
  <div class="terminal-line"><span class="terminal-label">ERROR:</span> Resource not found</div>
  <div class="terminal-line"><span class="terminal-label">STATUS:</span> Disconnected from server</div>
  <div class="terminal-line"><span class="terminal-label">CODE:</span> 404_PAGE_NOT_FOUND</div>
  <div class="terminal-line"><span class="terminal-label">TIME:</span> {{ currentTime }}</div>
</div>


  <!-- Action Buttons -->
  <div class="button-group">
    <button class="btn" (click)="goHome()">Return Home</button>
    <button class="btn btn-secondary" (click)="goHome()">Go Back</button>
  </div>
</div>
