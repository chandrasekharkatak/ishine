<div class="mt-5">
    <app-breadcrumb></app-breadcrumb>
</div>

<div class="row px-0">
    <div class="col-md-12">
        <div class="card">
            <ul class="nav nav-tabs exit__tabs" id="exitTab" role="tablist">
                <li class="nav-item exit__tab-item" *ngIf="userMapping.my_resignation"  (click)="removeActiveTab()">
                    <a class="nav-link exit__tab-item__link" id="my-resignation-tab" data-toggle="tab" role="tab"
                        aria-controls="myResignation" aria-selected="true" routerLink="my-resignation">My Resignation</a>
                </li>
                <li class="nav-item exit__tab-item" *ngIf="userMapping.resignation" (click)="removeActiveTab()">
                    <a class="nav-link exit__tab-item__link" id="resignation-tab" data-toggle="tab" role="tab"
                        aria-controls="resignation" aria-selected="false" routerLink="resignation">Resignation</a>
                </li>
            </ul>
        
            <!-- tab Containers -->
            <div class="tab-content" id="exitTabContent">
                <div class="exit__tab-container">
                    <router-outlet class="tab-pane fade" role="tabpanel"></router-outlet>
                </div>
            </div>
        </div>
    </div>
</div>
