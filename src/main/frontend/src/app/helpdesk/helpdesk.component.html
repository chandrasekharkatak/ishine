<div class="mt-5">
    <app-breadcrumb></app-breadcrumb>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-12">
                        <div class="row">
                            <div class="col-md-12 table-header">
                                <h1 class="table-header-title">Help</h1>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                                <div class="selector-toggle" (click)="toggleSearch()">
                                    <a href="javascript:void(0)">
                                        <i *ngIf="!isSearchEnabled" class="fa fa-search"></i>
                                        <i *ngIf="isSearchEnabled" class="fa-solid fa-xmark"></i>
                                    </a>
                                </div>
                                <div class="overflow-auto">
                                    <table class="table" matSort (matSortChange)="sortData($event)" id="helpDocInfo">
                                        <thead class="thead-light" id="helpDocInfoTHead">
                                            <tr id="helpDocInfoTHeadTr">
                                                <th scope="col" class="info-label">Sr No.</th>
                                                <th scope="col" class="info-label" mat-sort-header="fileName|string">File Name</th>
                                                <th scope="col" class="info-label" mat-sort-header="helpDocumentName|string">Help Document Name</th>
                                                <th scope="col" class="info-label" mat-sort-header="createdByName|string">Created By</th>
                                                <th scope="col" class="info-label" mat-sort-header="createdOn|datetime">Created On</th>
                                                <th scope="col" class="info-label">Action</th>
                                            </tr>
                                            <tr app-column-filter-bar *ngIf="isSearchEnabled" [columnList]="documentsColumns"
                                                (onSearch)="onSearch($event);page=1"></tr>
                                        </thead>
                                        <tbody>
                                            <tr *ngIf="document.length == 0 || (document | colFilter:filters:false).length == 0">
                                                <th colspan="8" class="text-center info-label">No Files to display...</th>
                                            </tr>
                                            <tr
                                                *ngFor="let doc of document | colFilter:filters:false | sort : [sortColumn, sortColumnType, sortDirection] | paginate: { itemsPerPage: 10, currentPage: page }, let i = index">
                                                <th class="info-label">{{10*(page-1)+i+1}}</th>
                                                <td>{{doc.fileName}}</td>
                                                <td>{{doc.helpDocumentName}}</td>
                                                <td>{{doc.createdByName}}</td>
                                                <td>{{doc.createdOn}}</td>
                                                <td>
                                                    <button class="btn btn-sm btn-outline-primary" (click)="downloadFile(doc)" type="submit"><em class="fa fa-download"></em></button>&nbsp;
                                                    <button class="btn btn-sm btn-outline-primary" (click)="previewHelpDocument(preview_document,doc)" type="submit"><em>Preview Document</em></button>&nbsp;
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <pagination-controls class="my-pagination" [hidden]="document.length == 0" (pageChange)="handlePageChange($event)"></pagination-controls>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Templates-->
<ng-template #alert_message>
    <div class="modal-body text-center">
        <p>{{alertMessage}}</p>
        <button type="button" class="btn btn-primary" (click)="cancelRequest()">OK</button>&nbsp;
    </div>
</ng-template>

<ng-template #preview_document>
    <div class="modal-body">
        
        <div class="row">
            <div class="card col-md-12 p-0">
                <div class="card-header text-center text-uppercase">
                    <strong>{{fileName}}</strong>
                </div>
                <div class="card-body">
                    <div id="outerContainer">
                        <div class="pdf-container">
                          <pdf-viewer
                            [src]="src"
                            [rotation]="0"
                            [original-size]="false"
                            [show-all]="true"
                            [fit-to-page]="false"
                            [zoom]="1"
                            [zoom-scale]="'page-width'"
                            [stick-to-page]="false"
                            [render-text]="true"
                            [external-link-target]="'blank'"
                            [autoresize]="true"
                            [show-borders]="false"
                            style="width: 100%; height: 600px;"
                          ></pdf-viewer>
                        </div>
                      </div>
                </div>
            </div>
        </div>

        <button type="button" class="btn btn-primary" (click)="cancelRequest()">OK</button>&nbsp;
    </div>
</ng-template>
