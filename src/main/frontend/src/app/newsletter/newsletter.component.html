<div class="row" style="margin-top: 50px;">
  <div class="col-md-12">

    <div class="card">
      <div class="row mb-3" style="margin-left: 10px; margin-top: 15px;">
        <div class="col-md-12 px-0">
          <button *ngFor="let type of fileType" type="button" class="btn btn-outline-primary btn-sm mx-1"
            (click)="showTable(type,alert_message)" [ngClass]="{'active' : type.isActive}">{{type.typeName}}</button>
        </div>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-12" *ngIf="isTable">
            <div class="row">
              <div class="col-md-12 table-header">
                <h1 class="table-header-title">{{typeNames}}</h1>
              </div>
            </div>

            <div class="row">
              <div class="col-md-12">
                <div class="selector-toggle" (click)="toggleSearch()">
                  <a href="javascript:void(0)">
                    <i *ngIf="!isSearchEnabled" class="fa fa-search"></i>
                    <i *ngIf="isSearchEnabled" class="fa-solid fa-xmark"></i>
                  </a>
                </div>

                <!-- added by anurag custom filter for document -->

                <div class="col-2 col-sm-2 col-md-2 col-lg-2 ml-auto mb-2">
                  <button type="button" id="buttonPosition" class="btn btn-sm btn-outline-primary mt-1"
                    (click)="openFilterModal(filter, newsletterColumns, 'Filter All Document')">
                    <i class="fa-solid fa-filter"></i>
                  </button>
                </div>



                <div class="overflow-auto" bassHorizontalScroll [tableId]="'newsletterInfo'"
                  [tableTHeadId]="'newsletterInfoTHead'" [tableTHeadTrId]="'newsletterInfoTHeadTr'">
                  <table class="table" id="newsletterInfo" matSort (matSortChange)="sortData($event)">
                    <thead class="thead-light" id="newsletterInfoTHead">
                      <tr id="newsletterInfoTHeadTr">
                        <th scope="col" class="info-label">Sr No.</th>
                        <th scope="col" class="info-label" mat-sort-header="displayName|string">Document Name</th>
                        <th scope="col" class="info-label" mat-sort-header="createdByName|string">Created By</th>
                        <th scope="col" class="info-label" mat-sort-header="createdOn|datetime">Created On</th>
                        <th scope="col" class="info-label">Action</th>
                      </tr>
                      <tr app-column-filter-bar *ngIf="isSearchEnabled" [columnList]="newsletterColumns"
                        (onSearch)="onSearch($event);page=1"></tr>
                    </thead>
                    <tbody>
                      <tr *ngIf="newsletters.length == 0 || (newsletters | colFilter:filters:false).length == 0">
                        <th colspan="6" class="text-center info-label">No Document to display...</th>
                      </tr>
                      <tr
                        *ngFor="let doc of newsletters | colFilter:filters:false | sort : [sortColumn, sortColumnType, sortDirection] |  paginate: { itemsPerPage: 10, currentPage: page }, let i = index  ">
                        <th class="info-label">{{10*(page-1)+i+1}}</th>
                        <td>{{doc.displayName}}</td>
                        <td>{{doc.name}}</td>
                        <td>{{doc.createdOn}}</td>
                        <td>
                          <button class="btn btn-sm btn-outline-primary" *ngIf="doc.isRead" type="submit"
                            (click)="downloadFile(doc)"><em class="fa fa-download"></em></button> &nbsp;
                          <button class="btn btn-sm btn-outline-primary"
                            (click)="previewPolicyDocument(preview_document,doc)" type="submit"
                            [disabled]="loadingDocument">Read & View</button>&nbsp;
                        </td>
                    </tbody>
                  </table>
                </div>
                <pagination-controls class="my-pagination" [hidden]="newsletters.length == 0"
                  (pageChange)="handlePageChange($event)"></pagination-controls>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>


<!-- Modal Templates-->
<ng-template #alert_message>
  <div class="modal-body text-center">
    <p>{{alertMessage}}</p>
    <button type="button" class="btn btn-primary" (click)="cancelRequest()">OK</button>&nbsp;
  </div>
</ng-template>

<ng-template #preview_document>
  <div class="modal-body">

    <div class="row">
      <div class="card col-md-12 p-0">
        <div class="card-header text-center text-uppercase">
          <strong>{{fileName}}</strong><br>
        </div>
        <div class="card-body">
          <div id="outerContainer">
            <div class="pdf-container">
              <pdf-viewer [src]="src" [rotation]="0" [original-size]="false" [show-all]="true" [fit-to-page]="false"
                [zoom]="1" [zoom-scale]="'page-width'" [stick-to-page]="false" [render-text]="true"
                [external-link-target]="'blank'" [autoresize]="true" [show-borders]="false"
                style="width: 100%; height: 500px;"></pdf-viewer>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row mt-2">
      <div class="col-md-12">
        <button class="btn btn-sm btn-outline-primary mt-1" *ngIf="!newsletterObj.isRead" type="submit"
          (click)="onReadNewsletter(alert_message)">Close</button>
        <button type="button" class="btn btn-outline-primary" *ngIf="newsletterObj.isRead"
          (click)="cancelRequest()">Close</button>&nbsp;
      </div>
    </div>
  </div>
</ng-template>

<ng-template #filter>
  <div class="modal-header">
    <b>{{filterData.title}}</b>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cancelRequest()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body ">
    <app-custom-filter (filterSubmitted)="onFilterSubmit($event,alert_message)" [data]="filterData"></app-custom-filter>
  </div>
</ng-template>
