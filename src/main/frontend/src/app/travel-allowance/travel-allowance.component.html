<div class="mt-5">
    <app-breadcrumb></app-breadcrumb>
</div>

<div class="row px-0">
    <div class="col-md-12">
        <div class="card">
            <ul class="nav nav-tabs timesheet__tabs" id="timesheetTab" role="tablist">
                <li *ngIf="userMapping.apply_journey" class="nav-item timesheet__tab-item" >
                    <a class="nav-link timesheet__tab-item__link" id="my-timesheet-tab" data-toggle="tab" role="tab"
                        aria-controls="my-timesheet" aria-selected="true" routerLink="my-travelrequest">Apply Travel Request</a>
                </li>
                <li *ngIf="userMapping.view_request" class="nav-item timesheet__tab-item" >
                    <a class="nav-link timesheet__tab-item__link" id="team-timesheet-tab" data-toggle="tab" role="tab"
                        aria-controls="team-timesheet" aria-selected="false" routerLink="view-travelrequest">View Travel Request</a>
                </li>
                <!--for managers-->
                <li *ngIf="userMapping.approve_journey" class="nav-item timesheet__tab-item" >
                    <a class="nav-link timesheet__tab-item__link" id="team-timesheet-tab" data-toggle="tab" role="tab"
                        aria-controls="team-timesheet" aria-selected="false" routerLink="approve-travelrequest">Approve Travel Request</a>
                </li>
                <!-- *ngIf="userMapping.total_travelrequest" -->
                <!--for managers-->
                <li  *ngIf="userMapping.total_travelrequest" class="nav-item timesheet__tab-item" >
                    <a class="nav-link timesheet__tab-item__link" id="team-timesheet-tab" data-toggle="tab" role="tab"
                        aria-controls="team-timesheet" aria-selected="false" routerLink="total-travelrequest">Total Travel Request</a>
                </li>
            </ul>
        
            <!-- tab Containers -->
            <div class="tab-content" id="timesheetTabContent">
                <div class="timesheet__tab-container">
                    <router-outlet class="tab-pane fade" role="tabpanel"></router-outlet>
                </div>
            </div>
        </div>
    </div>
</div>
