<!-- start :: Create & Update Team -->
<div class="row">
    <div class="card col-md-12 px-0">
        <div class="card-header text-center text-uppercase">
            <strong>Create New Request</strong>
            <!-- <strong *ngIf="isUpdation">Update Timesheet</strong> -->
        </div>
        <div class="card-body">
            <div class="row">

                <div class="col-md-3">
                    <label class="info-label">
                        <span class="text-danger">*</span>Full Name
                    </label>
                    <input type="text" class="form-control" [(ngModel)]="currentEmployeeInfo.name" name="fullName"
                        disabled required />
                </div>

                <div class="col-md-3 mb-0">
                    <label class="info-label">
                        <span class="text-danger">*</span>Employee Id
                    </label>
                    <input type="text" class="form-control" [(ngModel)]="currentEmployeeInfo.employeementId"
                        name="employeeId" disabled required />
                </div>

                <div class="col-md-3 mb-0">
                    <label class="info-label">
                        <span class="text-danger">*</span>Department
                    </label>
                    <input type="text" class="form-control" [(ngModel)]="currentEmployeeInfo.departmentName"
                        name="departmentName" disabled required />
                </div>

                <div class="col-md-3 mb-0">
                    <label class="info-label">
                        <span class="text-danger">*</span>Designation
                    </label>
                    <input type="text" class="form-control" [(ngModel)]="currentEmployeeInfo.designationName"
                        name="designationName" disabled required />
                </div>

                <div class="col-md-3 mb-0">
                    <label class="info-label">
                        <span class="text-danger">*</span>Mail Id
                    </label>
                    <input type="text" class="form-control" [(ngModel)]="currentEmployeeInfo.email" name="email"
                        disabled required />
                </div>

                <div class="col-md-3 mb-0">
                    <label class="info-label">
                        <span class="text-danger">*</span>Mobile No
                    </label>
                    <input type="text" class="form-control" [(ngModel)]="currentEmployeeInfo.mobileNo" name="mobileNo"
                        disabled required />
                </div>

                <div class="col-md-3 mb-0">
                    <label class="info-label">
                        <span class="text-danger">*</span>Manager Name
                    </label>
                    <input type="text" class="form-control" [(ngModel)]="currentEmployeeInfo.managerName"
                        name="managerName" disabled required />
                </div>

                <div class="col-md-3 mb-0">
                    <label class="info-label"><span class="text-danger">*</span>Reason for Travel</label>
                    <select class="form-control" [(ngModel)]="travelDeskObj.associatedTravelRequest"
                        name="associatedTravelRequest" required
                        (change)="onTravelReasonChange(travelDeskObj.associatedTravelRequest)">
                        <option value="" disabled selected>Select</option>
                        <option *ngFor="let reason of travelReasonlist" [value]="reason.travelReasonName">
                            {{ reason.travelReasonName }}
                        </option>
                    </select>
                </div>



                <!-- <div class="col-md-3 mb-0" *ngIf="travelDeskObj.associatedTravelRequest === 'Hotel'"> -->
                <div class="col-md-3 mb-0" *ngIf="travelDeskObj.associatedTravelRequest === 'Hotel & Lodging'">
                    <label class="info-label">
                        <span class="text-danger">*</span>Hotel Booking Category
                    </label>
                    <select class="form-control" [(ngModel)]="travelDeskObj.hotelCategory" name="hotelCategory"
                        required>
                        <option value="" disabled>Select Category</option>
                        <option *ngFor="let category of hotelCategorylist" [value]="category.hotelCategoryName">
                            {{ category.hotelCategory }}
                        </option>
                    </select>
                </div>

                <div class="col-md-3 mb-0" *ngIf="travelDeskObj.associatedTravelRequest === 'Hotel & Lodging'">
                    <label class="info-label"><span class="text-danger">*</span>Sub Category</label>
                    <select class="form-control" [(ngModel)]="travelDeskObj.tlSubCategory" name="tlSubCategory" required
                        (change)="onSubCategoryChanges(travelDeskObj.tlSubCategory)">
                        <!-- (ngModelChange)="onSubCategoryChange($event)"> -->
                        <option value="" disabled>Select Sub Category</option>
                        <option *ngFor="let sub of hotelSubCategorylist" [value]="sub.hotelSubCategoryName">
                            {{ sub.hotelSubCategoryName }}
                        </option>
                    </select>
                </div>

                <div class="col-md-3 mb-0"
                    *ngIf="travelDeskObj.tlSubCategory && travelDeskObj.associatedTravelRequest == 'Hotel & Lodging'">
                    <label class="info-label"><span class="text-danger">*</span>Select City</label>
                    <select class="form-control" [(ngModel)]="travelDeskObj.selectedCity" name="selectedCity" required>
                        <option value="" disabled>Select City</option>
                        <option *ngFor="let city of citylistBySubCategory" [value]="city.cityName">{{ city.cityName }}
                        </option>
                    </select>
                </div>

                <div class="col-md-3 mb-0" *ngIf="travelDeskObj.associatedTravelRequest !== 'Hotel & Lodging'">
                    <label class="info-label"><span class="text-danger">*</span>Travel Mode</label>
                    <select class="form-control" [(ngModel)]="travelDeskObj.travelMode" name="travelMode" required
                        (change)="onModeChange(travelDeskObj.travelMode)">
                        <option value="" disabled selected>Select</option>
                        <option *ngFor="let mode of travelModelistByReason" [value]="mode.modeType">
                            {{ mode.modeType }}
                        </option>
                    </select>
                </div>

                <div class="col-md-3 mb-0" *ngIf="travelDeskObj.associatedTravelRequest !== 'Hotel & Lodging'">
                    <label class="info-label"><span class="text-danger">*</span>Travel Class</label>
                    <select class="form-control" [(ngModel)]="travelDeskObj.travelClass" name="travelClass" required>
                        <option value="" disabled>Select</option>
                        <option *ngFor="let travelClass of travelClasslistByReason" [value]="travelClass.travelClass">
                            {{ travelClass.travelClass }}
                        </option>
                    </select>
                </div>

                <div class="col-md-3 mb-0" *ngIf="travelDeskObj.associatedTravelRequest !== 'Hotel & Lodging'">
                    <label class="info-label">
                        <span class="text-danger">*</span>From Location
                    </label>
                    <input type="text" class="form-control" [(ngModel)]="travelDeskObj.fromLocation" name="fromLocation"
                        required />
                </div>

                <div class="col-md-3 mb-0" *ngIf="travelDeskObj.associatedTravelRequest !== 'Hotel & Lodging'">
                    <label class="info-label">
                        <span class="text-danger">*</span>To Location
                    </label>
                    <input type="text" class="form-control" [(ngModel)]="travelDeskObj.toLocation" name="toLocation"
                        required />
                </div>

                <div class="col-md-3 mb-0">
                    <div class="info-wrapper">
                        <div class="form-group">
                            <label class="info-label"><span class="text-danger">*</span>From Date</label>
                            <input class="form-control" [(ngModel)]="travelDeskObj.fromDate" id="fromDate" type="date"
                                [min]="todayDate" [max]="maxTravelRequestDate" placeholder="Choose from date"
                                autocomplete="off">
                        </div>
                    </div>
                </div>

                <div class="col-md-3 mb-0">
                    <div class="info-wrapper">
                        <div class="form-group">
                            <label class="info-label"><span class="text-danger">*</span>To Date</label>
                            <input class="form-control" [(ngModel)]="travelDeskObj.toDate" id="toDate" type="date"
                                [min]="travelDeskObj.fromDate" placeholder="Choose to date" autocomplete="off"
                                [disabled]="!travelDeskObj.fromDate">
                        </div>
                    </div>
                </div>

                <div class="col-md-3 mb-0">
                    <div class="info-wrapper">
                        <label class="info-label">
                            <span class="text-danger">*</span> Kyc Document
                        </label>
                        <div class="d-flex align-items-center">
                            <input type="file" class="form-control" (change)="onFileSelected($event,alert_message)" />
                        </div>
                    </div>
                </div>

                <div class="col-md-3 mb-0">
                    <div class="info-wrapper">
                        <div class="form-group">
                            <label for="purposeOfTravel"><span class="text-danger">*</span>Purpose of Travel</label>
                            <textarea class="form-control" id="purposeOfTravel" rows="3"
                                [(ngModel)]="travelDeskObj.purposeOfTravel" name="purposeOfTravel"></textarea>
                        </div>
                    </div>
                </div>

                <div class="col-md-3 mb-0" *ngFor="let file of fileUploads; let i = index">
                    <div class="info-wrapper">
                        <div class="form-group">
                            <label class="info-label" [for]="'fileUpload' + i">
                                <span></span> Document/GST Bill {{ i + 1 }}
                            </label>
                            <div class="d-flex align-items-center">
                                <input type="file" class="form-control" [id]="'fileUpload' + i"
                                    (change)="onFileChange1($event, i,alert_message)" />
                                <button type="button" class="btn btn-outline-primary ml-2"
                                    (click)="addInputSpecializationField()" [hidden]="fileUploads.length >= 6"
                                    [disabled]="!fileUploads[i]?.file || fileUploads.length >= 6">
                                    <i class="fa fa-plus" aria-hidden="true"></i>
                                </button>
                                <button *ngIf="i > 0" type="button" class="btn btn-outline-danger ml-2"
                                    (click)="removeInputSpecializationField(i)">
                                    <i class="fa fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>


            </div>

            <div class="row mb-3">
                <div class="col-md-12 px-0 text-center">
                    <!-- Reset and Submit buttons -->
                    <button type="button" class="btn btn-secondary btn-lg mx-1"
                        (click)="resetForm(alert_message)">Reset</button>
                    <button type="button" class="btn btn-primary btn-lg mx-1"
                        (click)="submitForm(alert_messagevalidation)">Submit</button>
                </div>
            </div>

        </div>
    </div>
</div>
<!-- end :: create & update Team -->

<ng-template #alert_message>
    <div class="modal-body text-center">
        <p>{{alertMessage}}</p>
        <button type="button" class="btn btn-primary" (click)="cancelRequest()">OK</button>&nbsp;
    </div>
</ng-template>

<ng-template #alert_messagevalidation>
    <div class="modal-body text-center">
        <p>{{alertMessage}}</p>
        <button type="button" class="btn btn-primary" (click)="cancelRequest1()">OK</button>&nbsp;
    </div>
</ng-template>
