<div class="col-md-12 table-header">
    <h1 class="table-header-title">Policies</h1>
  </div>
  <div class="row card">
  <div class="row col-md-12">
      
      
      <div class="form-group ml-auto col-md-3">
      <input type="text" class="form-control" placeholder="Search" >	
      </div>
      <table class="table Policies-table" >	
          <thead class="thead-light">	
            <tr>	
              <th scope="col" class="info-label">File Name</th>	
              <th scope="col" class="info-label">Policy Name</th>
              <th scope="col" class="info-label">Created By</th>
              <th scope="col" class="info-label">Created On</th>
              <th scope="col" class="info-label">Download</th>	   
            </tr>
          </thead>
          <tbody> 
            <tr *ngIf="document.length == 0">
              <th colspan="6" class="text-center info-label">No Document to display...</th>
            </tr>
            <tr *ngFor="let doc of document ">
  
              <td>{{doc.fileName}}</td>
              <td>{{doc.policyName}}</td>
              <td>{{doc.createdByName}}</td>
              <td>{{doc.createdOn | date:'dd-MM-yyyy HH:mm:ss'}}</td>
              <td>Download</td>
          </tbody>
        </table>
       
  </div>
  </div>
