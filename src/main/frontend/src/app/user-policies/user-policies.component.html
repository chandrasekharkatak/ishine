<div class="col-md-12 table-header">
    <!-- <h1 class="table-header-title">Policies</h1> -->
  </div>
  <div class="row card">
  <div class="row col-md-12">     
    <div class="col-md-12 table-header">
      <h1 class="table-header-title">Policies</h1> 
    </div>
        <div class="form-group d-flex flex-row ml-auto col-md-3">
          <input type="text" class="form-control" placeholder="Search" [(ngModel)]="data" (keyup)="page=1">	
          </div>
      <table class="table Policies-table" matSort (matSortChange)="sortData($event)" >
          <thead class="thead-light">	
            <tr>
              <th scope="col" class="info-label">Sr No.</th>	
              <th scope="col" class="info-label" mat-sort-header="fileName">File Name</th>	
              <th scope="col" class="info-label" mat-sort-header="policyName">Policy Name</th>
              <th scope="col" class="info-label" mat-sort-header="createdByName">Created By</th>
              <th scope="col" class="info-label" mat-sort-header="createdOn">Created On</th>
              <th scope="col" class="info-label">Action</th>	  
            </tr>
          </thead>
          <tbody> 
            <tr *ngIf="document.length == 0">
              <th colspan="6" class="text-center info-label">No Document to display...</th>
            </tr>
            <tr *ngFor="let doc of document | filter:data |  paginate: { itemsPerPage: 10, currentPage: page }, let i = index  ">
              <th class="info-label">{{10*(page-1)+i+1}}</th>
              <td>{{doc.fileName}}</td>
              <td>{{doc.policyName}}</td>
              <td>{{doc.createdByName}}</td>
              <td>{{doc.createdOn | date:'dd-MM-yyyy HH:mm:ss'}}</td>
              <td><button  class="btn btn-sm btn-outline-primary"  type="submit" (click)="downloadFile(doc)"><em class="fa fa-download"></em></button> 
              <!-- </td> -->
          </tbody>
        </table>
        <pagination-controls class="my-pagination" [hidden]="document.length == 0" (pageChange)="handlePageChange($event)"></pagination-controls> 

       
  </div>
  </div>
