<!-- start :: See all Surveys Table -->
<div class="row" style="margin-top: 50px;" *ngIf="isSurveyList">
    <div class="col-md-12">
        <div class="card">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-12 table-header">
                        <h1 class="table-header-title">Surveys</h1>
                    </div>
                </div>
        
                <div class="row">
                    <div class="col-md-12">
                        <div class="overflow-auto" bassHorizontalScroll [tableId]="'surveyInfo'"
                        [tableTHeadId]="'surveyInfoTHead'" [tableTHeadTrId]="'surveyInfoTHeadTr'">
                        <table class="table" matSort (matSortChange)="sortData($event)" id="surveyInfo">
                            <thead class="thead-light" id="surveyInfoTHead">
                                <tr id="surveyInfoTHeadTr">
                                    <th scope="col" class="info-label" mat-sort-header="surveyName|string">Survey Name</th>
                                    <th scope="col" class="info-label" mat-sort-header="description|string">Description</th>
                                    <th scope="col" class="info-label">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngIf="allSurveyList.length == 0">
                                    <th colspan="6" class="text-center info-label">No Surveys to display...</th>
                                </tr>
                                <tr
                                    *ngFor="let survey of allSurveyList | sort : [sortColumn, sortColumnType, sortDirection] | paginate: { itemsPerPage: 20, currentPage: page }, let i = index">
                                    <td>{{survey.surveyName}}</td>
                                    <td>{{survey.description}}</td>
                                    <td>
                                        <button *ngIf="!survey.isAnswered" class="btn btn-sm btn-primary" type="submit"
                                        [routerLink]="['/user-survey/',survey.surveyId]" preserveQueryParams="true"><em>Take Survey</em></button>
                                        <button *ngIf="survey.isAnswered" class="btn btn-sm btn-outline-primary" type="submit"
                                            (click)="onViewMyResponse(survey)"><em>View Response</em></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        </div>
                        <pagination-controls class="my-pagination" [hidden]="allSurveyList.length == 0"
                    (pageChange)="handlePageChange($event)"></pagination-controls>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- end :: see all Surveys table -->

<!-- start :: Survey Form -->
<div class="row" *ngIf="isSurveyForm">
    <div class="card col-md-12 px-0">
        <div class="card-header text-uppercase px-3">
            <strong>{{surveyObj.surveyName}}</strong>
            <small class="d-block text-secondary">{{surveyObj.description}}</small>
        </div>
        <div class="card-body px-5" id="surveyContainer">
            <div class="row mt-3">
                <div class="col-md-12">
                    <button type="submit" class="btn btn-primary btn-sm mx-1"
                        (click)="onSubmit(alert_message)" [disabled]="!isSurveyLoaded">Submit</button>
                    <button type="submit" class="btn btn-outline-primary btn-sm mx-1"
                    [routerLink]="['/user-survey']" [disabled]="!isSurveyLoaded">Back</button>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- end :: Survey Form -->


<ng-template #alert_message>
    <div class="modal-body text-center">
        <p>{{alertMessage}}</p>
        <button type="button" class="btn btn-primary" (click)="cancelRequest()">OK</button>&nbsp;
    </div>
</ng-template>

<ng-template #preview_response_template>
    <div class="modal-header">
        <b class="modal-title">{{surveyObj.surveyName}} <small class="d-block text-secondary">{{surveyObj.description}}</small></b>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cancelRequest()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <div class="container-fluid">
            <div class="row" *ngFor="let response of myResponseList">
                <div class="col-md-4 mb-2">
                    <div class="info-wrapper">
                        <h5 class="info-label mb-1"><i class="fa-solid fa-q question-icon"></i>.&nbsp;{{response.question}}</h5>
                        <h5 class="info-text"><i class="fa-solid fa-a question-icon"></i>.&nbsp;{{response.response}}</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
</ng-template>
