        <li class="nav-group" *ngFor="let group of groupedMenuItems">

  <!-- COLLAPSED (narrow) sidebar -->
  <ng-container *ngIf="!collapsed">

    <!-- Single item: render as direct link, no toggle -->
    <ng-container *ngIf="group.items.length === 1">
      <a class="sidenav-nav-link"
         style="cursor: pointer; text-align: center; padding: 14px 0; display:flex; justify-content:center;"
         [routerLink]="firstTimeLogin === 'false' ? [group.items[0].tabRouteName] : null"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: false}"
         (click)="onTabClick($event, group)"
         [title]="group.items[0].tabName">
        <i class="sidenav-link-icon" [ngClass]="group.groupIcon" style="font-size: 18px; color: white;"></i>
      </a>
    </ng-container>

    <!-- Multiple items: expandable group -->
    <ng-container *ngIf="group.items.length > 1">
      <div class="nav-group-header-collapsed" (click)="toggleGroup(group)" [title]="group.groupLabel"
           style="cursor: pointer; text-align: center; padding: 14px 0;">
        <i class="sidenav-link-icon" [ngClass]="group.groupIcon"
           [style.color]="group.isExpanded ? '#3b82f6' : 'white'" style="font-size: 18px;"></i>
      </div>

      <ul class="nav-group-items-mini" *ngIf="group.isExpanded"
          style="list-style: none; padding: 0; background: rgba(0,0,0,0.2); border-left: 3px solid #3b82f6;">
        <li class="sidenav-nav-item" *ngFor="let data of group.items" [title]="data.tabName"
            style="text-align: center; padding: 8px 0;">
          <a class="sidenav-nav-link"
             [routerLink]="firstTimeLogin === 'false' ? [data.tabRouteName] : null"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{exact: false}"
             (click)="onTabClick($event, group)"
             [ngClass]="{'disabled-link': firstTimeLogin === 'false'}">
            <i class="sidenav-link-icon" [class]="data.tabIcon" style="font-size: 14px; opacity: 0.8;"></i>
          </a>
        </li>
      </ul>
    </ng-container>

  </ng-container>

  <!-- EXPANDED (wide) sidebar -->
  <ng-container *ngIf="collapsed">
   <ng-container *ngIf="group.items.length === 1">

  <div class="nav-group-header single-group-label">

    <span class="nav-group-label">
      {{ group.groupLabel }}
    </span>

  </div>

  <!-- ITEM -->
  <ul class="nav-group-items">

    <li class="sidenav-nav-item"
        [title]="group.items[0].tabName">

      <a class="sidenav-nav-link"
         [routerLink]="firstTimeLogin === 'false' ? [group.items[0].tabRouteName] : null"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: false }"
         (click)="onTabClick($event, group)"
         [ngClass]="{'disabled-link': firstTimeLogin === 'false'}">

        <i class="sidenav-link-icon"
           [ngClass]="group.items[0].tabIcon">
        </i>

        <span class="sidenav-link-text">
          {{ group.items[0].tabName }}
        </span>

      </a>

    </li>

  </ul>

</ng-container>

    <!-- Multiple items: expandable group with chevron -->
    <ng-container *ngIf="group.items.length > 1">
      <div class="nav-group-header" (click)="toggleGroup(group)"
           style="display: flex; align-items: center; cursor: pointer; padding: 12px 16px;">
        <span class="nav-group-label" style="flex-grow: 1;">{{ group.groupLabel }}</span>
        <i class="nav-group-chevron fa"
           [ngClass]="group.isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'"></i>
      </div>

      <ul class="nav-group-items" [ngClass]="{'nav-group-items--collapsed': !group.isExpanded}">
        <li class="sidenav-nav-item" *ngFor="let data of group.items" [title]="data.tabName">
          <a class="sidenav-nav-link"
             [routerLink]="firstTimeLogin === 'false' ? [data.tabRouteName] : null"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{exact: false}"
             (click)="onTabClick($event, group)"
             [ngClass]="{'disabled-link': firstTimeLogin === 'false'}">
            <i class="sidenav-link-icon" [class]="data.tabIcon"></i>
            <span class="sidenav-link-text">{{ data.tabName }}</span>
          </a>
        </li>
      </ul>
    </ng-container>

  </ng-container>

</li>
    </ul>
</div>
