e.bank_name, e.blood_group, e.city, e.country, e.created_by, e.created_on, e.date_of_birth, \
 e.date_of_joining, e.email, e.emergency_contact_mobile, e.emergency_contact_person, \
 e.employmentstatus, e.esic_number, e.father_name, e.gender, e.graduation_type, e.pursuing, \
 e.job_role_id, e.landline, e.manager_id, e.marital_status, e.mobile_no, e.mother_tongue, e.name, \
 e.notice_period, e.alternate_mobile_no,  e.pan_number, e.passport_number, \
 e.permanent_address, e.pf_account_number, e.pincode, e.place_of_birth, e.passing_grade, \
 e.previous_pf_account_number, e.relation, e.state, e.uan, \
 e.views_on_organisation, e.year_of_passing, \
  jr.dept_id, jr.name as jobrolename, \
 d.name as departmentname, e.work_location, e.probation_period, e.emp_id, e2.name as manager, e.experience, \
e.billable,e.child1,e.child2,e.child3,e.mothers_name,e.spouse,e.total_experience,e.date_of_resign , e.invalid_access_attempt, e.date_of_relieving, jr.name as JobRolename, e3.name as updatedByName, e4.name as createdByName, e.updated_on, e.is_timesheet_lock_check_enable, e.employment_release_status , e.pip_flag,p.pip_id,e.billable_type, \
emp_proj_client.project_name, emp_proj_client.client_name,emp_proj_client.team_name, des.designation_name, e.is_consultant, e.is_apprenticeship,e.reporting_manager_id, e5.name AS reportingManger, jr.employee_role, e.refered_type, e.refered_name, e.employee_confirmation_date, d.hod_id, e7.name AS hodName, d.name AS hodDepartmentName,emp_proj_client.project_id , e.updated_by,e.is_apmosys_product  \
FROM employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
LEFT JOIN employee e3 on e.updated_by = e3.emp_id \
LEFT JOIN employee e4 on e.created_by = e4.emp_id \
LEFT JOIN pip p ON p.pip_id=e.pip_id \
LEFT JOIN (SELECT etm.emp_id,GROUP_CONCAT(DISTINCT pr.project_id ORDER BY pr.project_id SEPARATOR ',') AS project_id,GROUP_CONCAT(DISTINCT pr.project_name ORDER BY pr.project_id SEPARATOR ',') AS project_name, GROUP_CONCAT(DISTINCT cl.client_name) AS client_name, \
GROUP_CONCAT(DISTINCT t.team_name) AS team_name \
FROM employee_team_mapping etm \
LEFT JOIN teams t ON t.team_id = etm.team_id \
LEFT JOIN projects pr ON pr.project_id = t.project_id \
LEFT JOIN clients cl ON cl.client_id = pr.client_id \
WHERE etm.active != 0 AND t.is_active != 'N' \
AND pr.active != 'false' \
GROUP BY etm.emp_id) emp_proj_client ON emp_proj_client.emp_id = e.emp_id \
INNER JOIN employee e2 ON e.manager_id = e2.emp_id \
INNER JOIN employee e7 ON d.hod_id = e7.emp_id \
LEFT JOIN employee e5 ON e.reporting_manager_id = e5.emp_id \
LEFT JOIN designation des ON des.designation_id = e.designation_id where e.emp_id=:empId \
order by e.name
EmployeeTeamMap.findEmployeeByTeamId = SELECT emp.name,emp.emp_id,emp.employeement_id,emp.email,t.team_name,t.team_lead_name, \
t.team_lead_id,emp.is_consultant,emp.is_apprenticeship,emp.is_apmosys_product \
FROM employee_team_mapping etm \
INNER JOIN teams t ON t.team_id = etm.team_id \
INNER JOIN employee as emp on etm.emp_id=emp.emp_id \
WHERE t.team_id = :team_id  \
and emp.employmentstatus NOT IN("InActive")


