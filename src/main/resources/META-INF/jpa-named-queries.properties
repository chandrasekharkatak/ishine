Project.getPreviousDefaultProjectDetails = SELECT eppm.emp_id, eppm.primary_project_name, MAX(etm.start_date) AS start_date, c.client_name, e.billable_type \
FROM emp_primary_project_mapping eppm \
LEFT JOIN projects p ON p.project_id = eppm.primary_project_id \
LEFT JOIN teams t ON t.project_id = p.project_id AND t.is_active != 'N' \
LEFT JOIN ( \
    SELECT * FROM employee_team_mapping etm1 \
    WHERE etm1.start_date IS NOT NULL AND etm1.active != 0 AND etm1.start_date = (SELECT MAX(etm2.start_date)FROM employee_team_mapping etm2 WHERE etm2.emp_id = etm1.emp_id AND etm2.active != 0 AND etm2.start_date IS NOT NULL \
      ) \
) etm ON etm.emp_id = eppm.emp_id \
LEFT JOIN clients c ON c.client_id = p.client_id LEFT JOIN employee e ON e.emp_id = eppm.emp_id WHERE eppm.is_mapped = 'Y' AND eppm.emp_id = :empId \
GROUP BY etm.emp_id, eppm.primary_project_name, c.client_name, e.billable_type

