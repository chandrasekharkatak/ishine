Employee.getAllTeamView = SELECT e.emp_id, e.name, e.email, jr.name as jobrolename, e.mobile_no, em.name as manager, e.employeement_id, e.invalid_access_attempt from employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN employee em ON e.manager_id = em.emp_id \
WHERE e.employmentstatus not like 'InActive' AND e.manager_id IN (WITH recursive my_reportees as \
	( 	SELECT emp_id from employee where emp_id = :empId \
        UNION \
        SELECT e.emp_id from my_reportees mr INNER JOIN employee e ON e.manager_id = mr.emp_id \
    ) \
SELECT emp_id from my_reportees)

