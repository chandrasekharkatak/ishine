EmployeeLeave.getAllTeamCompOffHistoryView = SELECT e.name, el.from_date, el.to_date, el.created_on, el.no_of_days, s.status, cm.comp_off_reasons, el.leave_code, \
emp1.name statusUpdatedBy \
FROM comp_off_leave el \
INNER JOIN employee e ON e.emp_id = el.emp_id \
INNER JOIN leave_status s ON s.leave_status_id = el.leave_status_id \
INNER JOIN comp_off_master cm ON cm.comp_off_id = el.leave_status_id \
LEFT JOIN employee emp1 ON emp1.emp_id = el.leave_status_updated_by \
WHERE e.employmentstatus not like 'InActive' AND s.leave_status_id != 1 AND (el.from_date >= :fromDate and el.to_date <= :toDate) AND el.manager_id IN \
(WITH recursive my_reportees as \
	( 	SELECT emp_id from employee where emp_id = :managerId \
        UNION \
        SELECT e.emp_id from my_reportees mr INNER JOIN employee e ON e.manager_id = mr.emp_id \
    ) \
SELECT emp_id from my_reportees) \
ORDER BY created_on DESC

EmployeeLeave.getAppliedLeaveApplicationsByEmpIdAndDateRange = SELECT el.leave_id,ltm.leave_type,el.from_date,el.to_date,el.no_of_days, \
ls.status,emp.name,el.created_on,el.reason \
FROM employee_leave el \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
INNER JOIN leave_status ls ON ls.leave_status_id = el.leave_status_id \
INNER JOIN employee emp ON emp.emp_id = el.created_by \
WHERE el.emp_id = :empId AND (el.leave_status_id = 1 OR el.leave_status_id = 2) AND el.created_on BETWEEN :fromDate AND :toDate AND el.leave_type_master_id = :leaveTypeMasterId \
Order by el.created_on desc 

EmployeeLeave.countMyPendingLeaveApplicationsByLeaveType = SELECT count(*),ltm.leave_type,ltm.leave_type_code FROM employee_leave el \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
where el.leave_status_id = 1 AND emp_id = :empId \
group by el.leave_type_master_id

EmployeeLeave.countMyApprovedLeaveApplicationsByLeaveType = SELECT count(*),ltm.leave_type,ltm.leave_type_code FROM employee_leave el \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
where el.leave_status_id = 2 AND el.emp_id = :empId \
group by el.leave_type_master_id

