Employee.getEmployeeByEmpId= SELECT e.emp_id, e.aadhar , e.about_me,e.address,e.bank_account_no,e.bankifsccode,e.bank_name, \
e.blood_group,e.city,e.country,e.date_of_birth,e.date_of_joining,e.email,e.emergency_contact_mobile, \
e.employmentstatus,e.esic_number,e.father_name,e.gender,e.graduation_type,e.pursuing,e.landline,e.marital_status \
,e.mobile_no,e.mother_tongue,e.name,e.notice_period,e.alternate_mobile_no,e.pan_number,e.passport_number, \
e.permanent_address,e.pf_account_number,e.pincode,e.place_of_birth,e.passing_grade, \
e.previous_pf_account_number,e.relation,e.state,e.uan,e.views_on_organisation,e.year_of_passing, \
e.pincode as p,e.emergency_contact_person,e.profile_image_name, \
em.name as manager, j.name as jobrole , d.name as department , d.dept_id , j.job_role_id ,e.manager_id, e.work_location, \
e.experience, e.role, e.employeement_id, e.probation_period, e.date_of_resign, \
e.billable,e.child1,e.child2,e.child3,e.mothers_name,e.spouse,e.total_experience , e.secondary_email \
FROM employee e  \
INNER JOIN employee em ON e.manager_id = em.emp_id \
INNER JOIN job_role j ON j.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = j.dept_id \
WHERE e.emp_id = :empId

Employee.getAllEmployees =SELECT e.employeement_id, e.aadhar, e.about_me, e.address, e.bank_account_no, e.bankifsccode, \
e.bank_name, e.blood_group, e.city, e.country, e.created_by, e.created_on, e.date_of_birth, \
 e.date_of_joining, e.email, e.emergency_contact_mobile, e.emergency_contact_person, \
 e.employmentstatus, e.esic_number, e.father_name, e.gender, e.graduation_type, e.pursuing, \
 e.job_role_id, e.landline, e.manager_id, e.marital_status, e.mobile_no, e.mother_tongue, e.name, \
 e.notice_period, e.alternate_mobile_no,  e.pan_number, e.passport_number, \
 e.permanent_address, e.pf_account_number, e.pincode, e.place_of_birth, e.passing_grade, \
 e.previous_pf_account_number, e.relation, e.state, e.uan, \
 e.views_on_organisation, e.year_of_passing, \
  jr.dept_id, jr.name as jobrolename, \
 d.name as departmentname, e.work_location, e.probation_period, e.emp_id, e2.name as manager, e.experience, \
e.billable,e.child1,e.child2,e.child3,e.mothers_name,e.spouse,e.total_experience,e.date_of_resign , e.invalid_access_attempt, e.date_of_relieving \
FROM employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
INNER JOIN employee e2 ON e.manager_id = e2.emp_id order by e.name

