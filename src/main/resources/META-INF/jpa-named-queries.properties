Department.getAllDepartments = SELECT dept.dept_id,dept.created_by,dept.created_on \
,dept.name as department_name,emp1.name as createdBy,emp2.name,dept.hod_id, dept.updated_on, u.name as updated_by , dept.dept_abbreviation FROM department dept \
INNER JOIN employee emp1 ON dept.created_by = emp1.emp_id \
left join employee u on dept.updated_by = u.emp_id \
INNER JOIN employee emp2 ON dept.hod_id = emp2.emp_id

Department.getMappedDepartment = SELECT d.name from department d \
INNER JOIN project_department_map pdm on d.dept_id = pdm.dept_id \
WHERE pdm.project_id =:projectId

Department.getDepartmentInfo = SELECT d.dept_id, d.name, e.employeement_id, d.dept_abbreviation from department d \
INNER JOIN employee e ON e.emp_id = d.hod_id

Department.getSegregatedDeptEodDefaulter = SELECT d.name as 'Department', COUNT(et.timesheet_id) as 'ActualEODCount', sub.ResourceCount \
FROM department d \
INNER JOIN job_role jr ON jr.dept_id = d.dept_id \
INNER JOIN employee e ON jr.job_role_id = e.job_role_id \
INNER JOIN employee_timesheets et ON et.emp_id = e.emp_id \
INNER JOIN (SELECT d.name, COUNT(e.emp_id) as ResourceCount FROM department d \
INNER JOIN job_role jr ON jr.dept_id = d.dept_id \
INNER JOIN employee e ON jr.job_role_id = e.job_role_id \
GROUP BY d.name) sub ON sub.name = d.name \
WHERE et.date >=:firstOfMonth and et.date <=:currentDate \
GROUP BY d.name \
ORDER BY d.name

