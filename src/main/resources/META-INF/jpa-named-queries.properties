 wltm.code, \
 elm.location_in_time, \
 elm.location_out_time,\
pts.project_id, \
p.project_name,\
pts.po_no,\
pts.po_id,\
pts.status as project_approval_status,\
pts.client_approval_status as client_approval_status,\
pts.total_client_working_minutes, \
pts.shadow_emp_id,\
pts.location_mapping_id as pts_location_mapping_id,\
cl.client_location,\
c.client_name,\
etam.activity_id,\
a.activity,\
etam.duration_minutes,\
etam.description AS activity_description,\
pts.client_location_id,pts.client_side_id, \
CASE WHEN pts.client_side_id IS NOT NULL THEN 1 ELSE 0 END,trd.remarks, \
c.client_id, \
et.created_by, dtm.day_type_id \
FROM employee_timesheets_new et \
JOIN day_type_master_new dtm \
ON dtm.day_type_id = et.day_type_id \
LEFT JOIN employee_timesheet_location_mapping elm \
ON elm.timesheet_id = et.timesheet_id \
LEFT JOIN work_location_type_master wltm \
ON wltm.work_location_type_id = elm.location_type_id \
LEFT JOIN project_timesheet_status_new pts \
ON pts.timesheet_id = et.timesheet_id \
AND pts.location_mapping_id = elm.location_mapping_id \
LEFT JOIN projects p \
ON p.project_id = pts.project_id \
LEFT JOIN clients c \
ON c.client_id = p.client_id \
LEFT JOIN client_locations cl \
ON cl.client_location_id = pts.client_location_id \
LEFT JOIN employee_timesheet_activities_mapping_new etam \
ON etam.timesheet_id = et.timesheet_id \
AND etam.project_id = pts.project_id AND etam.location_mapping_id = elm.location_mapping_id \
LEFT JOIN activities a \
ON a.activity_id = etam.activity_id \
LEFT JOIN timesheet_rejection_details_new trd \
ON trd.timesheet_id = et.timesheet_id \
AND trd.project_id = pts.project_id \
AND trd.location_mapping_id = pts.location_mapping_id \
WHERE et.emp_id = :empId \
AND et.date BETWEEN :start AND :end \
ORDER BY et.date DESC, elm.location_mapping_id 
