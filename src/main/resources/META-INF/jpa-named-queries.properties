DraftEmployee.getAllDraftEmployees = SELECT e.draft_emp_id,e.name ,e.email ,e.employmentstatus , e.date_of_joining, e.employeement_id ,e.update_application_status, e2.name as manager, d.name as departmentName \
FROM draft_employee e \
INNER JOIN employee e2 ON e.manager_id = e2.emp_id \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
where update_application_status = :status order by e.name



DraftEmployee.getDraftEmployeeByEmpId= SELECT e.draft_emp_id, e.aadhar , e.about_me,e.address,e.bank_account_no,e.bankifsccode,e.bank_name, \
e.blood_group,e.city,e.country,e.date_of_birth,e.date_of_joining,e.email,e.emergency_contact_mobile, \
e.employmentstatus,e.esic_number,e.father_name,e.gender,e.graduation_type,e.pursuing,e.landline,e.marital_status \
,e.mobile_no,e.mother_tongue,e.name,e.notice_period,e.alternate_mobile_no,e.pan_number,e.passport_number, \
e.permanent_address,e.pf_account_number,e.pincode,e.place_of_birth,e.passing_grade, \
e.previous_pf_account_number,e.relation,e.state,e.uan,e.views_on_organisation,e.year_of_passing, \
e.pincode as p,e.emergency_contact_person,e.emergency_contact_person a, \
em.name as manager, j.name as jobrole , d.name as department , d.dept_id , j.job_role_id ,e.manager_id, e.work_location, e.experience, e.role, e.employeement_id, \
e.billable,e.child1,e.child2,e.child3,e.mothers_name,e.spouse,e.total_experience, rm.name as reportingManager,e.probation_period,e.date_of_resign, e.date_of_relieving \
FROM draft_employee e  \
INNER JOIN employee em ON e.manager_id = em.emp_id \
INNER JOIN job_role j ON j.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = j.dept_id \
INNER JOIN employee eo ON eo.employeement_id = e.employeement_id \
LEFT JOIN employee rm ON e.reporting_manager_id = rm.emp_id \
WHERE e.draft_emp_id = :empId

DraftEmployee.getDraftEmployeeByEmployeementId= SELECT e.draft_emp_id, e.aadhar , e.about_me,e.address,e.bank_account_no,e.bankifsccode,e.bank_name, \
e.blood_group,e.city,e.country,e.date_of_birth,e.date_of_joining,e.email,e.emergency_contact_mobile, \
e.employmentstatus,e.esic_number,e.father_name,e.gender,e.graduation_type,e.pursuing,e.landline,e.marital_status \
,e.mobile_no,e.mother_tongue,e.name,e.notice_period,e.alternate_mobile_no,e.pan_number,e.passport_number, \
e.permanent_address,e.pf_account_number,e.pincode,e.place_of_birth,e.passing_grade, \
e.previous_pf_account_number,e.relation,e.state,e.uan,e.views_on_organisation,e.year_of_passing, \
e.pincode as p,e.emergency_contact_person,e.emergency_contact_person a, \
em.name as manager, j.name as jobrole , d.name as department , d.dept_id , j.job_role_id ,e.manager_id, e.work_location, e.experience, e.role, \
e.employeement_id, e.update_application_status, e.mothers_name , e.spouse , e.child1 , e.child2 , e.child3, rm.name as reportingManager, e.designation_id, de.designation_name, e.created_on,e.probation_period,e.total_experience, \
