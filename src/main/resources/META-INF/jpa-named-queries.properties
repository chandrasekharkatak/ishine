Timesheet.getMyReporteesTimesheetRequestsOLD = SELECT et.timesheet_id,et.date,et.day_type,e.name employeeName,et.description ,et.status, \
em.name created_by,em.emp_id as createdById,et.created_on,e.employeement_id,et.total_time , e.email,et.office_in_time, et.office_out_time, et.total_working_hours, et.is_night_shift, et.current_manager_id,e.is_consultant,e.is_apprenticeship,e.emp_id,\
et.client_in_time, et.client_out_time, et.client_side_id, et.total_client_working_hours, \
et.project_id, et.client_approval_status, et.has_client_side_id, et.is_shadow_timesheet , et.shadow_emp_id, e.is_apmosys_product  \
FROM employee_timesheets et \
INNER JOIN employee e ON e.emp_id = et.emp_id \
INNER JOIN employee em ON  et.created_by = em.emp_id \
WHERE  et.status = 'Pending' AND et.current_manager_id = :managerId    AND ((:clientFlag IS NULL) \
        OR (:clientFlag = TRUE  AND et.has_client_side_id = 1) \
        OR (:clientFlag = FALSE AND (et.has_client_side_id = 0 OR et.has_client_side_id IS NULL)) \
      ) Order by et.date desc

EmployeeTimesheetsNew.getMyReporteesTimesheetRequestsNotNeeded = SELECT et.timesheet_id,et.date,dtm.day_type,e.name employeeName, \
sm.status,em.name created_by,em.emp_id as createdById,et.created_on,e.employeement_id,ROUND(et.total_activities_minutes / 60, 2) AS total_time , e.email,et.office_in_time, et.office_out_time, TIME_FORMAT(SEC_TO_TIME(et.total_working_minutes * 60), '%H:%i') AS total_working_hours, pts.is_night_shift, e.manager_id AS current_manager_id,e.is_consultant,e.is_apprenticeship,e.emp_id, \
pts.client_in_time, pts.client_out_time, ecsm.client_side_id, CAST(pts.total_client_working_minutes AS DECIMAL(10,2))/60 AS total_client_working_hours, \
pts.project_id, csm.status AS client_approval_status, \
CASE WHEN ecsm.client_side_id IS NOT NULL THEN 1 ELSE 0 END AS has_client_side_id, \
CASE WHEN pts.shadow_emp_id IS NOT NULL THEN 1 ELSE 0 END AS is_shadow_timesheet, pts.shadow_emp_id, e.is_apmosys_product  \
FROM employee_timesheets_new et \
INNER JOIN employee e ON e.emp_id = et.emp_id \
INNER JOIN employee em ON  et.created_by = em.emp_id \
LEFT JOIN day_type_master_new dtm ON et.day_type_id = dtm.day_type_id \
LEFT JOIN status_master_new sm ON et.status = sm.status_id \
LEFT JOIN project_timesheet_status_new pts ON pts.timesheet_id = et.timesheet_id \
LEFT JOIN client_status_master_new csm ON pts.client_approval_status = csm.status_id \
LEFT JOIN employee_client_side_id_mapping_new ecsm ON ecsm.emp_id = et.emp_id AND ecsm.project_id = pts.project_id AND ecsm.active = 1 \
WHERE  sm.status = 'Pending' AND e.manager_id = :managerId    AND ((:clientFlag IS NULL) \
        OR (:clientFlag = TRUE  AND ecsm.client_side_id IS NOT NULL) \
        OR (:clientFlag = FALSE AND ecsm.client_side_id IS NULL)) \
      Order by et.date desc 
      
      
