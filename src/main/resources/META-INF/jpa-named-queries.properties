    db_emp_portal.employee_timesheet_activities_mapping AS map \
JOIN  \
    db_emp_portal.client_locations AS c ON map.client_location_id = c.client_id \
JOIN  \
    db_emp_portal.activities AS a ON map.activity_id = a.activity_id \
LEFT JOIN  \
    db_emp_portal.teams AS t ON a.team_id = t.team_id \
LEFT JOIN \
    db_emp_portal.projects AS p ON t.project_id = p.project_id \
LEFT JOIN \
    db_emp_portal.clients AS c1 ON p.client_id = c1.client_id \
LEFT JOIN  \
    db_emp_portal.employee_timesheets AS tim ON map.timesheet_id = tim.timesheet_id \
WHERE \
	tim.emp_id=:emp_id and \
    DATE_FORMAT(tim.created_on, '%Y-%m-%d') = :date
TimesheetActivityMap.activitiesByTimesheetIdforBiomax =SELECT dtm.day_type,et.emp_id,DATE_FORMAT(et.date, '%Y-%m-%d') as created_on,dtm.day_type,etam.timesheet_id,a.team_id,p.project_name,c1.client_name, \
    t.team_name, \
    cl.client_location, \
    CAST(etam.duration_minutes AS DECIMAL(10,2))/60 AS completion_time \
FROM \
    employee_timesheet_activities_mapping_new AS etam \
INNER JOIN \
    employee_timesheets_new AS et ON etam.timesheet_id = et.timesheet_id \
LEFT JOIN \
    day_type_master_new dtm ON et.day_type_id = dtm.day_type_id \
JOIN  \
    activities AS a ON etam.activity_id = a.activity_id \
LEFT JOIN  \
    teams AS t ON a.team_id = t.team_id \
LEFT JOIN \
    projects AS p ON t.project_id = p.project_id AND p.project_id = etam.project_id \
LEFT JOIN \
    clients AS c1 ON p.client_id = c1.client_id \
LEFT JOIN \
    client_locations AS cl ON cl.client_id = p.client_id \
WHERE \
	et.emp_id=:emp_id and \
    DATE_FORMAT(et.date, '%Y-%m-%d') = :date 


