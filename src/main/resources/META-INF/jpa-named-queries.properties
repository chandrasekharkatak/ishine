EmployeeLeave.getAllMyLeaveApplicationsByEmpId = SELECT el.leave_id,ltm.leave_type,el.from_date,el.to_date,el.no_of_days, ls.status,emp.name,el.created_on,el.reason, \
ltm.leave_type_master_id, el.remark, el.from_date_day_type, el.to_date_day_type, em.name as approverName, em.email as approverMail, el.manager_approval_status, \
el.level2approver_id, e2.name as level2ApproverName, e2.email as level2ApproverEmail, el.level2approval_status, \
el.level3approver_id, e3.name as level3ApproverName, el.level3approval_status, e3.email as level3ApproverEmail, \
el.current_approval_level, el.final_approval_level, el.maternity_type, el.maternity_leave_days \
FROM employee_leave el \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
INNER JOIN leave_status ls ON ls.leave_status_id = el.leave_status_id \
INNER JOIN employee emp ON emp.emp_id = el.created_by \
INNER JOIN employee em ON em.emp_id = el.manager_id \
LEFT JOIN employee e2 ON e2.emp_id = el.level2approver_id \
LEFT JOIN employee e3 ON e3.emp_id = el.level3approver_id \
WHERE el.emp_id = :empId ORDER BY el.created_on DESC

EmployeeLeave.getAllMyTeamApplicationsByEmpId = SELECT el.leave_id,ltm.leave_type,el.from_date,el.to_date,el.no_of_days,ls.status,emp.name,el.created_on,el.reason, \
ltm.leave_type_master_id, el.emp_id, el.remark, em.name as approverName, em.email as approverMail, el.manager_approval_status, \
el.level2approver_id, e2.name as level2ApproverName, e2.email as level2ApproverEmail, el.level2approval_status, \
el.level3approver_id, e3.name as level3ApproverName, el.level3approval_status, e3.email as level3ApproverEmail, \
el.current_approval_level, el.final_approval_level \
FROM employee_leave el \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
INNER JOIN leave_status ls ON ls.leave_status_id = el.leave_status_id \
INNER JOIN employee emp ON emp.emp_id = el.emp_id \
INNER JOIN employee em ON em.emp_id = el.manager_id \
LEFT JOIN employee e2 ON e2.emp_id = el.level2approver_id \
