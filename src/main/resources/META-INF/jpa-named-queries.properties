Employee.getEmployeeByManager = SELECT e.employeement_id, e.name as EmpName, e.email,d.name as departmentName FROM employee e \
LEFT JOIN draft_employee de ON de.employeement_id = e.employeement_id \
inner join job_role jr ON jr.job_role_id = e.job_role_id \
inner join department d ON d.dept_id = jr.dept_id \
where e.manager_id =:managerId AND e.gender IS NULL AND e.employmentstatus != 'InActive'


Employee.getEmployeeDetailForDSRCron = SELECT e.emp_id, e.work_location, e.name, e.employeement_Id, e.is_timesheet_lock_check_enable, e.timesheet_lock_updated_on, d.name as DepartmentName from employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
WHERE e.employmentstatus not like 'InActive' OR (e.employmentstatus = 'InActive' AND e.date_of_relieving between :startDate and :endDate)


Employee.findHodByEmpId = SELECT e.emp_id, d.hod_id, d.dept_id from employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
INNER JOIN employee em ON e.manager_id = em.emp_id \
where e.emp_id= :empId


Employee.findManagerListByRole = select e.emp_id as managerId,e.name as managerName from employee e \
inner join job_role jr on jr.job_role_id = e.job_role_id \
where jr.employee_role IN ('Manager','SuperAdmin','HOD','HR Manager') AND e.employmentstatus IN ('Probation','Confirmed')




