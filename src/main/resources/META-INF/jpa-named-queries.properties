##############################################   JobRoleRepository ################################################

JobRole.getAllJobRoles = SELECT j.name as jobrolename ,j.employee_role, \
e.name as createdby,j.created_on,d.dept_id,d.name as department,j.job_role_id,u.name updatedBy,j.updated_on FROM job_role j \
INNER JOIN employee e ON j.created_by = e.emp_id \
LEFT JOIN employee u ON j.updated_by = u.emp_id \
INNER JOIN department d ON d.dept_id = j.dept_id \
order by j.created_on

JobRole.getHoDByJobRoleId = SELECT e.name ,e.email,d.name as deptname , jr.name as jobrole FROM job_role jr \
INNER JOIN department d ON d.dept_id = jr.dept_id \
INNER JOIN employee e ON d.hod_id = e.emp_id WHERE jr.job_role_id = :jobRoleId

##############################################   RoleFeatureMapRepository ################################################

RoleFeatureMap.getTabsByRoleId = select sub.sub_feature_master_id,sub.sub_feature_name, \
feature.feature_id,feature.feature_name, \
tab.tab_name,tab.tab_icon,tab.tab_route_name from role_subfeature_mapping map \
INNER JOIN sub_feature_master sub ON map.sub_feature_master_id = sub.sub_feature_master_id \
INNER JOIN feature_master feature ON feature.feature_id = sub.feature_id \
INNER JOIN tab_master tab ON tab.tab_id = feature.tab_id \
WHERE map.job_role_id = :roleId order by tab.tab_sequence

RoleFeatureMap.getRolesToBeMappedWithNewSubFeature = SELECT rsm.job_role_id,jr.employee_role FROM role_subfeature_mapping rsm \
INNER JOIN job_role jr ON jr.job_role_id = rsm.job_role_id where jr.employee_role IN :employeeRolelist \
group by rsm.job_role_id

