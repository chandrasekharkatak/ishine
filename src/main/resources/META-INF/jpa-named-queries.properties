Employee.getAllTeamView = SELECT e.emp_id, e.name, e.email, jr.name as jobrolename, e.mobile_no, em.name as manager, e.employeement_id, \
e.invalid_access_attempt, e.is_timesheet_lock_check_enable, e.employmentstatus, e.date_of_relieving, e.pip_flag,p.pip_id from employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
LEFT JOIN pip p ON p.pip_id=e.pip_id \
INNER JOIN employee em ON em.emp_id = :empId \
WHERE e.employmentstatus not like 'InActive' AND ((e.manager_id = :empId AND (e.approvals_to = 'Manager' OR e.approvals_to IS NULL)) OR (e.reporting_manager_id = :empId AND e.approvals_to = 'Reporting Manager'))

