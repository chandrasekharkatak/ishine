LEFT JOIN teams t2 ON t2.team_id = a.team_id \
LEFT JOIN projects p2 ON p2.project_id = t2.project_id AND p2.project_id = etam.project_id \
INNER JOIN ( \
    SELECT emp_id, MAX(date) AS max_date \
