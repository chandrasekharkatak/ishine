Timesheet.getInactiveActivitiesByTimesheetIdOLD = SELECT map.timesheet_activity_map_id \
FROM employee_timesheet_activities_mapping map \
INNER JOIN activities ac ON ac.activity_id = map.activity_id \
INNER JOIN teams t ON t.team_id = ac.team_id \
INNER JOIN projects p ON p.project_id = t.project_id \
INNER JOIN employee_timesheets et ON et.timesheet_id = map.timesheet_id \
INNER JOIN employee_team_mapping etm ON etm.emp_id = et.emp_id AND etm.team_id = t.team_id \
WHERE map.timesheet_id = :timesheetId AND (p.active = "false" OR etm.active = 0 OR t.is_active = 'N')

EmployeeTimesheetsNew.getInactiveActivitiesByTimesheetId = SELECT CONCAT(etam.timesheet_id, '_', etam.activity_id, '_', etam.project_id) AS activity_map_id \
FROM employee_timesheet_activities_mapping_new etam \
INNER JOIN activities ac ON ac.activity_id = etam.activity_id \
INNER JOIN teams t ON t.team_id = ac.team_id \
INNER JOIN projects p ON p.project_id = t.project_id \
INNER JOIN employee_timesheets_new et ON et.timesheet_id = etam.timesheet_id \
INNER JOIN employee_team_mapping etm ON etm.emp_id = et.emp_id AND etm.team_id = t.team_id \
WHERE etam.timesheet_id = :timesheetId AND (p.active = "false" OR etm.active = 0 OR t.is_active = 'N')


Timesheet.getMyTeamsFilledEodCountByManagerIdOLD = SELECT e.emp_id,count(*) filled_eod FROM employee_timesheets et \
INNER JOIN employee e ON e.emp_id = et.emp_id \
WHERE date >= :start and date <= :end and e.employmentstatus != 'InActive' \
AND ((e.manager_id = :managerId AND (e.approvals_to = 'Manager' OR e.approvals_to IS NULL)) OR (e.reporting_manager_id = :managerId AND e.approvals_to = 'Reporting Manager')) \
group by e.emp_id

EmployeeTimesheetsNew.getMyTeamsFilledEodCountByManagerId = SELECT e.emp_id,count(*) filled_eod FROM employee_timesheets_new et \
INNER JOIN employee e ON e.emp_id = et.emp_id \
WHERE et.date >= :start and et.date <= :end and e.employmentstatus != 'InActive' \
AND ((e.manager_id = :managerId AND (e.approvals_to = 'Manager' OR e.approvals_to IS NULL)) OR (e.reporting_manager_id = :managerId AND e.approvals_to = 'Reporting Manager')) \
group by e.emp_id

Timesheet.getTimesheetFilledByMemberOLD = SELECT et.emp_id,et.created_by FROM employee_timesheets et where et.emp_id =:empId AND et.date >=:date AND et.created_by !=:empId

EmployeeTimesheetsNew.getTimesheetFilledByMember = SELECT et.emp_id,et.created_by FROM employee_timesheets_new et where et.emp_id =:empId AND et.date >=:date AND et.created_by !=:empId

