INNER JOIN department d ON d.dept_id = pdm.dept_id \
WHERE t.created_by =:empId OR p.project_manager_id =:empId OR t.team_lead_id =:empId

Project.getAllInternalProject = SELECT p.project_name,p.project_manager_id, e.name 'ProjectManager', p.project_id, p.po_project_id, p.created_on, \
p.updated_on, p.client_id, p.state, p.is_draft_project, e.employeement_id, p.active , \
(case when exists (select 1 from employee_team_mapping etm where etm.team_id in \
(select team_id from teams where project_id=p.project_id) and etm.active=2) then 2 else 1 end), e.emp_id , p.project_status \
