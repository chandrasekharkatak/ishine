########################################################SurveyRepository#########################################################################

Survey.getAllSurveys = SELECT s.survey_id,s.survey_name,s.description,s.is_active ,e1.name createdby ,s.created_on , e2.name updatedby , \
s.updated_on FROM surveys s \
INNER JOIN employee e1 ON s.created_by = e1.emp_id \
LEFT JOIN employee e2 ON s.updated_by = e2.emp_id

########################################################SurveyQuestionRepository#########################################################################

SurveyQuestion.getAnsweredSurveysByEmpId = SELECT survey_id FROM survey_employee_response r \
INNER JOIN survey_questions q ON r.survey_question_id = q.survey_question_id \
WHERE r.emp_id = :empId \
GROUP BY q.survey_id

########################################################SurveyEmployeeResponseRepository##################################################################

SurveyEmployeeResponse.getSurveyResponseByEmpIdAndSurveyId = SELECT q.question ,q.options, r.response FROM survey_employee_response r \
INNER JOIN survey_questions q ON r.survey_question_id = q.survey_question_id \
INNER JOIN employee e ON e.emp_id = r.emp_id \
WHERE r.emp_id = :empId and q.survey_id = :surveyId

SurveyEmployeeResponse.getSurveyAllResponsesBySurveyId = SELECT e.employeement_id , e.name , r.created_on , q.survey_question_id, q.question ,q.options, r.response \
FROM survey_employee_response r \
INNER JOIN survey_questions q ON r.survey_question_id = q.survey_question_id \
INNER JOIN employee e ON e.emp_id = r.emp_id \
WHERE q.survey_id = :surveyId order by e.name

#########################################################PolicyReadResponseRepository#####################################################################	
PolicyReadResponse.getPolicyAllResponsesByPolicyId = SELECT e.name, e.emp_id, p.read_on, h.policy_name, h.policyid from employee e \
inner join policy_read_employee_response p on e.emp_id = p.emp_id \
inner join hrpolicies h on h.policyid = p.policyid \
where p.policyid = :policyID order by e.name

PolicyReadResponse.getReadPoliciesByEmpId = SELECT p.policyid from policy_read_employee_response p  where p.emp_id = :empId

##########################################EnableAppreciationRepository#########################	
AppreciationEvent.getAppreciationEventInfo = SELECT ap.appreciation_eventid,ap.created_on,ap.from_date,ap.to_date FROM appreciation_event ap WHERE ap.appreciation_eventid=(SELECT max(appreciation_eventid) FROM appreciation_event)
	
Appreciation.getAppreciationByCategories =  SELECT a.appriate_type,a.appreciation_by,e.name as appreciateBy ,a.appreciation_date,a.appreciation_to,e1.name as appreciationTo,a.manager_name,a.comment FROM appreciation a inner join \
employee e on a.appreciation_by=e.employeement_id inner join ishine.employee e1 on a.appreciation_to=e1.employeement_id inner join appreciation_event ap on a.appreciation_event_id=ap.appreciation_eventid \
where ap.appreciation_eventid= :appreciationEventId and a.appriate_type=:appreciateType	

Employee.checkMultipleAppreciation = select id,appriate_type,appreciation_by,appreciation_date,appreciation_to,manager_name,comment,appreciation_event_id from appreciation \
where appreciation_event_id= :appreciationEventId and appreciation_to= :appreciationTo and appreciation_by= :appreciationBy


#########################################################EmployeeOnBoardingRepository#####################################################################	

Asset.getAssetListByEmpId = SELECT a.asset_id, a.asset_name, eam.is_assigned, d.name as department, d.dept_id, eam.emp_id FROM asset a \
INNER JOIN employee_asset_map eam ON eam.asset_id = a.asset_id \
LEFT JOIN department d ON a.dept_id = d.dept_id \
WHERE a.asset_type IN ('both','onboard') AND eam.emp_id = :empId

#########################################################EmployeeOnBoardingMapRepository#####################################################################

EmployeeAssetMap.findAssetByAssetNameAndEmpId = SELECT eam.employee_asset_map_id, a.asset_name from employee_asset_map eam \
INNER JOIN asset a ON a.asset_id = eam.asset_id \
WHERE eam.emp_id =:empId AND a.asset_name =:category

EmployeeAssetMap.getExitAssetDetailsByEmployeementId = SELECT eam.asset_id, a.asset_name,a.dept_id,d.name as department,e.name, e.employeement_id, eam.emp_id, eam.is_assigned, eam.dept_consent FROM employee_asset_map eam \
LEFT JOIN asset a ON eam.asset_id = a.asset_id \
LEFT JOIN department d ON a.dept_id = d.dept_id \
INNER JOIN employee e ON eam.emp_id = e.emp_id \
WHERE e.employeement_id = :employeementId

#########################################################EmployeeRoleMasterRepository#####################################################################

EmployeeRole.getAccessControlList = SELECT distinctrow dept.name as Department, jr.name as JobRole,erm.employee_role as EmployeeRole, \
tm.tab_name as Tab, fm.feature_name as Feature, sfm.sub_feature_name as SubName \
FROM role_subfeature_mapping rsm \
INNER JOIN job_role jr on rsm.job_role_id = jr.job_role_id \
INNER JOIN employee_role_master erm on rsm.job_role_id = jr.job_role_id \
INNER JOIN sub_feature_master sfm on sfm.sub_feature_master_id = erm.sub_feature_master_id \
INNER JOIN feature_master fm on fm.feature_id = sfm.feature_id \
INNER JOIN tab_master tm on tm.tab_id = fm.tab_id \
INNER JOIN department dept on dept.dept_id = jr.dept_id \
WHERE jr.name =:jobRoleName and erm.employee_role =:employeeRole and dept.dept_id =:departmentId \
ORDER BY dept.name,jr.name,erm.employee_role,fm.feature_name
