Project.poProjectTimesheetSyncOLD = SELECT p.po_project_id, p.project_name, p.po_no, t.team_id, t.team_name, e.emp_id, e.employeement_id, \
e.name, etm.active, etm.start_date, etm.end_date,p2.po_project_id as lastTimesheetFilledPoProjectId, \
p2.project_name as lastTimesheetFilledProjectName \
FROM projects p \
INNER JOIN teams t ON p.project_id = t.project_id \
INNER JOIN employee_team_mapping etm ON etm.team_id = t.team_id \
LEFT JOIN employee e ON e.emp_id = etm.emp_id \
LEFT JOIN employee_timesheets et ON et.emp_id = etm.emp_id \
LEFT JOIN employee_timesheet_activities_mapping etam ON etam.timesheet_id = et.timesheet_id \
LEFT JOIN activities a ON a.activity_id = etam.activity_id \
LEFT JOIN teams t2 ON t2.team_id = a.team_id \
LEFT JOIN projects p2 ON p2.project_id = t2.project_id \
INNER JOIN ( \
    SELECT emp_id, MAX(date) AS max_date \
    FROM employee_timesheets \
    GROUP BY emp_id \
) et2 ON et.emp_id = et2.emp_id AND et.date = et2.max_date \
WHERE p.po_project_id in :poProjectIdList

Project.poProjectTimesheetSync = SELECT p.po_project_id, p.project_name, p.po_no, t.team_id, t.team_name, e.emp_id, e.employeement_id, \
e.name, etm.active, etm.start_date, etm.end_date,p2.po_project_id as lastTimesheetFilledPoProjectId, \
p2.project_name as lastTimesheetFilledProjectName \
FROM projects p \
INNER JOIN teams t ON p.project_id = t.project_id \
INNER JOIN employee_team_mapping etm ON etm.team_id = t.team_id \
LEFT JOIN employee e ON e.emp_id = etm.emp_id \
