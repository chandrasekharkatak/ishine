Appreciation.getAllAppreciation = SELECT e.employeement_id,e.name, d.name as department , a.* \
FROM employee e  \
INNER JOIN employee em ON e.manager_id = em.emp_id \
INNER JOIN job_role j ON j.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = j.dept_id \
INNER JOIN appreciation a ON a.appreciation_by = e.employeement_id \
LEFT JOIN employee rm ON e.reporting_manager_id = rm.emp_id \
LEFT JOIN designation de ON de.designation_id = e.designation_id





Appreciation.getAppreciationByCategories = SELECT a.appriate_type,a.appreciation_by,e.name as appreciateBy ,a.appreciation_date,a.appreciation_to,e1.name as \
appreciationTo,a.manager_name,a.comment FROM appreciation a \
inner join employee e on a.appreciation_by=e.employeement_id \
inner join employee e1 on a.appreciation_to=e1.employeement_id \
inner join appreciation_event ap on a.appreciation_event_id=ap.appreciation_eventid \
where ap.appreciation_eventid= :appreciationEventId and a.appriate_type= :appreciateType

Employee.checkMultipleAppreciation = select id,appriate_type,appreciation_by,appreciation_date,appreciation_to,manager_name,comment,appreciation_event_id from appreciation \
