Employee.findEmployeeWorkingHistory = SELECT  e.emp_id,e.name as emp_name,t.team_id , t.team_name , t.team_lead_id ,\
 p.project_id ,p.project_name , etm.start_date ,etm.updated_on as end_Date , et.name as team_lead_name, e.date_of_joining , j.name as designation , cl.client_location , c.client_name , e.date_of_resign  \
 FROM employee e \
 INNER JOIN employee_team_mapping etm on e.emp_id=etm.emp_id \
 INNER JOIN teams t on etm.team_id=t.team_id \
 left JOIN  employee et on et.emp_id = t.team_lead_id \
 INNER JOIN projects p on t.project_id=p.project_id \
 INNER JOIN clients c ON c.client_id = p.client_id \
 INNER JOIN client_locations cl ON cl.client_id = c.client_id \
 INNER JOIN job_role j on j.job_role_id = e.job_role_id \
 WHERE e.emp_id = :empId group by etm.employee_team_map_id
 
Employee.getEmployeeDetailForCron = SELECT e.emp_id, e.work_location, e.name, e.employeement_Id, e.is_timesheet_lock_check_enable, e.timesheet_lock_updated_on, d.name as DepartmentName from employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
WHERE e.employmentstatus not like 'InActive'

Employee.getAllActiveEmployees = SELECT e.* from employee e \
WHERE e.employmentstatus not like 'InActive'

Employee.getDepartmentByEmployeementId = SELECT e.name, d.name as department, e.employeement_id, d.dept_id, d.hod_id FROM employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
WHERE e.employeement_id =:employeementId\

Employee.getEmployeeByDateOfRelieving = SELECT e.emp_id, e.employeement_id, e.email as EmployeeMail, e2.email as ManagerMail, e2.name as Manager, e.name as Employee \
, e.date_of_resign, e.date_of_relieving, d.name as Department from employee e \
INNER JOIN employee e2 ON e2.emp_id = e.manager_id \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
WHERE e.date_of_relieving = current_date

Employee.getEmailForMailConsent =  SELECT d.dept_id, d.name, d.hod_id, e.name as Employee, e.email from department d \
INNER JOIN employee e ON e.emp_id = d.hod_id \
WHERE d.name in ('Admin', 'Accounts', 'IT', 'HR', 'Director')

Employee.getEmployeeProfileCompletion = SELECT e.views_on_organisation, e.gender, e.about_me, e.blood_group, \
e.father_name, e.mothers_name, e.place_of_birth, e.mother_tongue, e.marital_status, e.aadhar, e.pan_number , \
e.address, e.state, e.city, e.country, e.pincode, e.permanent_address, e.emergency_contact_person, e.relation, e.emergency_contact_mobile, \
e.graduation_type, e.pursuing, e.passing_grade, \
e.bank_name, e.bank_account_no, e.bankifsccode FROM employee e \
WHERE e.emp_id = :empId

Employee.getAllEmployeeInfoForPoPortal = SELECT e.employeement_id, e.name, d.dept_id, e.employmentstatus, e.email, e.mobile_no, e.job_role_id, d.hod_id, e.emp_id from employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id

Employee.getEmployeeByDepartmentId = SELECT e.employeement_id, e.name as Employee, d.name as Department, e.email, e2.name as 'Manager', e.emp_id, e.employmentstatus, e3.email as 'HODMail' from employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
INNER JOIN employee e2 ON e2.emp_id = e.manager_id \
INNER JOIN employee e3 ON e3.emp_id = d.hod_id \
WHERE d.dept_id =:deptId AND e.employmentstatus != 'InActive'

Employee.getElapsedEmpInProbationAndNotice = SELECT e.employeement_id, e.name, ee.email as HODMail, e.probation_period, e.notice_period, e.date_of_joining, e.date_of_resign, e.employmentstatus \
from employee e \
INNER JOIN job_role jr on e.job_role_id = jr.job_role_id \
INNER JOIN department d on jr.dept_id = d.dept_id \
INNER JOIN employee ee on d.hod_id = ee.emp_id \
WHERE (DATEDIFF(now(), e.date_of_joining) > e.probation_period AND e.employmentstatus = 'Probation') \
OR (DATEDIFF(now(), e.date_of_resign) > e.notice_period AND e.employmentstatus = 'Resigned')

Employee.getEmploymentStatusAndInvalidAccessAttemptByEmpId = SELECT e.emp_id, e.employmentstatus, e.invalid_access_attempt \
from employee e WHERE e.emp_id = :empId

Employee.getManagerByDepartment = SELECT distinct e.manager_id, e2.name as ManagerName, hod.email, e2.email as managerMail FROM employee e \
INNER JOIN employee e2 ON e.manager_id = e2.emp_id \
INNER JOIN job_role jr ON jr.job_role_id = e2.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
INNER JOIN employee hod ON hod.emp_id = d.hod_id \
WHERE d.dept_id =:deptId AND e.manager_id IS NOT null AND e2.employmentstatus != 'InActive'

