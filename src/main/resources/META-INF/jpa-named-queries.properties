Timesheet.getAllLeaveTimesheetsWithoutLeaveApplicationOLD = SELECT e1.employeement_id,e1.name as employee, et.date, et.day_type, et.description, et.status,  \
ltm.leave_type, el_manager.name as managerName, d.name as departmentName, et.created_on, et.updated_on, e2.name as statusUpdatedBy, e1.is_consultant, e1.is_apprenticeship, e1.manager_id, et.timesheet_status_updated_by ,et.emp_id ,e1.is_apmosys_product  \
FROM employee_timesheets et \
INNER JOIN employee e1 on et.emp_id = e1.emp_id \
LEFT JOIN employee e2 on et.timesheet_status_updated_by = e2.emp_id \
LEFT JOIN employee em on em.emp_id = e1.manager_id \
LEFT JOIN job_role jr on e1.job_role_id=jr.job_role_id \
LEFT JOIN department d on jr.dept_id = d.dept_id \
LEFT JOIN leave_type_master ltm ON ltm.leave_type_master_id = et.leave_type_master_id \
LEFT JOIN employee_leave el ON el.emp_id = e1.emp_id \
LEFT JOIN employee el_manager ON e1.manager_id = el_manager.emp_id \
WHERE et.day_type != "Week Off" AND et.leave_type_master_id IS NULL AND et.date >= :start AND et.date <= :end \
ORDER BY e1.employeement_id ASC, et.date ASC

EmployeeTimesheetsNew.getAllLeaveTimesheetsWithoutLeaveApplication = SELECT e1.employeement_id,e1.name as employee, et.date, dtm.day_type, etam.description, sm.status,  \
ltm.leave_type, el_manager.name as managerName, d.name as departmentName, et.created_on, et.updated_on, e2.name as statusUpdatedBy, e1.is_consultant, e1.is_apprenticeship, e1.manager_id, et.timesheet_status_updated_by ,et.emp_id ,e1.is_apmosys_product  \
