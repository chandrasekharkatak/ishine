INNER JOIN employee e ON e.emp_id = lra.emp_id \
WHERE el.emp_id IN(:empIds) AND el.leave_status_id=4 \
ORDER BY el.created_on DESC


EmployeeLeave.getAllTeamCompOffHistoryViewHirarchy = SELECT e.employeement_id, e.name, el.from_date, el.to_date, DATE_FORMAT(el.created_on, '%Y-%m-%d'), el.no_of_days, s.status, cm.comp_off_reasons, el.leave_code, \
