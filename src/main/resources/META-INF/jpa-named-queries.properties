INNER JOIN employee hod ON d.hod_id = hod.emp_id \
WHERE e.employmentstatus NOT LIKE 'InActive' AND DATEDIFF(CURDATE(), e.date_of_joining) < e.probation_period

Employee.getEmployeeInProbationExtended = SELECT e.* \
