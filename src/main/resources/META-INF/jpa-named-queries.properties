FROM employee_leaves_mapping map \
INNER JOIN leave_type_master lm ON map.leave_type_master_id = lm.leave_type_master_id \
INNER JOIN leave_policies_master lpm ON lpm.leave_type_master_id = lm.leave_type_master_id \
WHERE map.emp_id = :empId AND lpm.leave_application = "Yes" \
AND ((lpm.employment_status = :employmentStatus AND lm.gender = 'All') \
OR (lpm.employment_status = :employmentStatus AND lm.gender = :gender) \
AND lm.leave_type_code IN ('ML','ML','ML') \
AND (lm.leave_type_code != 'ML' OR lpm.maternity_type = 'miscarriage') \
AND (lm.leave_type_code = 'ML' OR lpm.maternity_type = 'adoption') \
AND (lm.leave_type_code = 'ML' OR lpm.maternity_type = 'fullMaternity'))

EmployeeLeavesMap.getAllLeaveBalancesByEmpId = SELECT le.leave_type, \
CASE when e.employmentstatus = 'Probation' then 0 else em.balance end as balance, \
le.leave_type_master_id,le.leave_type_code \
FROM employee_leaves_mapping em \
INNER JOIN leave_type_master le ON em.leave_type_master_id = le.leave_type_master_id \
INNER JOIN employee e on e.emp_id = em.emp_id \
where em.emp_id = :empId and em.leave_type_master_id = :leaveTypeMasterId \

EmployeeLeavesMap.getEmployeesInProbation = SELECT e.name as employeeName, e.emp_id, e.employeement_id, e.employmentstatus, e.date_of_joining, ltm.leave_type_master_id, ltm.leave_type, elm.employee_leaves_map_id, elm.balance FROM employee e \
INNER JOIN employee_leaves_mapping elm ON elm.emp_id = e.emp_id \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = elm.leave_type_master_id \
WHERE e.date_of_joining BETWEEN '2022-06-02' AND '2022-07-01' AND elm.leave_type_master_id = 1 AND e.employmentstatus != "InActive"

EmployeeLeavesMap.getInActiveEmployeeLeaveBalance = SELECT lm.leave_type,map.balance,map.pending_for_approval,lm.leave_type_master_id,lm.leave_type_code \
FROM employee_leaves_mapping map \
INNER JOIN leave_type_master lm ON map.leave_type_master_id = lm.leave_type_master_id \
WHERE map.emp_id = :empId


EmployeeLeavesMap.getEmpDetailsByLeaveTypeMasterId = select elm.employee_leaves_map_id,elm.balance,elm.emp_id,elm.leave_type_master_id,elm.pending_for_approval, e.probation_period,e.date_of_joining,e.employmentstatus \
from employee_leaves_mapping elm \
inner join employee e on e.emp_id = elm.emp_id \
where elm.leave_type_master_id = :leaveTypeMasterId

