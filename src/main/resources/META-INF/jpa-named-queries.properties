Timesheet.getMyReporteesTimesheetRequests = SELECT et.timesheet_id,et.date,et.day_type,e.name employeeName,et.description ,et.status, \
em.name created_by,et.created_on,e.employeement_id,et.total_time , e.email \
FROM employee_timesheets et \
INNER JOIN employee e ON e.emp_id = et.emp_id \
INNER JOIN employee em ON  et.created_by = em.emp_id \
WHERE  et.status = 'Pending' AND e.manager_id IN (WITH recursive my_reportees as \
	(Select emp_id from employee where emp_id = :managerId \
        UNION \
        Select e.emp_id from my_reportees mr INNER JOIN employee e ON e.manager_id = mr.emp_id \
    ) \
Select emp_id from my_reportees) Order by et.date desc

Timesheet.getMyReporteesApprovedTimesheets = SELECT et.timesheet_id,et.date,et.day_type,e.name employeeName,et.description ,et.status, \
em.name created_by,et.created_on,et.total_time, et.remarks, e.employeement_id \
FROM employee_timesheets et \
INNER JOIN employee e ON e.emp_id = et.emp_id \
INNER JOIN employee em ON  et.created_by = em.emp_id \
WHERE e.manager_id = :managerId AND et.date BETWEEN :start and :end AND et.status != 'Pending' \
Order by et.date desc

Timesheet.getLast7DaysTimesheetsByEmpId = SELECT timesheet_id,et.date FROM employee_timesheets et WHERE et.date >= :date AND et.emp_id = :empId

