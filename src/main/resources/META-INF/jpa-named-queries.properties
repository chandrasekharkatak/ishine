Employee.getAllTeamMemberView = SELECT DISTINCT \
    e.emp_id, e.name, e.email, jr.name AS jobrolename, e.mobile_no, e.employeement_id, e.employmentstatus, e.manager_id, em.name AS managerName, em.email AS managerEmail, \
    d.hod_id, eh.name AS hodName, eh.email AS hodEmail, d.dept_id, e.is_timesheet_lock_check_enable, e.reporting_manager_id, e.approvals_to, rm.name AS reportingManager, \
    rm.email AS reportingManagerEmail, e.date_of_joining, e.probation_period, e.is_consultant, e.is_apprenticeship, e.is_apmosys_product, \
    GROUP_CONCAT(DISTINCT ecsm.client_side_id ORDER BY ecsm.client_side_id SEPARATOR ', ') AS client_side_ids, \
    CASE \
        WHEN e.is_consultant = 'true' THEN CONCAT('CS-', e.employeement_id) \
	WHEN e.is_apmosys_product = 'true' THEN CONCAT('AP-', e.employeement_id) \
	ELSE CONCAT('A-', e.employeement_id) \
END \
FROM employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
INNER JOIN employee em ON e.manager_id = em.emp_id \
INNER JOIN employee eh ON d.hod_id = eh.emp_id \
LEFT JOIN employee rm ON e.reporting_manager_id = rm.emp_id \
LEFT JOIN employee_client_side_id_mapping ecsm ON ecsm.emp_id = e.emp_id AND ecsm.active = TRUE \
WHERE e.employmentstatus != 'InActive' \
    AND ( \
        jr.dept_id IN ( \
            SELECT jr1.dept_id \
            FROM employee e1 \
            INNER JOIN job_role jr1 ON jr1.job_role_id = e1.job_role_id \
            WHERE e1.emp_id = :emp_id \
            AND jr1.job_role_id IN (1, 13, 15, 53, 78, 93, 111, 115, 120, 143, 144, 145, 146, 152, 170, 177, 178, 183, 187) \
        ) \
        OR EXISTS ( \
            SELECT 1 \
            FROM employee_team_mapping etm \
            INNER JOIN teams t ON t.team_id = etm.team_id \
            INNER JOIN projects p ON p.project_id = t.project_id \
            WHERE etm.emp_id = e.emp_id \
            AND p.active = 'true' AND t.is_active = 'Y' AND etm.active = 1 \
            AND p.project_id IN ( \
                SELECT p1.project_id FROM projects p1 \
                INNER JOIN teams t1 ON t1.project_id = p1.project_id \
                INNER JOIN employee_team_mapping etm1 ON etm1.team_id = t1.team_id \
                WHERE etm1.emp_id = :emp_id \
                AND p1.active = 'true' AND t1.is_active = 'Y' AND etm1.active = 1 \
                UNION ALL \
                SELECT p2.project_id FROM projects p2 \
                INNER JOIN teams t2 ON t2.project_id = p2.project_id \
                INNER JOIN employee_team_mapping etm2 ON etm2.team_id = t2.team_id \
                INNER JOIN project_manager_mapping pm2 ON p2.project_id = pm2.project_id \
                WHERE pm2.project_manager_id = :emp_id \
                AND p2.active = 'true' AND t2.is_active = 'Y' AND etm2.active != 0 \
                UNION ALL \
                SELECT p3.project_id FROM projects p3 \
                INNER JOIN teams t3 ON t3.project_id = p3.project_id \
                INNER JOIN employee_team_mapping etm3 ON etm3.team_id = t3.team_id \
                INNER JOIN project_overhead_mapping pom3 ON p3.project_id = pom3.project_id \
                WHERE pom3.project_overhead_id = :emp_id \
                AND p3.active = 'true' AND t3.is_active = 'Y' AND etm3.active != 0 \
                UNION ALL \
                SELECT p4.project_id FROM projects p4 \
                INNER JOIN teams t4 ON t4.project_id = p4.project_id \
                INNER JOIN employee_team_mapping etm4 ON etm4.team_id = t4.team_id \
                WHERE t4.team_lead_id = :emp_id \
                AND p4.active = 'true' AND t4.is_active = 'Y' AND etm4.active != 0 \
                UNION ALL \
                SELECT p5.project_id FROM projects p5 \
                INNER JOIN teams t5 ON t5.project_id = p5.project_id \
                INNER JOIN employee_team_mapping etm5 ON etm5.team_id = t5.team_id \
                WHERE t5.spoc_id = :emp_id \
                AND p5.active = 'true' AND t5.is_active = 'Y' AND etm5.active != 0 \
            ) \
        ) \
    ) \
AND e.emp_id != :emp_id \
GROUP BY \
    e.emp_id, e.name, e.email, jr.name, e.mobile_no, e.employeement_id, e.employmentstatus, \
    e.manager_id, em.name, em.email, d.hod_id, eh.name, eh.email, d.dept_id, \
    e.is_timesheet_lock_check_enable, e.reporting_manager_id, e.approvals_to, \
    rm.name, rm.email, e.date_of_joining, e.probation_period, e.is_consultant, e.is_apprenticeship, e.is_apmosys_product \
ORDER BY e.name

Employee.getAllHolidayByEmpWorkLocation = SELECT h.occasion, h.day_of_the_week, h.date_of_holiday, h.state, optional_holiday from holiday h \
INNER JOIN employee e ON e.work_location = h.state \
WHERE e.emp_id = :empId \
UNION ALL \
SELECT h.occasion, h.day_of_the_week, h.date_of_holiday, h.state, optional_holiday from holiday h \
WHERE h.state = 'all' AND h.holiday_type != 'WeekOff'\
order by date_of_holiday ASC

Employee.getAllEmployeesBirthDayToday = SELECT e.name as employee, d.name as department, e.email ,e.emp_id FROM employee e \
INNER JOIN job_role j ON j.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = j.dept_id \
WHERE MONTH(e.date_of_birth) = MONTH(NOW()) AND DAY(e.date_of_birth) = DAY(NOW()) AND e.employmentstatus not like 'InActive'

Employee.getAllEmployeesBirthDayTomorrow = SELECT e.name as employee, d.name as department, e.email, e.emp_id FROM employee e \
INNER JOIN job_role j ON j.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = j.dept_id \
WHERE MONTH(e.date_of_birth) = MONTH(NOW()) AND DAY(e.date_of_birth) = DAY(NOW())+1 AND e.employmentstatus not like 'InActive'

Employee.getEmployeeInfoOnLogin = SELECT e.emp_id,e.name,e.date_of_joining,e.employmentstatus,e.manager_id,e.gender,d.dept_id,e.employeement_id,e.is_new, \
e.is_user_info_updated,e.is_appreciation_enable, d.name as department, e.date_of_resign, jr.employee_role, em.name as managerName, em.email as managerEmail, \
d.hod_id, eh.name as hodName, eh.email as hodEmail, e.is_timesheet_lock_check_enable, e.reporting_manager_id, e.approvals_to, rm.name as reportingManager, \
rm.email as reportingManagerEmail, e.probation_period, e.work_location, e.marital_status as maritalStatus, jr.name as jobRoleName,e.is_apmosys_product FROM employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
INNER JOIN employee em ON em.emp_id = e.manager_id \
INNER JOIN employee eh ON eh.emp_id = d.hod_id \
LEFT JOIN employee rm ON rm.emp_id = e.reporting_manager_id \
WHERE e.email = :email

Employee.getHierarchyByEmpId = SELECT e.emp_id, e.name, e.email, jr.name as jobrolename, e.mobile_no, em.name as manager, e.employeement_id, e.invalid_access_attempt, e.is_timesheet_lock_check_enable,e.pip_flag,e.is_consultant,e.is_apprenticeship from employee e \
