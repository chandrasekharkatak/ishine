LeaveRevokeApplication.getRevokeLeaveApplicationByEmpId = SELECT lra.leave_revoke_id, e.name as createdBy, lra.created_on, lra.emp_id, e2.name as employee, lra.reason, el.from_date, \
el.to_date,el.no_of_days, ls.status, ltm.leave_type, lra.remark \
from leave_revoke_application lra \
INNER JOIN employee_leave el ON el.leave_id = lra.leave_id \
INNER JOIN leave_status ls ON ls.leave_status_id = lra.leave_revoke_status_id \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
INNER JOIN employee e ON e.emp_id = lra.created_by \
INNER JOIN employee e2 ON e2.emp_id = lra.emp_id \
WHERE lra.emp_id = :empId

LeaveRevokeApplication.getAllMyTeamLeaveRevokeApplicationsByEmpId = SELECT lra.leave_revoke_id, e.name as createdBy, lra.created_on, lra.emp_id, e2.name as employee, lra.reason, el.from_date, \
el.to_date,el.no_of_days, ls.status, ltm.leave_type, lra.remark \
from leave_revoke_application lra \
INNER JOIN employee_leave el ON el.leave_id = lra.leave_id \
INNER JOIN leave_status ls ON ls.leave_status_id = lra.leave_revoke_status_id \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
INNER JOIN employee e ON e.emp_id = lra.created_by \
INNER JOIN employee e2 ON e2.emp_id = lra.emp_id \
WHERE lra.created_by = :empId AND lra.emp_id != :empId ORDER BY el.created_on DESC

LeaveRevokeApplication.getAllMyTeamsPendingLeaveRevokeApplicationsByManagerId = SELECT lra.leave_revoke_id,ltm.leave_type, el.from_date, el.to_date, el.no_of_days, ls.status,e.name as employeeName,\
lra.created_on, lra.reason, el.leave_id from leave_revoke_application lra \
INNER JOIN employee_leave el ON el.leave_id = lra.leave_id \
INNER JOIN leave_status ls ON ls.leave_status_id = lra.leave_revoke_status_id \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
INNER JOIN employee e ON e.emp_id = lra.emp_id \
WHERE el.manager_id = :empId AND ls.status = 'Pending' \
ORDER BY el.created_on DESC

