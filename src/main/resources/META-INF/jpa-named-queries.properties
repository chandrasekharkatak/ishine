e.previous_pf_account_number,e.relation,e.state,e.uan,e.views_on_organisation,e.year_of_passing, \
e.pincode as p,e.emergency_contact_person,e.emergency_contact_person a, \
em.name as manager, j.name as jobrole , d.name as department , d.dept_id , j.job_role_id ,e.manager_id, e.work_location, e.experience, e.role, \
e.employeement_id, e.update_application_status, e.mothers_name , e.spouse , e.child1 , e.child2 , e.child3, rm.name as reportingManager, e.designation_id, de.designation_name, e.created_on,e.probation_period,e.total_experience, \
e.date_of_resign, e.date_of_relieving, e.is_consultant,e.is_apprenticeship,e.refered_type,e.refered_name, e.is_apmosys_product \
FROM draft_employee e  \
INNER JOIN employee em ON e.manager_id = em.emp_id \
INNER JOIN job_role j ON j.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = j.dept_id \
LEFT JOIN employee rm ON e.reporting_manager_id = rm.emp_id \
LEFT JOIN designation de ON de.designation_id = e.designation_id \
WHERE e.employeement_id = :employeementId and e.is_apmosys_product = 'false'





Employee.getMyReporteeInfo = SELECT e.emp_id, e.name, e.email, e.employeement_id, \
jr.name as jobrolename, d.name as departmentName, \
em.name as manager, em.emp_id as managerId, (select COUNT(emp.emp_id) from employee emp where emp.manager_id = e.emp_id AND emp.employmentstatus not like 'InActive') as reporteeCount,e.is_consultant, e.is_apprenticeship \
from employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
INNER JOIN employee em ON e.manager_id = em.emp_id \
WHERE e.employmentstatus not like 'InActive' AND e.manager_id = :empId

Employee.getMyManagerInfo = SELECT e.emp_id, e.name, e.email, e.employeement_id, \
jr.name as jobrolename, d.name as departmentName, \
em.name as manager, em.emp_id as managerId, (select COUNT(emp.emp_id) from employee emp where emp.manager_id = e.emp_id AND emp.employmentstatus not like 'InActive') as reporteeCount,e.is_consultant, e.is_apprenticeship \
from employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
INNER JOIN employee em ON e.manager_id = em.emp_id \
WHERE e.employmentstatus not like 'InActive' AND e.emp_id = :empId

Employee.getAllEmployeesReportByProjectType = SELECT e.emp_id, e.employeement_id, e.name, e.email, e.mobile_no, \
e.manager_id, m.name as ManagerName, e.employmentstatus, e.billable, e.billable_type, t.team_id, t.team_name, p.project_id, \
p.project_name, p.po_start_date, p.po_end_date, p.po_no, c.client_name, cl.client_location, e.work_location, \
e.total_experience, d.dept_id, d.name as departmentName, p.po_project_type, j.name as jobrole, p.po_project_id, p.clientrm, p.apmosysrm \
FROM employee e \
INNER JOIN employee_team_mapping etm ON etm.emp_id = e.emp_id \
INNER JOIN teams t ON t.team_id = etm.team_id \
INNER JOIN projects p ON p.project_id = t.project_id \
INNER JOIN job_role j on j.job_role_id = e.job_role_id \
INNER JOIN department d on d.dept_id = j.dept_id \
INNER JOIN employee m on m.emp_id = e.manager_id \
INNER JOIN client_locations cl on cl.client_id = p.client_id \
INNER JOIN clients c on c.client_id = p.client_id \
WHERE e.employmentstatus != "InActive" \
  AND etm.active != 0 AND t.is_active != 'N' AND p.active != 'false' 
  
Employee.getAllEmployeesReportByProjectTypeInConsolidated = SELECT e.emp_id, e.employeement_id, e.name, e.email, e.mobile_no, \
e.manager_id, m.name as ManagerName, e.employmentstatus, e.billable, e.billable_type, \
emp_proj_client.team_id, emp_proj_client.team_name, emp_proj_client.project_id, \
emp_proj_client.project_name, emp_proj_client.po_start_date, emp_proj_client.po_end_date, \
emp_proj_client.po_no, emp_proj_client.client_name, emp_proj_client.client_location, e.work_location, \
e.total_experience, d.dept_id, d.name as departmentName, emp_proj_client.po_project_type, j.name as jobrole, \
emp_proj_client.po_project_id, eppm.primary_project_name, eppm.primary_project_id, emp_proj_client.clientrm, emp_proj_client.apmosysrm \
FROM employee e \
INNER JOIN job_role j ON j.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = j.dept_id \
INNER JOIN employee m ON e.manager_id = m.emp_id \
LEFT JOIN emp_primary_project_mapping eppm ON eppm.emp_id = e.emp_id \
LEFT JOIN ( \
    SELECT \
        etm.emp_id, \
        GROUP_CONCAT(DISTINCT pr.project_name ORDER BY pr.project_id) AS project_name, \
        GROUP_CONCAT(DISTINCT pr.project_id ORDER BY pr.project_id) AS project_id, \
        GROUP_CONCAT(DISTINCT pr.po_start_date ORDER BY pr.project_id) AS po_start_date, \
        GROUP_CONCAT(DISTINCT pr.po_end_date ORDER BY pr.project_id) AS po_end_date, \
        GROUP_CONCAT(DISTINCT pr.po_no ORDER BY pr.project_id) AS po_no, \
        GROUP_CONCAT(DISTINCT pr.po_project_type ORDER BY pr.project_id) AS po_project_type, \
        GROUP_CONCAT(DISTINCT c.client_name ORDER BY pr.project_id) AS client_name, \
        GROUP_CONCAT(DISTINCT cl.client_location ORDER BY pr.project_id) AS client_location, \
        GROUP_CONCAT(DISTINCT t.team_name ORDER BY pr.project_id) AS team_name, \
        GROUP_CONCAT(DISTINCT t.team_id ORDER BY pr.project_id) AS team_id, \
        GROUP_CONCAT(DISTINCT pr.po_project_id ORDER BY pr.project_id) AS po_project_id, \
        GROUP_CONCAT(DISTINCT pr.clientrm ORDER BY pr.project_id) AS clientrm, \
        GROUP_CONCAT(DISTINCT pr.apmosysrm ORDER BY pr.project_id) AS apmosysrm, \
         JSON_ARRAYAGG(JSON_OBJECT('project_id', pr.project_id,'project_name', pr.project_name)) AS project_kv_pairs \
    FROM employee_team_mapping etm \
    LEFT JOIN teams t ON t.team_id = etm.team_id \
    LEFT JOIN projects pr ON pr.project_id = t.project_id \
    LEFT JOIN clients c ON c.client_id = pr.client_id \
    LEFT JOIN client_locations cl ON cl.client_id = pr.client_id \
    WHERE etm.active != 0 \
    AND t.is_active != 'N' \
    AND pr.active != 'false' \
    GROUP BY etm.emp_id \
) emp_proj_client ON emp_proj_client.emp_id = e.emp_id where e.employmentstatus != 'InActive'

