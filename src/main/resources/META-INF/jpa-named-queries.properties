Team.projectTeamsByProjectId = SELECT distinctrow t.project_id, p.project_name, t.team_id, t.team_name, t.team_lead_id, t.team_lead_name, p.project_manager_id , pm.name as projectManager, \
p.department_name,e1.name as teamCreatedByName,t.created_on, t.is_active, jr.dept_id as teamLeadDept, t.dept_ids  \
FROM teams t \
LEFT JOIN employee e1 ON e1.emp_id = t.created_by \
LEFT JOIN projects p ON p.project_id = t.project_id \
LEFT JOIN employee pm ON pm.emp_id = p.project_manager_id \
LEFT JOIN employee tl ON tl.emp_id = t.team_lead_id \
LEFT JOIN job_role jr ON jr.job_role_id = tl.job_role_id \
WHERE t.project_id = :projectId \
ORDER BY p.project_name, t.team_name

Team.getAllTeams = SELECT distinctrow t.project_id, p.project_name, t.team_id, t.team_name, t.team_lead_id, t.team_lead_name, p.project_manager_id , pm.name as projectManager, \
p.department_name,e1.name as teamCreatedByName,t.created_on, t.is_active, jr.dept_id as teamLeadDept, t.dept_ids  \
FROM teams t \
LEFT JOIN employee e1 ON e1.emp_id = t.created_by \
LEFT JOIN projects p ON p.project_id = t.project_id \
LEFT JOIN employee pm ON pm.emp_id = p.project_manager_id \
LEFT JOIN employee tl ON tl.emp_id = t.team_lead_id \
LEFT JOIN job_role jr ON jr.job_role_id = tl.job_role_id \
ORDER BY p.project_name, t.team_name

Team.updateTeamProjectByPoProjectId = UPDATE teams t SET t.project_id = (SELECT p.project_id FROM projects p \
WHERE p.po_project_id = :poProjectId) WHERE t.team_id = :teamId

Team.updateTeamName = UPDATE teams t SET t.team_name = :newTeamName WHERE t.team_id = :teamId
