##############################################   EmployeeRepository  ################################################

Employee.getEmployeeByEmpId= SELECT e.emp_id, e.aadhar , e.about_me,e.address,e.bank_account_no,e.bankifsccode,e.bank_name, \
e.blood_group,e.city,e.country,e.date_of_birth,e.date_of_joining,e.email,e.emergency_contact_mobile, \
e.employmentstatus,e.esic_number,e.father_name,e.gender,e.graduation,e.hobbies,e.landline,e.marital_status \
,e.mobile_no,e.mother_tongue,e.name,e.notice_period,e.official_mobile_no,e.pan_number,e.passport_number, \
e.permanent_address,e.pf_account_number,e.pincode,e.place_of_birth,e.post_graduation, \
e.previous_pf_account_number,e.relation,e.state,e.uan,e.views_on_organisation,e.year_of_grad, \
e.year_of_post_grad,e.emergency_contact_person,e.profile_image_name, \
em.name as manager, j.name as jobrole , d.name as department \
FROM employee e  \
INNER JOIN employee em ON e.manager_id = em.emp_id \
INNER JOIN job_role j ON j.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = j.dept_id \
WHERE e.emp_id = :empId

Employee.getAllEmployees = SELECT e.emp_id, e.aadhar, e.about_me, e.address, e.bank_account_no, e.bankifsccode, \
e.bank_name, e.blood_group, e.city, e.country, e.created_by, e.created_on, e.date_of_birth, \
 e.date_of_joining, e.email, e.emergency_contact_mobile, e.emergency_contact_person, \
 e.employmentstatus, e.esic_number, e.father_name, e.gender, e.graduation, e.hobbies, \
 e.job_role_id, e.landline, e.manager_id, e.marital_status, e.mobile_no, e.mother_tongue, e.name, \
 e.notice_period, e.official_mobile_no,  e.pan_number, e.passport_number, \
 e.permanent_address, e.pf_account_number, e.pincode, e.place_of_birth, e.post_graduation, \
 e.previous_pf_account_number, e.relation, e.state, e.uan, \
 e.views_on_organisation, e.year_of_grad, e.year_of_post_grad, \
  jr.dept_id, jr.name as jobrolename, \
 d.name as departmentname FROM employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id

##############################################   JobRoleRepository ################################################

JobRole.getAllJobRoles = SELECT j.name as jobrolename , \
e.name as createdby,j.created_on,d.dept_id,d.name as department,j.job_role_id FROM job_role j \
INNER JOIN employee e ON j.created_by = e.emp_id \
INNER JOIN department d ON d.dept_id = j.dept_id

##############################################   RoleFeatureMapRepository ################################################

RoleFeatureMap.getTabsByRoleId = select sub.sub_feature_master_id,sub.sub_feature_name, \
feature.feature_id,feature.feature_name, \
tab.tab_name,tab.tab_icon,tab.tab_route_name from role_feature_map map \
INNER JOIN sub_feature_master sub ON map.sub_feature_master_id = sub.sub_feature_master_id \
INNER JOIN feature_master feature ON feature.feature_id = sub.feature_id \
INNER JOIN tab_master tab ON tab.tab_id = feature.tab_id \
WHERE map.job_role_id = :roleId

################################################### SubFeatureMasterRepository ##############################################

SubFeatureMaster.getAllSubFeatures = SELECT sfm.sub_feature_master_id,fm.feature_id,sfm.sub_feature_name, \
sfm.sub_feature_type,fm.feature_name, tm.tab_name FROM sub_feature_master sfm \
INNER JOIN feature_master fm ON sfm.feature_id = fm.feature_id \
INNER JOIN tab_master tm ON tm.tab_id = fm.tab_id

