EmployeeLeave.getAllMyLeaveApplicationsByEmpId = SELECT el.leave_id,ltm.leave_type,el.from_date,el.to_date,el.no_of_days, \
ls.status,emp.name,el.created_on,el.reason,ltm.leave_type_master_id, el.remark \
FROM employee_leave el \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
INNER JOIN leave_status ls ON ls.leave_status_id = el.leave_status_id \
INNER JOIN employee emp ON emp.emp_id = el.created_by \
where el.emp_id = :empId ORDER BY el.created_on DESC

EmployeeLeave.getAllMyTeamApplicationsByEmpId = SELECT el.leave_id,ltm.leave_type,el.from_date,el.to_date,el.no_of_days, \
ls.status,emp.name,el.created_on,el.reason,ltm.leave_type_master_id, el.emp_id, el.remark \
FROM employee_leave el \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
INNER JOIN leave_status ls ON ls.leave_status_id = el.leave_status_id \
INNER JOIN employee emp ON emp.emp_id = el.emp_id \
where el.created_by = :empId AND emp.emp_id != :empId ORDER BY el.created_on DESC

