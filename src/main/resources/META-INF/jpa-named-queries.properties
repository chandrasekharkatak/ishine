################################################### DepartmentRepository ##############################################

Department.getAllDepartments = SELECT dept.dept_id,dept.created_by,dept.created_on \
,dept.name as department_name,emp1.name as createdBy,emp2.name,dept.hod_id FROM department dept \
INNER JOIN employee emp1 ON dept.created_by = emp1.emp_id \
INNER JOIN employee emp2 ON dept.hod_id = emp2.emp_id

################################################### EmployeeLeaveRepository ##############################################
EmployeeLeave.getAllMyLeaveApplicationsByEmpId = SELECT el.leave_id,ltm.leave_type,el.from_date,el.to_date,el.no_of_days, \
ls.status,emp.name,el.created_on,el.reason \
FROM employee_leave el \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
INNER JOIN leave_status ls ON ls.leave_status_id = el.leave_status_id \
INNER JOIN employee emp ON emp.emp_id = el.created_by \
where el.emp_id = :empId

EmployeeLeave.getAllMyTeamsLeaveApplicationsByManagerId = SELECT el.leave_id,ltm.leave_type,el.from_date,el.to_date,el.no_of_days, \
ls.status,emp.name,el.created_on,el.reason,el.created_by,el.leave_type_master_id \
FROM employee_leave el \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
INNER JOIN leave_status ls ON ls.leave_status_id = el.leave_status_id \
INNER JOIN employee emp ON emp.emp_id = el.created_by \
where el.manager_id = :managerId 

###################################################### EmployeeLeavesMapRepository ###############################################

EmployeeLeavesMap.getMyLeaveBalancesByEmpId = SELECT lm.leave_type,map.balance,map.pending_for_approval \
FROM employee_leaves_map map \
INNER JOIN leave_type_master lm ON map.leave_type_master_id = lm.leave_type_master_id \
where map.emp_id = :empId

###################################################### LeaveBalanceLogRepository ###############################################


LeaveBalanceLog.getLeaveLogsByEmpId = SELECT lm.leave_type,bal.update_balance_by , bal.balance,bal.message , bal.created_on \
 FROM leave_balance_log bal INNER JOIN leave_type_master lm ON lm.leave_type_master_id = bal.leave_type_master_id \
WHERE bal.emp_id = :empId
