Employee.getBillableEmpWithDepartment=SELECT e.employeement_id, e.email,   e.name,  em.name AS managerName,  d.name AS departmentName,  hd.name AS hodName,  e.billable,  e.billable_type,   e.mobile_no,   e.mothers_name,  e.approvals_to,  e.marital_status, emp_proj_client.project_name,  emp_proj_client.client_name,  e.gender,  e.employmentstatus,   e.total_experience,   e.date_of_birth,\
 e.date_of_joining,  e.work_location,  e.experience,  e.emp_id,  emp_proj_client.team_name,  e.is_consultant,  e.is_apprenticeship FROM   employee e\
INNER JOIN  job_role jr ON jr.job_role_id = e.job_role_id\
INNER JOIN   department d ON d.dept_id = jr.dept_id\
INNER JOIN  employee em ON em.emp_id = e.manager_id\
INNER JOIN  employee hd ON hd.emp_id = d.hod_id\
LEFT JOIN (SELECT     etm.emp_id, GROUP_CONCAT(DISTINCT pr.project_name) AS project_name,   GROUP_CONCAT(DISTINCT cl.client_name) AS client_name,  GROUP_CONCAT(DISTINCT t.team_name) AS team_name FROM      employee_team_mapping etm \
 LEFT JOIN  teams t ON t.team_id = etm.team_id LEFT JOIN    projects pr ON pr.project_id = t.project_id LEFT JOIN   clients cl ON cl.client_id = pr.client_id \
 WHERE  etm.active != 0 AND t.is_active != 'N' AND pr.active != 'false'\
 GROUP BY   etm.emp_id) emp_proj_client ON emp_proj_client.emp_id = e.emp_id\
WHERE  e.employmentstatus != 'InActive'

Employee.getEmployeesBillableDataDepartmentWise = SELECT  d.name AS department, e.billable_type, COUNT(e.emp_id) AS countEmployees \
FROM  employee e \
