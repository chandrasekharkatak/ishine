el.from_date,el.to_date,el.no_of_days,el.reject_comp_off_reason,el.current_approval_level,el.final_approval_level,el.manager_id,el.level2approval_status,el.level2approver_id,el.manager_approval_status, e.name as approverName,eh.name as level2ApproverName from comp_off_leave el \
