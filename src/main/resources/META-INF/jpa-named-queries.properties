Appreciation.getAppreciateEmployeeByCurrentUser = select appriate_type,appreciation_by,appreciation_date,appreciation_to,appreciation_event_id from appreciation \
where appreciation_by= :appreciationBy and appreciation_event_id= :appreciationEventId


