Project.getExceptionEmployeeReport = select distinct e.employeement_id, e.name employee_name, d.name department,e.billable_type, p.project_id,p.project_name, p.client_name, \
p.apmosysrm ,p.clientrm ,p.po_no ,p.po_project_type ,p.po_start_date ,p.po_end_date,e.emp_id \
from projects p \
inner join teams t on p.project_id = t.project_id \
inner join employee_team_mapping etm on t.team_id = etm.team_id \
inner join employee e on e.emp_id = etm.emp_id \
inner join job_role jr on e.job_role_id = jr.job_role_id \
inner join department d on d.dept_id = jr.dept_id \
where p.active = 'true' and t.is_active != 'N' and etm.active != 0 \
and e.employmentstatus != 'InActive' \
and e.billable_type = 'Bench' and (p.po_project_type like 'FIXED%COST' OR p.po_project_type like 'TNM') AND e.emp_id NOT BETWEEN 1 AND 6


Project.getExceptionEmployeeReportInDepartments = select distinct e.employeement_id, e.name employee_name, d.name department,e.billable_type, p.project_id,p.project_name, p.client_name, \
p.apmosysrm ,p.clientrm ,p.po_no ,p.po_project_type ,p.po_start_date ,p.po_end_date \
from projects p \
inner join teams t on p.project_id = t.project_id \
inner join employee_team_mapping etm on t.team_id = etm.team_id \
inner join employee e on e.emp_id = etm.emp_id \
inner join job_role jr on e.job_role_id = jr.job_role_id \
inner join department d on d.dept_id = jr.dept_id \
where p.active = 'true' and t.is_active != 'N' and etm.active != 0 \
and e.employmentstatus != 'InActive' \
and e.billable_type = 'Bench' and (p.po_project_type like 'FIXED%COST' OR p.po_project_type like 'TNM') and d.dept_id IN :deptIds AND e.emp_id NOT BETWEEN 1 AND 6



Project.getExceptionEmployeeReportInDepartment = select distinct e.employeement_id, e.name employee_name, d.name department,e.billable_type, p.project_id,p.project_name, p.client_name, \
p.apmosysrm ,p.clientrm ,p.po_no ,p.po_project_type ,p.po_start_date ,p.po_end_date \
from projects p \
inner join teams t on p.project_id = t.project_id \
inner join employee_team_mapping etm on t.team_id = etm.team_id \
inner join employee e on e.emp_id = etm.emp_id \
