Project.getProjectStatusByPoProjectId = select p.po_project_id,CASE \
    WHEN p.is_draft_project = 'true' THEN 'Not Started' \
    WHEN p.is_draft_project = 'false' THEN 'InProgress' \
    WHEN p.is_draft_project = 'Rejected' THEN 'Not Started' \
    WHEN p.is_draft_project = 'Completed' THEN 'Completed' \
    WHEN p.is_draft_project IS NULL THEN 'Not Started' \
    WHEN p.project_status = 'Completed' THEN 'Completed' \
    WHEN p.project_status = 'OnHold' THEN 'On Hold' \
    ELSE '' \
END AS ishine_project_status from projects p \
where p.po_project_id in (:poProjectId)

