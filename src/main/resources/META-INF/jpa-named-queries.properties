EmployeeLeave.getAllTeamLeaveHistoryView = SELECT emp.name, el.from_date, el.to_date, el.created_on, el.no_of_days, ls.status, el.reason, ltm.leave_type \
FROM employee_leave el \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
INNER JOIN leave_status ls ON ls.leave_status_id = el.leave_status_id \
INNER JOIN employee emp ON emp.emp_id = el.created_by \
WHERE el.manager_id = :empId \
union all \
SELECT e.name, el.from_date, el.to_date, el.created_on, el.no_of_days, s.status, cm.comp_off_reasons, el.leave_code \
FROM comp_off_leave el \
INNER JOIN employee e ON e.emp_id = el.emp_id \
INNER JOIN leave_status s ON s.leave_status_id = el.leave_status_id \
INNER JOIN comp_off_master cm ON cm.comp_off_id = el.leave_status_id \
WHERE  el.leave_code = 'CO' \
AND el.manager_id = :empId \
ORDER BY created_on DESC

###################################################### EmployeeLeavesMapRepository ###############################################

EmployeeLeavesMap.getMyLeaveBalancesByEmpId = SELECT lm.leave_type,map.balance,map.pending_for_approval,lm.leave_type_master_id \
FROM employee_leaves_map map \
INNER JOIN leave_type_master lm ON map.leave_type_master_id = lm.leave_type_master_id \
where map.emp_id = :empId

###################################################### LeaveBalanceLogRepository ###############################################


LeaveBalanceLog.getLeaveLogsByEmpId = SELECT lm.leave_type,bal.update_balance_by , bal.balance,bal.message , bal.created_on \
 FROM leave_balance_log bal INNER JOIN leave_type_master lm ON lm.leave_type_master_id = bal.leave_type_master_id \
WHERE bal.emp_id = :empId

