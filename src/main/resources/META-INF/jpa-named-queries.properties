Employee.getAllTeamMemberView = SELECT distinctrow e.emp_id, e.name, e.email, jr.name as jobrolename, e.mobile_no, e.employeement_id, e.employmentstatus, e.manager_id, em.name as managerName, em.email as managerEmail, d.hod_id, eh.name as hodName, eh.email as hodEmail, d.dept_id, e.is_timesheet_lock_check_enable, e.reporting_manager_id, e.approvals_to,rm.name as reportingManager, rm.email as reportingManagerEmail, e.date_of_joining, e.probation_period from employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
INNER JOIN employee em ON e.manager_id = em.emp_id \
INNER JOIN employee eh ON d.hod_id = eh.emp_id \
LEFT JOIN employee rm ON e.reporting_manager_id = rm.emp_id \
INNER JOIN employee_team_mapping etm ON etm.emp_id = e.emp_id \
INNER JOIN teams t ON t.team_id = etm.team_id \
INNER JOIN projects p ON p.project_id = t.project_id \
WHERE p.project_id IN(SELECT sp.project_id FROM employee self \
	INNER JOIN employee_team_mapping setm ON setm.emp_id = self.emp_id \
	INNER JOIN teams st ON st.team_id = setm.team_id \
	INNER JOIN projects sp ON sp.project_id = st.project_id \
    WHERE self.emp_id = :empId) \
AND e.emp_id != :empId AND etm.active = 1 AND e.employmentstatus not like 'InActive' order by e.name

Employee.getAllHolidayByEmpWorkLocation = SELECT h.occasion, h.day_of_the_week, h.date_of_holiday, h.state, optional_holiday from holiday h \
INNER JOIN employee e ON e.work_location = h.state \
WHERE e.emp_id = :empId \
UNION ALL \
SELECT h.occasion, h.day_of_the_week, h.date_of_holiday, h.state, optional_holiday from holiday h \
WHERE h.state = 'all' AND h.holiday_type != 'WeekOff'\
order by date_of_holiday ASC

Employee.getAllEmployeesBirthDayToday = SELECT e.name as employee, d.name as department, e.email FROM employee e \
INNER JOIN job_role j ON j.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = j.dept_id \
WHERE MONTH(e.date_of_birth) = MONTH(NOW()) AND DAY(e.date_of_birth) = DAY(NOW()) AND e.employmentstatus not like 'InActive'

Employee.getAllEmployeesBirthDayTomorrow = SELECT e.name as employee, d.name as department, e.email, e.emp_id FROM employee e \
INNER JOIN job_role j ON j.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = j.dept_id \
WHERE MONTH(e.date_of_birth) = MONTH(NOW()) AND DAY(e.date_of_birth) = DAY(NOW())+1 AND e.employmentstatus not like 'InActive'

Employee.getEmployeeInfoOnLogin = SELECT e.emp_id,e.name,e.date_of_joining,e.employmentstatus,e.manager_id,e.gender,d.dept_id,e.employeement_id,e.is_new, \
e.is_user_info_updated,e.is_appreciation_enable, d.name as department, e.date_of_resign, jr.employee_role, em.name as managerName, em.email as managerEmail, \
d.hod_id, eh.name as hodName, eh.email as hodEmail, e.is_timesheet_lock_check_enable, e.reporting_manager_id, e.approvals_to, rm.name as reportingManager, \
rm.email as reportingManagerEmail, e.probation_period, e.work_location, e.marital_status as maritalStatus, jr.name as jobRoleName FROM employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
INNER JOIN employee em ON em.emp_id = e.manager_id \
INNER JOIN employee eh ON eh.emp_id = d.hod_id \
LEFT JOIN employee rm ON rm.emp_id = e.reporting_manager_id \
WHERE e.email = :email

Employee.getHierarchyByEmpId = SELECT e.emp_id, e.name, e.email, jr.name as jobrolename, e.mobile_no, em.name as manager, e.employeement_id, e.invalid_access_attempt, e.is_timesheet_lock_check_enable,e.pip_flag from employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN employee em ON em.emp_id = :empId \
WHERE e.employmentstatus not like 'InActive' AND ((e.manager_id = :empId AND (e.approvals_to = 'Manager' OR e.approvals_to IS NULL)) OR (e.reporting_manager_id = :empId AND e.approvals_to = 'Reporting Manager'))

Employee.getEmployeeData = SELECT em.name as manager, j.name as jobrole , d.name as department, e.employmentstatus, d.dept_id, em.email as managerMail, hod.email as HodMail \
FROM employee e \
INNER JOIN employee em ON e.manager_id = em.emp_id \
INNER JOIN job_role j ON j.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = j.dept_id \
INNER JOIN employee hod ON hod.emp_id = d.hod_id \
WHERE e.emp_id = :empId

Employee.getEmployeeInProbationAndNotice = SELECT e.employeement_id, e.name, ee.email, e.probation_period, e.notice_period, e.date_of_joining, e.date_of_resign \
from employee e \
INNER JOIN job_role jr on e.job_role_id = jr.job_role_id \
INNER JOIN department d on jr.dept_id = d.dept_id \
INNER JOIN employee ee on d.hod_id = ee.emp_id \
WHERE e.employmentstatus not like 'InActive' AND (DATEDIFF('2023-02-19', e.date_of_joining) < e.probation_period OR DATEDIFF('2023-02-19', e.date_of_resign) < e.notice_period)

Employee.getManagerEmail = SELECT e.email as employee_mail , ee.email as manager_mail,e.name,e.employeement_id, ee.name as manager FROM employee e \
INNER JOIN employee ee ON ee.emp_id = e.manager_id \
WHERE e.emp_id = :empId

