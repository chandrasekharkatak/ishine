EmployeeLeave.getAllLeaveApplicationsByEmpId = SELECT emp.name, el.from_date, el.to_date, el.created_on, el.no_of_days, ls.status, el.reason, ltm.leave_type, \
emp1.name statusUpdatedBy, el.leave_id, el.remark, em.name as approverName, em.email as approverMail, el.manager_approval_status, \
