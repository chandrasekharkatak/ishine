# All the hirarchy queries are used for view all the employee data that are inside a given autority person.


EmployeeLeave.getAllTeamLeaveHistoryViewHirarchy = SELECT emp.employeement_id, emp.name, \
el.from_date, el.to_date,el.created_on, el.no_of_days, ls.status, el.reason, ltm.leave_type, \
emp1.name statusUpdatedBy,emp1.emp_id,el.leave_id, el.remark, em.name as approverName,\
 em.email as approverMail, el.manager_approval_status, \
el.level2approver_id, e2.name as level2ApproverName, e2.email as level2ApproverEmail, \
el.level2approval_status, \
el.level3approver_id, e3.name as level3ApproverName, el.level3approval_status, e3.email as level3ApproverEmail, \
el.current_approval_level, el.final_approval_level, emp.emp_id as createdbyEmpId \
    FROM    (  SELECT * \
        FROM employee_leave \
        WHERE from_date >= :fromDate \
          AND to_date <= :toDate \
          AND emp_id IN (:empIds) \
    )  el \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
INNER JOIN leave_status ls ON ls.leave_status_id = el.leave_status_id \
INNER JOIN employee emp ON emp.emp_id = el.emp_id \
LEFT JOIN employee emp1 ON emp1.emp_id = el.leave_status_updated_by \
INNER JOIN employee em ON em.emp_id = el.manager_id \
LEFT JOIN employee e2 ON e2.emp_id = el.level2approver_id \
LEFT JOIN employee e3 ON e3.emp_id = el.level3approver_id \
WHERE emp.employmentstatus not like 'InActive'   AND ls.leave_status_id != 1 \
ORDER BY el.created_on DESC



EmployeeLeave.getAllMyTeamsPendingLeaveApplicationsByManagerIdInHirarchy = SELECT \
 el.leave_id, \
 ltm.leave_type,el.from_date, \
 el.to_date, \
 el.no_of_days,ls.status, \
 emp.name AS createdByName, \
 el.created_on,el.reason, el.created_by, el.leave_type_master_id, emp1.name AS employeeName, \
 emp1.email, emp1.employeement_id, em.name AS approverName, em.emp_id, em.email AS approverMail, \
 el.manager_approval_status, el.level2approver_id, e2.name AS level2ApproverName, \
 e2.email AS level2ApproverEmail, el.level2approval_status, el.level3approver_id, \
 e3.name AS level3ApproverName, el.level3approval_status, e3.email AS level3ApproverEmail, \
 el.current_approval_level, el.final_approval_level, emp1.emp_id AS leaveEmpId, el.manager_id, \
 GROUP_CONCAT(DISTINCT t.team_name ORDER BY t.team_name ASC SEPARATOR ', ') AS team_names, \
 GROUP_CONCAT(DISTINCT c.client_name ORDER BY c.client_name ASC SEPARATOR ', ') AS client_names \
FROM employee_leave el \
INNER JOIN employee emp ON emp.emp_id = el.created_by \
INNER JOIN employee emp1 ON emp1.emp_id = el.emp_id \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
INNER JOIN leave_status ls ON ls.leave_status_id = el.leave_status_id \
INNER JOIN employee em ON em.emp_id = el.manager_id \
LEFT JOIN employee_team_mapping etm ON etm.emp_id = emp.emp_id \
LEFT JOIN teams t ON etm.team_id = t.team_id \
LEFT JOIN projects p ON p.project_id = t.project_id \
LEFT JOIN clients c ON c.client_id = p.client_id \
LEFT JOIN employee e2 ON e2.emp_id = el.level2approver_id \
LEFT JOIN employee e3 ON e3.emp_id = el.level3approver_id \
WHERE el.leave_status_id = 1 \
    AND ( \
        (el.emp_id IN (:empIds) AND \
        (el.current_approval_level IS NULL OR el.current_approval_level = 1)) \
        OR (el.level2approver_id = :managerId AND el.current_approval_level = 2) \
        OR (el.level3approver_id = :managerId AND el.current_approval_level = 3) \
    ) \
GROUP BY el.leave_id


CompOffLeave.getPendingCompOffRequestsByManagerIdInHirarchy = SELECT el.comp_off_leave_id,cm.comp_off_reasons,el.description,el.created_on,e.name,s.status, \
el.from_date,el.to_date,el.no_of_days,el.emp_id,e.email,e.employeement_id, em.emp_id as managerId, em.email as managerEmail, cl.final_approval_level, cl.level2approver_id, cl.manager_approval_status,cl.reporting_manager_id, cl.current_approval_level, cl.level2approval_status, e2.name as level2ApproverName, em.name as approverName  FROM comp_off_leave el \
INNER JOIN employee e ON e.emp_id = el.emp_id \
INNER JOIN leave_status s ON s.leave_status_id = el.leave_status_id \
INNER JOIN comp_off_master cm ON cm.comp_off_id = el.reason \
INNER JOIN employee em ON em.emp_id = e.manager_id \
INNER JOIN comp_off_leave cl on cl.comp_off_leave_id=el.comp_off_leave_id \
LEFT JOIN employee e2 ON e2.emp_id = cl.level2approver_id \
INNER JOIN employee emp ON emp.emp_id = cl.created_by \
WHERE  cl.comp_off_status Not IN ('Approved','Rejected','Expired') and s.status='Pending' \
AND el.emp_id IN(:empIds)



LeaveRevokeApplication.getAllMyTeamsPendingLeaveRevokeApplicationsByManagerIdHirarchy = SELECT lra.leave_revoke_id,ltm.leave_type, el.from_date, el.to_date, el.no_of_days, ls.status,e.name as employeeName,\
lra.created_on, lra.reason, el.leave_id, e.emp_id from leave_revoke_application lra \
INNER JOIN employee_leave el ON el.leave_id = lra.leave_id \
INNER JOIN leave_status ls ON ls.leave_status_id = lra.leave_revoke_status_id \
