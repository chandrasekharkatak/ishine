EmployeeLeave.findOverlappedTeamMemberLeave = SELECT distinctrow e.emp_id, e.employeement_id, e.name, el.from_date, el.to_date from employee e \
INNER JOIN employee_team_mapping etm ON etm.emp_id = e.emp_id \
INNER JOIN teams t ON t.team_id = etm.team_id \
INNER JOIN projects p ON p.project_id = t.project_id \
INNER JOIN employee_leave el ON el.emp_id = e.emp_id \
WHERE p.project_id IN(SELECT sp.project_id FROM employee self \
	INNER JOIN employee_team_mapping setm ON setm.emp_id = self.emp_id \
	INNER JOIN teams st ON st.team_id = setm.team_id \
	INNER JOIN projects sp ON sp.project_id = st.project_id \
    WHERE self.emp_id =:empId ) \
AND e.emp_id !=:empId AND e.employmentstatus not like 'InActive' AND ((el.to_date BETWEEN :fromDate AND :toDate) OR (el.from_date BETWEEN :fromDate AND :toDate)) \
order by e.name

EmployeeLeave.findRecentLeavesByEmpId = SELECT * FROM employee_leave el WHERE el.emp_id = :empId and el.leave_type_master_id=2 and el.leave_status_id != 3 ORDER BY el.created_on DESC

EmployeeLeave.findEmployeeLeaveByToDate = SELECT * FROM employee_leave el WHERE el.to_date= :toDate AND el.emp_id=:empId

EmployeeLeave.findLeaveByFromDate = SELECT * FROM employee_leave el WHERE el.to_date < :fromDate AND el.emp_id= :empId ORDER BY el.to_date DESC


EmployeeLeave.findLeaveByFromDateAndToDate = select * from employee_leave el where el.emp_id= :empId AND el.leave_status_id IN(1,2) AND el.from_date >= :fromDate AND el.to_date <= :toDate




