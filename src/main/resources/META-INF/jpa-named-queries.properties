LeaveTypeMaster.getAllLeaveTypesByLeavePolicies = select lpm.leave_type_master_id , ltm.leave_type, ltm.leave_type_code, lpm.leave_policy_master_id, lpm.leave_policy_name, \
lpm.employment_status, lpm.description, lpm.leave_application, lpm.increment, lpm.increment_value, \
lpm.one_time_leave, lpm.one_time_leave_min_count, lpm.one_time_leave_count, lpm.carry_forward, lpm.carry_forward_value, \
lpm.expiration_period, lpm.expiration_period_value, \
lpm.locking_period, lpm.locking_period_value, lpm.locking_value, lpm.probation, lpm.probation_period,lpm.marital_status,lpm.maternity_type, lpm.maternity_leave_days \
from leave_type_master ltm \
INNER JOIN leave_policies_master lpm ON lpm.leave_type_master_id = ltm.leave_type_master_id \
WHERE lpm.leave_application = "Yes" \
AND ((lpm.employment_status = :employmentStatus AND ltm.gender = 'All') \
OR (lpm.employment_status = :employmentStatus AND ltm.gender = :gender AND lpm.marital_status = :maritalStatus) \
AND ltm.leave_type_code IN ('ML','ML','ML') \
