CompOffLeave.getAllCompOffRequestsByEmpId = select el.comp_off_leave_id,el.created_by,el.description,el.created_on,s.status, \
el.from_date,el.to_date,el.no_of_days from comp_off_leave el \
INNER JOIN leave_status s ON s.leave_status_id = el.leave_status_id \
where emp_id = :empId AND el.leave_code = 'CO' \
ORDER BY created_on DESC

######################################################### ActivitiesRepository #####################################################

Activity.getAllActivitiesByProjectIdAndTeamId = SELECT ac.activity_id, p.project_id , p.project_name , p.client_name ,t.team_name ,ac.team_id, \
ac.activity , ac.eta , e.name , ac.created_on FROM activities ac \
INNER JOIN teams t ON t.team_id = ac.team_id \
INNER JOIN projects p ON p.project_id = t.project_id \
INNER JOIN employee e ON e.emp_id = ac.created_by \
WHERE p.project_id = :projectId AND ac.team_id = :teamId

Activity.getAllActivitiesByProjectId = SELECT ac.activity_id,ac.activity FROM activities ac \
INNER JOIN teams t ON t.team_id = ac.team_id \
WHERE t.project_id = :projectId

######################################################### ProjectRepository ######################################################

Project.getActivitiesByProjectIdAndEmployeeId = SELECT ac.activity_id,ac.activity FROM projects p \
INNER JOIN teams t ON t.project_id = p.project_id \
INNER JOIN employee_team_mapping et ON et.team_id = t.team_id \
INNER JOIN employee e ON e.emp_id = et.emp_id \
INNER JOIN activities ac ON ac.team_id = t.team_id \
WHERE e.emp_id = :empId AND p.project_id = :projectId

######################################################### TimesheetActivityMapRepository ######################################################

TimesheetActivityMap.activitiesByTimesheetId = SELECT map.timesheet_id,ac.activity , ac.eta , map.description ,map.completion_time , \
p.project_name,p.client_name , p.client_location, t.team_name, ac.activity_id, p.project_id, map.timesheet_activity_map_id \
FROM employee_timesheet_activities_mapping map \
INNER JOIN activities ac ON ac.activity_id = map.activity_id \
INNER JOIN teams t ON t.team_id = ac.team_id \
INNER JOIN projects p ON p.project_id = t.project_id \
WHERE map.timesheet_id = :timesheetId

######################################################### TimesheetsRepository ######################################################

Timesheet.getMyReporteesTimesheetRequests = SELECT et.timesheet_id,et.date,et.day_type,e.name employeeName,et.description ,et.status, \
em.name created_by,et.created_on \
FROM employee_timesheets et \
INNER JOIN employee e ON e.emp_id = et.emp_id \
INNER JOIN employee em ON  et.created_by = em.emp_id \
WHERE e.manager_id = :managerId AND et.status = :status \
Order by et.date desc

Timesheet.getMyReporteesApprovedTimesheets = SELECT et.timesheet_id,et.date,et.day_type,e.name employeeName,et.description ,et.status, \
em.name created_by,et.created_on \
FROM employee_timesheets et \
INNER JOIN employee e ON e.emp_id = et.emp_id \
INNER JOIN employee em ON  et.created_by = em.emp_id \
WHERE e.manager_id = :managerId AND et.status = :status AND et.date BETWEEN :start and :end \
Order by et.date desc

######################################################### TeamRepository ######################################################

Team.projectTeamsByProjectId = SELECT t.team_id,t.team_lead_id,e.name as teamLead, t.project_id, t.team_name, e1.name,t.created_on \
FROM teams t \
INNER JOIN employee e ON e.emp_id = t.team_lead_id \
INNER JOIN employee e1 ON e1.emp_id = t.created_by \
WHERE t.project_id = :projectId

########################################################## EmployeeTeamMapRepository #####################################################

EmployeeTeamMap.getTeamMembersByTeamId = SELECT et.* , e.name FROM employee_team_mapping et \
INNER JOIN employee e ON e.emp_id = et.emp_id \
WHERE et.team_id = :teamId

########################################################## LeavePolicyMasterRepository #####################################################

LeavePolicyMaster.getAllLeavePolicies = SELECT lpm.leave_policy_master_id, lpm.leave_policy_name, lpm.leave_type_master_id , ltm.leave_type, \
lpm.employment_status, lpm.description, lpm.leave_application, lpm.increment, lpm.increment_value, \
lpm.one_time_leave, lpm.one_time_leave_count, lpm.carry_forward, lpm.carry_forward_value, \
lpm.expiration_period, lpm.expiration_period_value, \
lpm.locking_period, lpm.locking_period_value, lpm.locking_value, lpm.probation, lpm.probation_period, \
e.name, lpm.created_on \
FROM leave_policies_master lpm \
INNER JOIN employee e ON e.emp_id = lpm.created_by \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = lpm.leave_type_master_id;
