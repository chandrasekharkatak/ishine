EmployeeLeave.getLeaveDataPerMonthByEmpId = SELECT YEAR(el.from_date) AS leave_year, MONTH(el.from_date) AS leave_month, lm.leave_type_code AS leave_type,ls.status AS leave_status, \
SUM(el.no_of_days) AS total_days FROM employee_leave el INNER JOIN leave_status ls ON el.leave_status_id = ls.leave_status_id INNER JOIN leave_type_master lm ON el.leave_type_master_id = lm.leave_type_master_id \
WHERE el.emp_id = :empId GROUP BY YEAR(el.from_date), MONTH(el.from_date), lm.leave_type_code, ls.status ORDER BY leave_year, leave_type, leave_month, leave_status

EmployeeLeave.getLeaveDataPerMonthByEmpIdFromTo = SELECT YEAR(el.from_date) AS leave_year, \
    MONTH(el.from_date) AS leave_month, lm.leave_type_code AS leave_type,ls.status AS leave_status, \
    SUM(el.no_of_days) AS total_days FROM  employee_leave el INNER JOIN \
    leave_status ls ON el.leave_status_id = ls.leave_status_id INNER JOIN \
    leave_type_master lm ON el.leave_type_master_id = lm.leave_type_master_id \
	WHERE  el.emp_id = :empId AND el.from_date BETWEEN :startDate AND :endDate \
	GROUP BY YEAR(el.from_date), MONTH(el.from_date), lm.leave_type_code, ls.status \
	ORDER BY  leave_year, leave_type, leave_month, leave_status
    
