EmployeeLeave.getLeaveReport = select e.employeement_id, e.name as employee, ltm.leave_type, el.from_date, el.to_date, \
el.no_of_days,el.reason, ls.status, e2.name as manager, el.created_on, \
el.updated_on, e3.name as statusUpdateBy, d.name department from employee_leave el \
INNER JOIN employee e on el.emp_id = e.emp_id \
INNER JOIN leave_type_master ltm on el.leave_type_master_id = ltm.leave_type_master_id \
INNER JOIN leave_status ls on el.leave_status_id = ls.leave_status_id \
INNER JOIN employee e2 on el.manager_id = e2.emp_id \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
LEFT JOIN employee e3 on el.leave_status_updated_by = e3.emp_id order by e.name

EmployeeLeave.getLast8DaysLeaveReport = SELECT e.employeement_id,d.name department,e.name,el.from_date,el.to_date,ls.status,ltm.leave_type FROM employee_leave el \
INNER JOIN employee e ON e.emp_id = el.emp_id \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
INNER JOIN leave_status ls ON ls.leave_status_id = el.leave_status_id \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
WHERE el.from_date >= :fromDate and el.to_date <= :toDate

