CompOffLeave.getPendingCompOffRequestsByManagerId = SELECT el.comp_off_leave_id,cm.comp_off_reasons,el.description,el.created_on,e.name,s.status, \
el.from_date,el.to_date,el.no_of_days,el.emp_id FROM comp_off_leave el \
INNER JOIN employee e ON e.emp_id = el.emp_id \
INNER JOIN leave_status s ON s.leave_status_id = el.leave_status_id \
INNER JOIN comp_off_master cm ON cm.comp_off_id = el.leave_status_id \
WHERE  el.leave_code = 'CO' AND el.leave_status_id = 1 \
AND el.manager_id = :managerId \
ORDER BY created_on DESC

