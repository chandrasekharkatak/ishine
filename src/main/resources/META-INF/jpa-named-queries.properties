EmployeeLeave.getAllMyTeamsPendingLeaveApplicationsByManagerId = Select el.leave_id,ltm.leave_type,el.from_date,el.to_date,el.no_of_days,ls.status,\
 emp.name as createdByName,el.created_on,el.reason,el.created_by,el.leave_type_master_id, emp1.name as employeeName, emp1.email , emp1.employeement_id \
FROM employee_leave el \
INNER JOIN employee emp ON emp.emp_id = el.created_by \
INNER JOIN employee emp1 ON emp1.emp_id = el.emp_id \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
INNER JOIN leave_status ls ON ls.leave_status_id = el.leave_status_id  \
 WHERE el.leave_status_id = 1 AND el.manager_id IN (WITH recursive my_reportees as \
	( 	SELECT emp_id from employee where emp_id = :managerId \
        UNION \
        SELECT e.emp_id from my_reportees mr INNER JOIN employee e ON e.manager_id = mr.emp_id \
    ) \
SELECT emp_id from my_reportees)

EmployeeLeave.countAllMyTeamsPendingLeaveApplicationsByManagerId = Select count(*) \
FROM employee_leave el \
INNER JOIN employee emp ON emp.emp_id = el.created_by \
INNER JOIN leave_type_master ltm ON ltm.leave_type_master_id = el.leave_type_master_id \
INNER JOIN leave_status ls ON ls.leave_status_id = el.leave_status_id  \
 WHERE el.leave_status_id = 1 AND el.manager_id IN (WITH recursive my_reportees as \
	( 	SELECT emp_id from employee where emp_id = :managerId \
        UNION \
        SELECT e.emp_id from my_reportees mr INNER JOIN employee e ON e.manager_id = mr.emp_id \
    ) \
SELECT emp_id from my_reportees)

