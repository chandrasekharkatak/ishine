ProjectManagerMapping.findProjectManagersByPoProjectId = select pmm.project_manager_id,e.name, \
CASE \
        WHEN e.is_consultant = TRUE THEN CONCAT('CS-', e.employeement_id) \
        ELSE CONCAT('A-', e.employeement_id) \
    END AS employmentId \
from project_manager_mapping pmm \
inner join employee e on e.emp_id = pmm.project_manager_id \
inner join projects p on p.project_id = pmm.project_id \
where p.po_project_id = :id and pmm.active = 1

Project.getEmployeeInformation = SELECT e.emp_id, \
    CASE \
        WHEN e.is_consultant = TRUE THEN CONCAT('CS-', e.employeement_id) \
        ELSE CONCAT('A-', e.employeement_id) \
    END AS employmentId, \
    e.name, \
    CONCAT( \
        FLOOR(e.total_experience), '.', \
        LPAD(SUBSTRING_INDEX(e.total_experience, '.', -1), 2, '0') \
    ) AS previousExperience, \
    CONCAT( \
        FLOOR(TIMESTAMPDIFF(MONTH, e.date_of_joining, CURDATE()) / 12), \
        '.', \
        LPAD(MOD(TIMESTAMPDIFF(MONTH, e.date_of_joining, CURDATE()), 12), 2, '0') \
    ) AS currentExperience, \
    CONCAT( \
        FLOOR( \
            (FLOOR(e.total_experience) * 12 + CAST(LPAD(SUBSTRING_INDEX(e.total_experience, '.', -1), 2, '0') AS UNSIGNED)) + \
            TIMESTAMPDIFF(MONTH, e.date_of_joining, CURDATE()) \
        ) DIV 12, \
        '.', \
        LPAD( \
            ( \
                (FLOOR(e.total_experience) * 12 + CAST(LPAD(SUBSTRING_INDEX(e.total_experience, '.', -1), 2, '0') AS UNSIGNED)) + \
                TIMESTAMPDIFF(MONTH, e.date_of_joining, CURDATE()) \
            ) MOD 12, \
            2, \
            '0' \
        ) \
    ) AS totalExperience, \
    e.billable_type, jr.name AS jobRole, d.name AS DepartmentName , etm.start_date AS StartDate \
FROM employee e  \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
INNER JOIN employee_team_mapping etm on etm.emp_id = e.emp_id \
WHERE e.emp_id = :empId

