INNER JOIN employee_timesheets et ON et.timesheet_id = map.timesheet_id \
INNER JOIN employee e ON e.emp_id = et.emp_id \
INNER JOIN employee e2 ON e2.emp_id = e.manager_id \
INNER JOIN client_locations cl ON cl.client_location_id = map.client_location_id \
WHERE map.timesheet_id = :timesheetId


