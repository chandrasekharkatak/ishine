EmployeeTimesheetsNew.getAllMyTeamTimesheets=SELECT et.timesheet_id, et.date, dtm.day_type, e.name AS employee_name, et.description, \
et.total_activities_minutes, sm.status_id AS status_id, sm.status AS status_name, creator.name AS created_by_name, et.created_on, \
et.emp_id, et.work_in_time, et.work_out_time, et.total_working_minutes, et.leave_type_master_id, ltm.leave_type, pts.project_id, \
pts.is_night_shift, pts.client_approval_status, csm.status AS client_approval_status_name, pts.shadow_emp_id, pts.total_client_working_minutes, \
ecsm.client_side_id, CASE WHEN ecsm.client_side_id IS NOT NULL THEN 1 ELSE 0 END AS has_client_side_id, trd.remarks AS rejection_reason \
FROM employee_timesheets_new et \
INNER JOIN employee e ON e.emp_id = et.emp_id \
INNER JOIN employee creator ON creator.emp_id = et.created_by \
LEFT JOIN day_type_master_new dtm ON dtm.day_type_id = et.day_type_id \
LEFT JOIN status_master_new sm ON sm.status_id = et.status \
LEFT JOIN leave_type_master ltm ON ltm.leave_type_master_id = et.leave_type_master_id \
LEFT JOIN project_timesheet_status_new pts ON pts.timesheet_id = et.timesheet_id \
LEFT JOIN client_status_master_new csm ON csm.status_id = pts.client_approval_status \
LEFT JOIN employee_client_side_id_mapping_new ecsm ON ecsm.emp_id = et.emp_id AND ecsm.project_id = pts.project_id AND ecsm.active = 1 \
LEFT JOIN timesheet_rejection_details_new trd ON trd.timesheet_id = et.timesheet_id AND trd.project_id = pts.project_id \
WHERE et.created_by = :createdBy AND et.emp_id != :createdBy AND et.date BETWEEN :start AND :end \
ORDER BY et.date DESC


