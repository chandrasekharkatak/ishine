Employee.getEmployeesByRole = SELECT e.emp_id,e.name,jr.name jobRoleName, d.dept_id FROM employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
where jr.job_role_id = :jobRoleId AND e.employmentstatus not like 'InActive'

Employee.getAllEmployeesByDepartmentIds = SELECT e.emp_id,e.name,jr.name jobRoleName,d.dept_id,d.name departmentName,jr.job_role_id FROM employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
WHERE d.dept_id IN :deptIds AND e.employmentstatus not like 'InActive'

