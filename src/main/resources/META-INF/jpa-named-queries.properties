Project.getBenchEmployeeMoreThan30Days = SELECT distinct e.emp_id, e.name, case when e.is_apmosys_product = 'true' then CONCAT('AP-', e.employeement_id) else CONCAT('A-', e.employeement_id) end AS employment_id, e.billable, e.billable_type, d.name AS departmentname, p.project_id, p.project_name, p.po_project_id, p.po_start_date, p.po_end_date, p.apmosysrm, p.clientrm, p.po_project_type, p.po_no, c.client_name, t.team_id, t.team_name, t.is_active, etm.employee_role, etm.active,m.emp_id AS project_manager_id,m.name AS project_manager_name, STR_TO_DATE(etm.start_date, '%Y-%m-%d') AS onbench_datetime, \
TIMESTAMPDIFF(DAY, STR_TO_DATE(etm.start_date, '%Y-%m-%d'), CURRENT_DATE()) AS days_on_bench FROM employee_team_mapping etm \
inner JOIN employee e ON e.emp_id = etm.emp_id \
inner JOIN job_role jr ON e.job_role_id = jr.job_role_id \
inner JOIN department d ON jr.dept_id = d.dept_id \
inner JOIN teams t ON etm.team_id = t.team_id \
inner JOIN projects p ON t.project_id = p.project_id \
inner JOIN clients c ON p.client_id = c.client_id \
inner JOIN project_manager_mapping pm ON pm.project_id = p.project_id \
inner JOIN employee m ON m.emp_id = pm.project_manager_id \
WHERE 1=1 \
    AND etm.active != 0 \
    AND internal_project_type = 'Bench' \
    AND t.is_active = 'Y' \
    AND p.active = 'true' \
    AND DATEDIFF(CURDATE(), etm.start_date) > 30 \
    AND e.employmentstatus != 'InActive' \
    AND e.billable_type = 'Bench' \
    AND pm.active = 1 

