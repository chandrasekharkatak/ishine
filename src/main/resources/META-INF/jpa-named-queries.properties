Project.getProjectInfo = select p.project_id, p.project_name, p.project_manager_id, ep.name, c.client_name, \
p.client_location,p.po_project_type,p.internal_project_type,CASE \
	WHEN p.is_draft_project = 'true' THEN 'Pending For Approval' \
	WHEN p.is_draft_project = 'false' THEN 'Approved' \
	WHEN p.is_draft_project = 'Rejected' THEN 'Rejected' \
	WHEN p.is_draft_project = 'Completed' THEN 'Completed' \
	WHEN p.is_draft_project = null THEN 'Not Started' \
 	ELSE 'Un Mentioned Test Data' \
END \
from projects p \
inner join employee ep on ep.emp_id = p.project_manager_id \
inner join clients c on c.client_id = p.client_id \
where p.project_id = :projectId

Project.getProjectInfoByProjectId=SELECT p.project_id, p.project_name,\
    GROUP_CONCAT(DISTINCT emm.project_manager_id) AS project_manager_ids, \
    GROUP_CONCAT(DISTINCT ep.name SEPARATOR ', ') AS project_manager_names,\
    c.client_name, p.client_location,p.po_project_type,p.internal_project_type,\
    CASE \
        WHEN p.is_draft_project = 'true' THEN 'Pending For Approval' \
        WHEN p.is_draft_project = 'false' THEN 'Approved' \
        WHEN p.is_draft_project = 'Rejected' THEN 'Rejected'\
        WHEN p.is_draft_project = 'Completed' THEN 'Completed'\
        WHEN p.is_draft_project IS NULL THEN 'Not Started' \
        ELSE 'Un Mentioned Test Data'\
    END AS project_status \
FROM projects p \
LEFT JOIN project_manager_mapping emm ON emm.project_id = p.project_id AND emm.active = 1 \
LEFT JOIN employee ep ON ep.emp_id = emm.project_manager_id \
LEFT JOIN clients c ON c.client_id = p.client_id \
WHERE p.project_id = :projectId \
GROUP BY p.project_id, p.project_name, c.client_name, p.client_location,p.po_project_type, p.internal_project_type, p.is_draft_project


Project.getPoProjectInfo = select p.project_id, p.project_name, p.project_manager_id, ep.name, c.client_name, \
p.client_location,p.po_project_type,p.internal_project_type ,CASE \
	WHEN p.is_draft_project = 'true' THEN 'Pending For Approval' \
	WHEN p.is_draft_project = 'false' THEN 'Approved' \
	WHEN p.is_draft_project = 'Rejected' THEN 'Rejected' \
	WHEN p.is_draft_project = 'Completed' THEN 'Completed' \
	WHEN p.is_draft_project = null THEN 'Not Started' \
 	ELSE 'Un Mentioned Test Data' \
END \ \
from projects p \
inner join employee ep on ep.emp_id = p.project_manager_id \
inner join clients c on c.client_id = p.client_id \
where p.po_project_id = :poProjectId

Project.getPoProjectDetailsForPoProjects = select p.project_id, p.project_name, p.po_no, p.po_start_date, \
p.po_end_date, p.po_project_type, p.po_project_id from projects p where p.po_project_id is not null


Project.getPoProjectDetailsBOthPOAndInternal = select p.project_id, p.project_name, p.po_no, p.po_start_date, \
p.po_end_date, p.po_project_type, p.po_project_id from projects p where active = 'true'

Project.getExpiredPoProjects = select distinct p.po_no,d.name, p.project_name,p.po_start_date,p.po_end_date,p.apmosysrm,p.is_renewable, \
p.po_project_type,h.email as hodMail,p.po_project_id from employee e \
inner join employee_team_mapping etm on e.emp_id = etm.emp_id \
inner join teams t on etm.team_id = t.team_id \
inner join projects p on t.project_id = p.project_id \
inner join job_role jr on jr.job_role_id = e.job_role_id \
inner join department d on jr.dept_id = d.dept_id \
INNER JOIN employee h ON h.emp_id = d.hod_id \
where p.active = 'true' and t.is_active = 'Y' and e.employmentstatus != 'InActive' \
and etm.active != 0 AND p.po_end_date < current_date 

Project.getEmployeesByPoProjectId = select distinct e.name,e.employeement_id, e.email from employee e \
inner join employee_team_mapping etm on e.emp_id = etm.emp_id \
inner join teams t on etm.team_id = t.team_id \
inner join projects p on t.project_id = p.project_id \
inner join job_role jr on jr.job_role_id = e.job_role_id \
inner join department d on jr.dept_id = d.dept_id \
where p.active = 'true' and t.is_active = 'Y' and e.employmentstatus != 'InActive' and etm.active != 0 \
and p.po_project_id is not null and p.po_end_date < current_date() \
and p.po_project_id = :poProjectId
 
Project.getExpiredPoProjectsWithoutInterval = SELECT e.name AS employee_name, p.project_name, t.team_name, p.po_start_date, \
p.po_end_date, etm.start_date, p.project_id, h.email as hodMail, e.email \
FROM projects p INNER JOIN teams t ON t.project_id = p.project_id \
INNER JOIN employee_team_mapping etm ON etm.team_id = t.team_id \
INNER JOIN employee e ON etm.emp_id = e.emp_id \
INNER JOIN job_role j ON j.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = j.dept_id \
INNER JOIN employee h ON h.emp_id = d.hod_id \
WHERE p.po_project_id IS NOT NULL AND p.active != "false" AND t.is_active != 'N' AND etm.active != 0 \
AND DATE(p.po_end_date) < CURRENT_DATE 
 
Project.getEmployeeEmailsByProjectId = SELECT e.email FROM employee e \
LEFT JOIN employee_team_mapping etm ON e.emp_id = etm.emp_id \
Inner JOIN teams t ON t.team_id = etm.team_id \
