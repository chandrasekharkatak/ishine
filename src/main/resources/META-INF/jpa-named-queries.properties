Timesheet.getAllLeaveTimesheetsWithoutLeaveApplication = SELECT e1.employeement_id,e1.name employee, et.date, et.day_type, et.description, et.status, \
ltm.leave_type, em.name as managerName, d.name as departmentName, et.created_on, et.updated_on, e2.name statusUpdatedBy \
FROM employee_timesheets et \
INNER JOIN employee e1 on et.emp_id = e1.emp_id \
LEFT JOIN employee e2 on et.timesheet_status_updated_by = e2.emp_id \
LEFT JOIN employee em on em.emp_id = e1.manager_id \
LEFT JOIN job_role jr on e1.job_role_id=jr.job_role_id \
LEFT JOIN department d on jr.dept_id = d.dept_id \
LEFT JOIN leave_type_master ltm ON ltm.leave_type_master_id = et.leave_type_master_id \
WHERE et.day_type = "Leave" AND et.leave_type_master_id IS NULL AND et.date >= :start AND et.date <= :end \
ORDER BY e1.employeement_id ASC, et.date ASC

Timesheet.getInactiveActivitiesByTimesheetId = SELECT map.timesheet_activity_map_id \
