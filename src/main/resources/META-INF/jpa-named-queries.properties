Employee.getEmployeeByEmpId= SELECT e.emp_id, e.aadhar , e.about_me,e.address,e.bank_account_no,e.bankifsccode,e.bank_name, \
e.blood_group,e.city,e.country,e.date_of_birth,e.date_of_joining,e.email,e.emergency_contact_mobile, \
e.employmentstatus,e.esic_number,e.father_name,e.gender,e.graduation_type,e.pursuing,e.landline,e.marital_status \
,e.mobile_no,e.mother_tongue,e.name,e.notice_period,e.alternate_mobile_no,e.pan_number,e.passport_number, \
e.permanent_address,e.pf_account_number,e.pincode,e.place_of_birth,e.passing_grade, \
e.previous_pf_account_number,e.relation,e.state,e.uan,e.views_on_organisation,e.year_of_passing, \
e.pincode as p,e.emergency_contact_person,e.profile_image_name, \
em.name as manager, j.name as jobrole , d.name as department , d.dept_id , j.job_role_id ,e.manager_id, e.work_location, \
e.experience, e.role, e.employeement_id, e.probation_period, e.date_of_resign, \
e.billable,e.child1,e.child2,e.child3,e.mothers_name,e.spouse,e.total_experience , e.secondary_email,e.date_of_relieving, e.reporting_manager_id, e.approvals_to,rm.name as reportingManager,e.designation_id,de.designation_name,e.employment_release_status, e.billable_type,e.is_consultant,e.is_apprenticeship,e.refered_type,e.refered_name,e.employee_confirmation_date,e.is_apmosys_product , e.on_roll_date as onRollDate \
FROM employee e  \
INNER JOIN employee em ON e.manager_id = em.emp_id \
INNER JOIN job_role j ON j.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = j.dept_id \
LEFT JOIN employee rm ON e.reporting_manager_id = rm.emp_id \
LEFT JOIN designation de ON de.designation_id = e.designation_id \
WHERE e.emp_id = :empId 


Employee.getAllEmployees =SELECT e.employeement_id as employeementId, e.aadhar, e.about_me as aboutMe, e.address, e.bank_account_no as bankAccountNo, e.bankifsccode, \
e.bank_name as bankName, e.blood_group as bloodGroup, e.city, e.country, e.created_by as createdBy, e.created_on as createdOn, e.date_of_birth as dateOfBirth, \
e.date_of_joining as dateOfJoining, e.email, e.emergency_contact_mobile as emergencyContactMobile, e.emergency_contact_person as emergencyContactPerson, \
e.employmentstatus, e.esic_number as esicNumber, e.father_name as fatherName, e.gender, e.graduation_type as graduationType, e.pursuing, \
e.job_role_id as jobRoleId, e.landline, e.manager_id as managerId, e.marital_status as maritalStatus, e.mobile_no as mobileNo , e.mother_tongue as motherTongue, e.name, \
e.notice_period as noticePeriod, e.alternate_mobile_no as alternateMobileNo,  e.pan_number as panNumber, e.passport_number as passportNumber, \
e.permanent_address as permanentAddress, e.pf_account_number as pfAccountNumber, e.pincode, e.place_of_birth as placeOfBirth, e.passing_grade as passingGrade, \
e.previous_pf_account_number as previousPfAccountNumber, e.relation, e.state, e.uan, \
e.views_on_organisation as viewsOnOrganisation, e.year_of_passing as yearOfPassing, \
jr.dept_id as deptId, jr.name as jobrolename, \
d.name as departmentname, e.work_location as workLocation, e.probation_period as probationPeriod, e.emp_id as empId, e2.name as manager, e.experience, \
e.billable,e.child1,e.child2,e.child3,e.mothers_name as mothersName,e.spouse,e.total_experience as totalExperience,e.date_of_resign  as dateOfResign, e.invalid_access_attempt as invalidAccessAttempt, e.date_of_relieving as dateOfRelieving, jr.name as JobRolename, e3.name as updatedByName, e4.name as createdByName, e.updated_on as updatedOn, e.is_timesheet_lock_check_enable as istimesheetLockCheckEnable, e.employment_release_status as employmentReleaseStatus , e.pip_flag as pipFlag,p.pip_id as pipId,e.billable_type as billableType, \
emp_proj_client.project_name as projectName, emp_proj_client.client_name as clientName,emp_proj_client.team_name as teamName, des.designation_name as designationName, e.is_consultant as isConsultant, \
e.is_apprenticeship as isApprenticeship,e.reporting_manager_id as reportingManagerId, e5.name AS reportingManger, jr.employee_role as employeeRole, e.refered_type as referedType, e.refered_name as referedName, \
e.employee_confirmation_date as employeeConfirmationDate, d.hod_id as hodId, e7.name AS hodName, d.name AS hodDepartmentName,emp_proj_client.project_id as projectIds, e.updated_by as updatedBy, \
e.is_apmosys_product as isApmosysProduct,e.is_confirmed_clicked as isConfirmedClicked,e.is_extension_clicked as isExtensionClicked,sum(el.no_of_days) as noOfDays , e.on_roll_date as onRollDate \
FROM employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
LEFT JOIN employee e3 on e.updated_by = e3.emp_id \
LEFT JOIN employee e4 on e.created_by = e4.emp_id \
LEFT JOIN pip p ON p.pip_id=e.pip_id \
LEFT JOIN (SELECT etm.emp_id,GROUP_CONCAT(DISTINCT pr.project_id ORDER BY pr.project_id SEPARATOR ',') AS project_id,GROUP_CONCAT(DISTINCT pr.project_name ORDER BY pr.project_id SEPARATOR ',') AS project_name, GROUP_CONCAT(DISTINCT cl.client_name) AS client_name, \
GROUP_CONCAT(DISTINCT t.team_name) AS team_name \
FROM employee_team_mapping etm \
LEFT JOIN teams t ON t.team_id = etm.team_id \
LEFT JOIN projects pr ON pr.project_id = t.project_id \
LEFT JOIN clients cl ON cl.client_id = pr.client_id \
WHERE etm.active != 0 AND t.is_active != 'N' \
AND pr.active != 'false' \
GROUP BY etm.emp_id) emp_proj_client ON emp_proj_client.emp_id = e.emp_id \
INNER JOIN employee e2 ON e.manager_id = e2.emp_id \
INNER JOIN employee e7 ON d.hod_id = e7.emp_id \
LEFT JOIN employee e5 ON e.reporting_manager_id = e5.emp_id \
LEFT JOIN designation des ON des.designation_id = e.designation_id \
LEFT JOIN employee_leave el ON el.emp_id = e.emp_id and el.leave_status_id in (1,2) \
GROUP BY e.emp_id \
order by e.name


Employee.getEmployeeInProbation = SELECT e.* \
FROM employee e \
INNER JOIN job_role jr ON e.job_role_id = jr.job_role_id \
INNER JOIN department d ON jr.dept_id = d.dept_id \
INNER JOIN employee hod ON d.hod_id = hod.emp_id \
WHERE e.employmentstatus NOT LIKE 'InActive' AND DATEDIFF(CURDATE(), e.date_of_joining) < e.probation_period

Employee.getEmployeeInProbationExtended = SELECT e.* \
FROM employee e \
INNER JOIN job_role jr ON e.job_role_id = jr.job_role_id \
INNER JOIN department d ON jr.dept_id = d.dept_id \
INNER JOIN employee hod ON d.hod_id = hod.emp_id \
WHERE e.employmentstatus NOT LIKE 'InActive' AND DATEDIFF(CURDATE(), e.date_of_joining) > e.probation_period

