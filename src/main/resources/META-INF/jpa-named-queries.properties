Employee.getAllTeamMemberView = SELECT distinctrow e.emp_id, e.name, e.email, jr.name as jobrolename, e.mobile_no, e.employeement_id, e.employmentstatus from employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN employee em ON e.manager_id = em.emp_id \
INNER JOIN employee_team_mapping etm ON etm.emp_id = e.emp_id \
INNER JOIN teams t ON t.team_id = etm.team_id \
INNER JOIN projects p ON p.project_id = t.project_id \
WHERE p.project_id IN(SELECT sp.project_id FROM employee self \
	INNER JOIN employee_team_mapping setm ON setm.emp_id = self.emp_id \
	INNER JOIN teams st ON st.team_id = setm.team_id \
	INNER JOIN projects sp ON sp.project_id = st.project_id \
    WHERE self.emp_id = :empId) \
AND e.emp_id != :empId AND e.employmentstatus not like 'InActive' order by e.name

Employee.getAllHolidayByEmpWorkLocation = SELECT h.occasion, h.day_of_the_week, h.date_of_holiday, h.state, optional_holiday from holiday h \
INNER JOIN employee e ON e.work_location = h.state \
WHERE e.emp_id = :empId \
UNION ALL \
SELECT h.occasion, h.day_of_the_week, h.date_of_holiday, h.state, optional_holiday from holiday h \
WHERE h.state = 'all' AND h.holiday_type != 'WeekOff'\
order by date_of_holiday ASC

Employee.getAllEmployeesBirthDayToday = SELECT e.name as employee, d.name as department FROM employee e \
INNER JOIN job_role j ON j.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = j.dept_id \
WHERE MONTH(e.date_of_birth) = MONTH(NOW()) AND DAY(e.date_of_birth) = DAY(NOW()) AND e.employmentstatus not like 'InActive'

Employee.getEmployeeInfoOnLogin = SELECT e.emp_id,e.name,e.date_of_joining,e.employmentstatus,e.manager_id,e.gender,d.dept_id,e.employeement_id,e.is_new, \
e.is_user_info_updated,e.is_appreciation_enable, d.name as department, e.date_of_resign FROM employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = jr.dept_id \
WHERE e.email = :email

Employee.getHierarchyByEmpId = SELECT e.emp_id, e.name, e.email, jr.name as jobrolename, e.mobile_no, em.name as manager, e.employeement_id, e.invalid_access_attempt from employee e \
INNER JOIN job_role jr ON jr.job_role_id = e.job_role_id \
INNER JOIN employee em ON e.manager_id = em.emp_id \
WHERE e.employmentstatus not like 'InActive' AND e.manager_id IN (WITH my_reportees as \
	( 	SELECT emp_id from employee where emp_id = :empId \
    ) \
SELECT emp_id from my_reportees)

Employee.getEmployeeData = SELECT em.name as manager, j.name as jobrole , d.name as department, e.employmentstatus \
FROM employee e \
INNER JOIN employee em ON e.manager_id = em.emp_id \
INNER JOIN job_role j ON j.job_role_id = e.job_role_id \
INNER JOIN department d ON d.dept_id = j.dept_id \
WHERE e.emp_id = :empId

Employee.getEmployeeInProbationAndNotice = SELECT e.employeement_id, e.name, ee.email, e.probation_period, e.notice_period, e.date_of_joining, e.date_of_resign \
from employee e \
INNER JOIN job_role jr on e.job_role_id = jr.job_role_id \
INNER JOIN department d on jr.dept_id = d.dept_id \
INNER JOIN employee ee on d.hod_id = ee.emp_id \
WHERE e.employmentstatus not like 'InActive' AND DATEDIFF(now(), e.date_of_joining) < e.probation_period OR DATEDIFF(now(), e.date_of_resign) < e.notice_period

Employee.getManagerEmail = SELECT e.email as employee_mail , ee.email as manager_mail,e.name,e.employeement_id FROM employee e \
INNER JOIN employee ee ON ee.emp_id = e.manager_id \
WHERE e.emp_id = :empId

