Employee.getEmployeeInProbationAndNotice = SELECT e.employeement_id, e.name, ee.email, e.probation_period, e.notice_period, e.date_of_joining, e.date_of_resign \
from employee e \
INNER JOIN job_role jr on e.job_role_id = jr.job_role_id \
INNER JOIN department d on jr.dept_id = d.dept_id \
INNER JOIN employee ee on d.hod_id = ee.emp_id \
WHERE e.employmentstatus not like 'InActive' AND (DATEDIFF('2023-02-19', e.date_of_joining) < e.probation_period OR DATEDIFF('2023-02-19', e.date_of_resign) < e.notice_period)

Employee.getEmployeeInProbation = SELECT e.* \
