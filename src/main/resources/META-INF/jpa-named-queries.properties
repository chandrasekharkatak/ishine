Employee.getEmployees =  select e1.emp_id,e1.employeement_id,(e.name) as managername,e1.name,e1.email,e.email as managerMail,e1.employmentstatus from employee e inner join employee e1 on \
 e.emp_id=e1.manager_id where e.employmentstatus not like 'InActive' 
 
Employee.getAllManagers = SELECT distinct e.manager_id FROM employee e \
WHERE e.manager_id IS NOT null

Employee.findEmployeeWorkingHistory = SELECT distinctrow e.emp_id,e.name as emp_name,t.team_id , t.team_name , t.team_lead_id ,\
 p.project_id ,p.project_name , p.start_date ,p.end_date , et.name as team_lead_name, e.date_of_joining , e.date_of_resign , e.role, j.name as designation , p.start_date as Assign_date_as_TL ,  p.client_location , p.client_name  \
 FROM employee e \
 INNER JOIN employee_team_mapping etm on e.emp_id=etm.emp_id \
 INNER JOIN teams t on etm.team_id=t.team_id \
 INNER JOIN  employee et on et.emp_id = t.team_lead_id \
 INNER JOIN projects p on t.project_id=p.project_id \
 INNER JOIN job_role j on j.job_role_id = et.job_role_id \
 WHERE e.emp_id = :empId
 
Employee.getEmployeeDetailForCron = SELECT e.emp_id, e.work_location, e.name, e.employeement_Id from employee e \
WHERE e.employmentstatus not like 'InActive'

Employee.getAllActiveEmployees = SELECT e.* from employee e \
WHERE e.employmentstatus not like 'InActive'
 
