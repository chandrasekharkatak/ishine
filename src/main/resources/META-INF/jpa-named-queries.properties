Project.getAllProject = SELECT p.project_id, e.name as employee, \
p.project_name, p.state, d.name as department, c.client_name, cl.client_location, c.client_id, cl.client_location_id, createdBy.name as createdByName, p.created_on, p.updated_on, updatedBy.name as updatedByName from employee e \
RIGHT JOIN projects p on p.project_manager_id = e.emp_id \
INNER JOIN clients c on p.client_id = c.client_id \
INNER JOIN client_locations cl on cl.client_id = c.client_id \
LEFT JOIN project_department_map pdm on pdm.project_id = p.project_id \
LEFT JOIN department d on d.dept_id = pdm.dept_id \
LEFT JOIN employee createdBy ON createdBy.emp_id = p.created_by \
LEFT JOIN employee updatedBy ON updatedBy.emp_id = p.updated_by \
WHERE p.active = 'true' AND p.is_draft_project = 'false'

Project.findProjectByIsDraftProject = SELECT p.project_id, p.project_name, e.name as ProjectManager, e.emp_id as ProjectManagerId, c.client_name, p.state, p.is_draft_project, p.po_project_id from projects p \
INNER JOIN employee e ON p.project_manager_id = e.emp_id \
INNER JOIN clients c ON p.client_id = c.client_id \
WHERE p.is_draft_project = 'true' OR p.is_draft_project = 'Rejected'

Project.getAllMyProjectByEmpId = SELECT distinctrow t.project_id, p.project_name,p.state, p.project_manager_id, d.name as DepartmentName \
FROM teams t \
LEFT JOIN employee e1 ON e1.emp_id = t.created_by \
LEFT JOIN projects p ON p.project_id = t.project_id \
INNER JOIN project_department_map pdm ON pdm.project_id = p.project_id \
INNER JOIN department d ON d.dept_id = pdm.dept_id \
WHERE t.created_by =:empId OR p.project_manager_id =:empId OR t.team_lead_id =:empId

