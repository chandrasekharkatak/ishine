Configuration:
  status: WARN
  name: Log4j2Config

  Appenders:
    Console:
      name: ConsoleAppender
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"

  Loggers:
    Root:
      level: info
      AppenderRef:
        - ref: ConsoleAppender

    Logger:
      - name: com.example.logdemo
        level: debug
        additivity: false
        AppenderRef:
          - ref: ConsoleAppender
