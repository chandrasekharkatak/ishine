#datasource configurations
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:1998/employee_portal_dump
spring.datasource.username=root
spring.datasource.password=root@123

file.location.image=D:\\images\\

#Connection pool
spring.datasource.hikari.maximum-pool-size = 10

#Logging properties
logging.file.name=D:\\logs\\ishineportal.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.console=[%thread] %d{yyyy-MM-dd HH:mm:ss} - %msg%n 
logging.file.max-size=5MB
logging.pattern.rolling-file-name=D:\\logs\\ishineportal-%d{yyyy-MM-dd}.%i.log
logging.file.max-history=7